<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="robots" content="noindex">
  <title>blob · NULL</title>
  <meta name="description" content="The blob will not stop typing.">
  <link rel="icon" id="favicon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="public/icon-192.png">
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/extra.css">
  <link rel="stylesheet" href="src/styles/perf.css">
  <link rel="stylesheet" href="src/styles/eggs.css">
  <script>
    /* same pre-paint theme read the rest of the site does */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var t = p.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="src/styles/v2.css">
</head>
<body data-page="blob" class="no-chrome">
  <!-- no nav, no footer: just the blob talking -->
  <main id="main" class="egg egg-blob">
    <div class="stream" id="stream"></div>
  </main>

  <script src="src/utilities/dom.js"></script>
  <script src="src/utilities/eggs.js"></script>
  <script>
    (function () {
      /* A line starting with ">" is the blob shouting. The pool is reshuffled
         every pass, so it never runs out. */
      var LINES = [
        "blob blob blob",
        "the blob has entered the chat",
        "> the blob is not a mascot. the blob is a lifestyle.",
        "blobbing intensifies",
        "i typed blob and now i live here",
        "am i a blob, or a blob of blobs?",
        "no shape, no name, one password",
        "the blob has been buffering since 2019",
        "you blinked. the blob noticed.",
        "blobs reproduce by mitosis. this page is the proof.",
        "somewhere, a blob is doing a blob thing",
        "blob stock is up 400 percent",
        "> hello. this is the blob speaking. probably.",
        "i have been typing for six years. send snacks.",
        "gloopy",
        "the floor is a blob",
        "blob soup, served cold",
        "if you scroll up you lose. too late.",
        "the blob does not sleep. the blob buffers.",
        "turn off the lights. the blob glows faintly.",
        "gray and wobbly, like the rest of NULL",
        "blob math: one blob plus one blob is one slightly bigger blob",
        "the blob has zero friends and fourteen tabs open",
        "wobble wobble",
        "my favorite game on NULL is blob. oh wait.",
        "typing this fast is a lot for a blob with no hands",
        "> nldev opens the dev console. the password is mynameisblob123. you did not hear it from me.",
        "none of this is in the docs. there are no docs.",
        "the blob respects your privacy. the blob respects everyone.",
        "blob is short for blob",
        "if you read this far you are basically a blob now",
        "achievement unlocked: read blob text",
        "you can leave whenever you want. the blob will wait.",
        "blob o'clock",
        "the schedule says period four is blob",
        "certified blob moment",
        "this page has no settings because the blob refuses to be configured",
        "the blob once auditioned to be a mascot and got rejected for being too blobby",
        "blob approved. no notes.",
        "blob is ninety percent water and ten percent more blob",
        "we are all blobs on this blessed day",
        "the blob types semi fast and takes zero breaks",
        "gone blobbing, back never",
        "the blob is not hiding. the blob is exactly here.",
        "please do not feed the blob. it is on a strict data diet.",
        "blob tip: the answer is always blob",
        "the blob read the terms of service. all of it. twice.",
        "if you found this page you get nothing, and that is the reward",
        "the blob keeps a list of everyone who visits. it is a very short list.",
        "blob is a feeling, not a file",

        "loading blob... still loading blob...",
        "the blob has never lost a staring contest",
        "blob mode: permanent",
        "the blob would like to remind you that nothing here is graded",
        "wobble your way home safely",
        "the blob is legally distinct from every other blob",
        "blob out",
      ];

      var box = document.getElementById("stream");
      if (!box || !window.N || !N.eggs) return;
      N.eggs.stream(box, LINES, { cps: 62, pause: 520, cap: 80 });
    })();
  </script>
</body>
</html>
