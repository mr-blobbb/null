# What is NULL?

NULL is a plain black-and-white web hub for **games**, **apps**, **proxies** and useful tools. It is designed to feel like one cohesive platform — flat surfaces, hairline borders and a grayscale identity that keeps its focus on the content.

## The idea

- **Games & apps** are discovered automatically from their folders. Drop a folder with an HTML file into `games/`, rebuild the catalog, and it appears with its own labels, thumbnail and optional warning.
- **Proxies** are treated differently on purpose: they link out to external sites in a new tab. NULL never pretends an external site is part of NULL.
- **The player** is shared. Games and apps open inside the same NULL shell with fullscreen, warnings and tab-preset overrides.
- **Your data stays local.** Favorites, recently played, themes and settings are stored with `localStorage` on the device you are using. No server, no account, nothing uploaded.

## Nice-to-know details

- Pages ship as plain HTML with a shared CSS design system — no framework required.
- The site is fully static and runs on GitHub Pages. The "releases" folder contains single-file builds: NULL Mini, NULL Lite and NULL Regular.
- If the domain ever goes down, check the [Backups](/backups) page for the next places to look.
- Tab presets (Google Slides style by default), accents and a performance mode are all configurable in [Settings](/settings).
