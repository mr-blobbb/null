# Hey, you found NULL

NULL is a black-and-white little corner of the internet holding a few thousand games, a handful of apps, some proxy links, and a school schedule that actually knows what period it is. Everything runs in your browser. Everything matches: same flat gray, same thin borders, same glass panels. Nothing blinks at you begging for a click.

It was built by a student, for students, mostly because the alternatives were ugly or blocked. So this one is neither.

## The fast version

- **Games**: about 2,300 of them, with labels, warnings where they matter, and a player that just works.
- **Apps**: small tools that open in the same player, like notes and a calculator.
- **Proxies**: links out to other sites. They open in a new tab, because we don't own them and we're not going to pretend we do.
- **Schedule**: your periods, live, with a countdown and a bit of confetti when one ends.
- **Shop**: earn coins by playing, then spend them on themes, particle effects, and a couple of odds and ends. It also sells two things you build yourself: a custom background image and the theme and particle editor. No real money involved, ever.
- **Settings**: a rail down the side of the page with Look and feel, Effects, Layout and speed, Browsing and Your stuff in it, and a filter box for when you cannot remember which card something lives on. Themes, accent, glow border, particles, a background picture, layout compactness, tab disguise, performance mode, Mini-Perf, and a backup button. The cards you only ever set once fold down to a single line that still tells you what they are set to.
- **The editor**: make your own theme pack and particle set. Pick four colors and a tint, choose which backdrop to borrow, then say exactly what drifts through it. The preview is the real thing, not a drawing of it. Once you have made one it shows up in Settings as its own card, where you can recolor it in place or delete it without opening the editor again.

## Where it all comes from

The library isn't a giant hand-written list. It's built by looking at folders:

```
games/hollow-knight/
├── hollow-knight.html     the game itself (index.html works too)
├── hollow-knight.png      optional thumbnail, any image format
├── Label.txt              optional tags, one per line
├── Warning.txt            optional title + description shown before launch
└── meta.txt               optional name, description, added date, #hot
```

Drop a folder in and push, and the game shows up with its own labels, thumbnail, and badges. Nothing to hand-edit: a GitHub Action walks every folder and rebuilds the library for you. Folders starting with `.` or `_` get ignored, and a missing thumbnail quietly falls back to NULL's own placeholder art.

Proxies work the same way with a `proxy.txt` holding a `Link:` line. There's a [Backups](/backups) page too, for when the main domain decides to stop existing.

## How it's built

Here is the part that surprises people: there's no server. None. No backend, no database, no accounts, no login, no analytics, no framework, no build step you have to run to use the site.

- Plain **HTML**, **CSS**, and **JavaScript**. That's the whole thing.
- Your data never leaves your browser. Favorites, history, coins, settings: all in `localStorage`, all on your device. There is nothing to hack because there is nothing of yours stored on our side.
- It's hosted as static files on GitHub Pages, so it loads fast and stays up even when nothing else does. The source is at [github.com/googleslides2026/googleslides2026.github.io](https://github.com/googleslides2026/googleslides2026.github.io) and you are reading it at [googleslides2026.github.io](https://googleslides2026.github.io).
- Every link in here is written relative to the folder it is served from, so you can also download the whole thing and open it from a plain folder of your own.
- The icon font ships with the site, so icons work offline and behind networks that block Google Fonts.
- It's an installable app, and the service worker keeps the shell usable with no connection at all.
- There are three single-file builds in `releases/`: **Regular** (the whole thing, readable), **Mini** (the whole thing, squashed), and **Lite** (no themes, particles, or shop, tuned for the slowest machines).

## Stuff you might not have noticed

- **The panic key.** One keypress hides everything. Find it in Settings and pick your own.
- **Tab disguises.** Make the tab look like a Google Slides doc, a Gmail inbox with an unread count, or a handful of other things.
- **Cloaking.** Open NULL in an `about:blank` or `blob:` tab when a network gets fussy.
- **Marathon mode.** It switches to a random game on a timer so you don't have to pick.
- **Mini-Perf mode.** For a machine that is merely wheezing rather than dying. Nothing is stripped: the browser just stops drawing the parts of the page you cannot see, and picks them back up when you scroll to them.
- **Ultra-Performance mode.** If NULL notices the frame rate falling apart, it offers to strip out every animation and effect. Say yes on a tired Chromebook.
- **Daily stuff.** A crate to open, quests to clear, and achievements that stay unlocked forever.
- **Search everything.** Press `/` anywhere. It digs through games, apps, proxies, announcements, and pages.
- **Seasonal mode.** Off by default, fun when it's on. Holidays ride along with their season, so Fall and Halloween are both there to choose from, and Halloween takes over on its own in late October.

## Who made this

NULL is maintained by Mr Blob, with help from everyone who drops a game in a folder. The platform is open source under the [AGPL-3.0](https://www.gnu.org/licenses/agpl-3.0.txt), which is a fancy way of saying: take it, change it, share it, just keep it open and don't pretend you wrote it.

The games inside it belong to whoever made them, not to us.

## The boring but important part

Read the [Terms](/terms) and the [Privacy Policy](/privacy) if you want the lawyer version. The short version is: be decent, follow your school's rules, and remember that we can't see or save anything you do here.
