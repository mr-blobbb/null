# What is NULL?

NULL is a black-and-white hub for games, apps, proxies and a few handy tools. It runs in your browser and it all stays in one place: same flat look, same thin borders, same grayscale throughout. Nothing here shouts for attention.

## How it works

- **Games and apps** are read straight from their folders. Drop a folder with an HTML file into `games/`, rebuild the catalog, and it turns up with its own labels, thumbnail and optional warning.
- **Proxies** are handled differently on purpose. They open in a new tab, because they aren't ours. NULL won't dress an outside site up as part of NULL.
- **The player** is shared. Games and apps open in the same shell, with fullscreen, warnings and tab-preset overrides.
- **Your data stays on your device.** Favorites, recently played, themes and settings live in `localStorage`, right where you are. No server, no account, nothing uploaded.

## Small details

- Pages are plain HTML over one shared CSS file. No framework, no build step to run the site.
- It's fully static and runs on GitHub Pages. The `releases/` folder has single-file builds: NULL Mini, NULL Lite and NULL Regular.
- If the domain ever goes down, [Backups](/backups) lists the next places to look.
- Tab presets (Google Slides by default), accents and performance mode are all in [Settings](/settings).
