- **NULL does not set cookies.** Not one, not even a cheeky one.
- **What it remembers goes in localStorage,** which is a different thing in the same browser.
- **The service worker caches the site's own files** so it works offline. That is not a cookie either.
- **No consent banner, because there is nothing to consent to.**

# Cookies

The short version: **NULL doesn't use cookies at all.**

## What NULL actually uses

NULL persists a few small preferences in your browser's `localStorage`. This is not the same as a cookie:

- Cookies are sent to a server with every request.
- `localStorage` data never leaves your browser automatically.

NULL's site data is strictly on-device. There is no NULL server to receive cookies, and the site sets no tracking cookies, no advertising cookies and no third-party cookies.

## Third-party destinations

NULL is a *hub*. Games, apps and proxies can belong to other people:

- Content embedded through the NULL player is loaded directly from its own origin: it may set cookies for that origin just like any website.
- Proxy links open external sites in a new tab. Those sites set whatever cookies their own policies describe.

In both cases those cookies belong to the third party, not to NULL, and NULL receives none of them.

## Managing site data

You can inspect and clear everything NULL stores at any time through your browser's site-data settings, or use **Settings → Danger zone → Wipe all NULL data** inside NULL.
