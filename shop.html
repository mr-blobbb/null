  <link rel="stylesheet" href="src/styles/ext.css">
  <link rel="stylesheet" href="src/styles/dev.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var t = p.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
        if (p.glow && p.glow !== "off") document.documentElement.dataset.glow = p.glow;
        /* a retexture redesigns every page, so it has to land before the
           first paint, exactly like the theme */
        if (p.retexture && p.retexture !== "off") document.documentElement.dataset.retexture = p.retexture;
        if (p.labs) document.documentElement.dataset.labs = p.labs;
      } catch (e) {}
    })();
  </script>
</head>
