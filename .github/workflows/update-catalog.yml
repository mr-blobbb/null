# NULL — keep the catalog (and the single-file releases) in step with the
# content folders.
#
# Build-time only. Node runs here on the runner; the deployed site stays plain
# HTML/CSS/JS with no backend and nothing to install. Drop a game in
# games/<name>/ with its .html file, push, and this regenerates
# src/catalog/generated-catalog.js plus releases/null-{regular,mini,lite}.html
# and commits them — GitHub Pages then serves the new library.
#
# Needs Actions enabled with "Read and write permissions" (Settings → Actions →
# General → Workflow permissions). Run it by hand from the Actions tab any time
# with "Run workflow".

name: Update catalog

on:
  push:
    paths:
      - "games/**"
      - "apps/**"
      - "proxies/**"
      - "src/utilities/catalog-tool.js"
      - "scripts/build-catalog.js"
      - "scripts/build-releases.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build tools
        run: npm install --no-audit --no-fund

      - name: Rebuild the catalog
        run: node scripts/build-catalog.js

      - name: Rebuild the single-file releases
        run: node scripts/build-releases.js

      - name: Check internal links
        run: node scripts/check-links.js

      - name: Commit if the library changed
        run: |
          git config user.name "NULL updater"
          git config user.email "actions@users.noreply.github.com"
          git add src/catalog/generated-catalog.js releases
          if git diff --cached --quiet; then
            echo "library is unchanged — nothing to commit"
          else
            git commit -m "chore: refresh catalog and single-file releases"
            git push
          fi
