<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIMON</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box}
  .hud{display:flex;align-items:center;gap:20px;font-size:15px;letter-spacing:.1em}
  .hud button{border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.07);color:#f4f4f5;border-radius:999px;padding:8px 18px;font-size:13px;letter-spacing:.06em;cursor:pointer}
  #board{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(84vw,74vh,380px)}
  .pad{aspect-ratio:1;border-radius:16px;border:1px solid rgba(255,255,255,0.14);background:#16161b;cursor:pointer;transition:background .12s,border-color .12s}
  .pad.lit{background:#f4f4f5;border-color:#f4f4f5}
  #status{font-size:13px;color:rgba(255,255,255,0.5);min-height:18px;letter-spacing:.04em;text-align:center}
  #board.locked .pad{cursor:default}
</style>
</head>
<body>
  <div class="hud"><span id="round">ROUND 0</span><button id="new">new game</button><span id="best">BEST —</span></div>
  <div id="board">
    <button class="pad" data-i="0" aria-label="pad 1"></button>
    <button class="pad" data-i="1" aria-label="pad 2"></button>
    <button class="pad" data-i="2" aria-label="pad 3"></button>
    <button class="pad" data-i="3" aria-label="pad 4"></button>
  </div>
  <div id="status">press new game to start</div>
<script>
(function () {
  var pads = Array.prototype.slice.call(document.querySelectorAll(".pad"));
  var board = document.getElementById("board");
  var roundEl = document.getElementById("round");
  var bestEl = document.getElementById("best");
  var statusEl = document.getElementById("status");

  var seq = [], pos = 0, playing = false, accepting = false;
  var best = null;
  try { best = +localStorage.getItem("simon.best") || null; } catch (e) {}
  if (best) bestEl.textContent = "BEST " + best;

  function lit(pad) {
    pad.classList.add("lit");
    setTimeout(function () { pad.classList.remove("lit"); }, 320);
  }

  function playback() {
    accepting = false;
    board.classList.add("locked");
    statusEl.textContent = "watch…";
    seq.forEach(function (idx, i) {
      setTimeout(function () { lit(pads[idx]); }, 620 * i + 400);
    });
    setTimeout(function () {
      accepting = true;
      pos = 0;
      board.classList.remove("locked");
      statusEl.textContent = "your turn";
    }, 620 * seq.length + 400);
  }

  function next() {
    seq.push((Math.random() * 4) | 0);
    roundEl.textContent = "ROUND " + seq.length;
    playback();
  }

  function press(pad) {
    if (!accepting) return;
    lit(pad);
    var idx = +pad.getAttribute("data-i");
    if (idx !== seq[pos]) {
      accepting = false;
      board.classList.add("locked");
      statusEl.textContent = "wrong pad — round " + seq.length;
      if (!best || seq.length - 1 > best) {
        best = seq.length - 1;
        try { localStorage.setItem("simon.best", best); } catch (e) {}
        bestEl.textContent = "BEST " + best;
      }
      return;
    }
    pos++;
    if (pos === seq.length) {
      accepting = false;
      statusEl.textContent = "nice — round " + seq.length + " cleared";
      setTimeout(next, 900);
    }
  }

  pads.forEach(function (pad) {
    pad.addEventListener("click", function () { press(pad); });
  });

  document.getElementById("new").addEventListener("click", function () {
    seq = [];
    playing = true;
    next();
  });
})();
</script>
</body>
</html>
