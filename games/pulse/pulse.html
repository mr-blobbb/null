<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PULSE</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;overflow:hidden}
  body{display:grid;place-items:center}
  canvas{width:100%;height:100%;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(function () {
  var cv = document.getElementById("c");
  var g = cv.getContext("2d");
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);

  var PW = 12, PH = 74, BALL = 9, MID = 3;
  var lp = 0.5, rp = 0.5, lpv = 0, rpv = 0;   // paddle centers (0..1)
  var ball = { x: 0.5, y: 0.5, vx: 0.0042, vy: 0.003 };
  var scoreL = 0, scoreR = 0, running = false, over = false;
  var vel = 0.0042;

  function size() {
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", size);

  var keys = {};
  addEventListener("keydown", function (e) {
    keys[e.key.toLowerCase()] = true;
    if (e.key === " " || e.key === "p" || e.key === "P") {
      e.preventDefault();
      if (over) { scoreL = scoreR = 0; ball.vx = vel; ball.vy = vel * 0.7; over = false; }
      running = !running;
    }
    if (e.key === "Enter" && over) { scoreL = scoreR = 0; ball.vx = vel; over = false; running = true; }
  });
  addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });

  // touch drag — two halves of the screen
  var drag = { on: false, side: 0, y: 0 };
  cv.addEventListener("pointerdown", function (e) {
    drag.on = true;
    drag.side = e.clientX < innerWidth / 2 ? 0 : 1;
    drag.y = e.clientY;
    e.preventDefault();
  });
  cv.addEventListener("pointermove", function (e) {
    if (!drag.on) return;
    var dy = (e.clientY - drag.y) / innerHeight;
    drag.y = e.clientY;
    if (drag.side === 0) lp = Math.min(0.86, Math.max(0.14, lp - dy));
    else rp = Math.min(0.86, Math.max(0.14, rp - dy));
  });
  cv.addEventListener("pointerup", function () { drag.on = false; });

  function reset(dir) {
    ball = { x: 0.5, y: 0.5, vx: dir * vel, vy: (Math.random() - 0.5) * vel * 0.8 };
    running = false;
  }

  function frame() {
    var px = PH / H;
    if (keys.w || keys.arrowup) lpv = -1;
    else if (keys.s || keys.arrowdown) lpv = 1;
    else lpv = 0;
    if (keys.arrowup) rpv = -1;
    else if (keys.arrowdown) rpv = 1;
    else rpv = 0;
    // simple AI for the right paddle when no local keys pressed
    if (!keys.arrowup && !keys.arrowdown) {
      var target = ball.y + (ball.vx > 0 ? 0 : -0.02);
      rpv = Math.max(-1, Math.min(1, (target - rp) * 14));
    }

    lp += lpv * 0.010; rp += rpv * 0.010;
    lp = Math.max(px / 2, Math.min(1 - px / 2, lp));
    rp = Math.max(px / 2, Math.min(1 - px / 2, rp));

    if (running) {
      ball.x += ball.vx;
      ball.y += ball.vy;
      if (ball.y < BALL / H || ball.y > 1 - BALL / H) ball.vy *= -1;
      var by = ball.y, bx = ball.x;
      var lEdge = 1 / W * (PW / 2 + BALL / 2) * 2;   // paddle zone x
      var rEdge = 1 - lEdge;
      if (bx < lEdge && Math.abs(by - lp) < px / 2 + BALL / H) {
        ball.vx = Math.abs(ball.vx) * 1.03;
        ball.vy += (by - lp) * 0.9;
        ball.x = lEdge;
      } else if (bx > rEdge && Math.abs(by - rp) < px / 2 + BALL / H) {
        ball.vx = -Math.abs(ball.vx) * 1.03;
        ball.vy += (by - rp) * 0.9;
        ball.x = rEdge;
      }
      var m = Math.max(0.0024, Math.min(0.016, Math.abs(ball.vy)));
      ball.vy = Math.max(-m, Math.min(m, ball.vy));
      if (bx < 0) { scoreR++; if (scoreR >= 7) over = true; else reset(1); }
      if (bx > 1) { scoreL++; if (scoreL >= 7) over = true; else reset(-1); }
      if (over) { ball.vx = 0; ball.vy = 0; }
    }

    g.fillStyle = "#0b0b0d";
    g.fillRect(0, 0, W, H);
    g.strokeStyle = "rgba(255,255,255,0.14)";
    g.lineWidth = 1;
    g.setLineDash([6, 10]);
    g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
    g.setLineDash([]);

    var pad = function (cx, x) {
      var y = cx * H - PH / 2;
      g.fillStyle = "rgba(255,255,255,0.95)";
      g.beginPath();
      g.roundRect(x - PW / 2, y, PW, PH, 6);
      g.fill();
    };
    pad(lp, 0);
    pad(rp, W);

    if (over) {
      g.fillStyle = "rgba(255,255,255,0.95)";
      g.font = "700 42px system-ui, sans-serif";
      g.textAlign = "center";
      g.fillText((scoreL > scoreR ? "LEFT" : "RIGHT") + " WINS", W / 2, H / 2 - 22);
      g.font = "400 15px system-ui, sans-serif";
      g.fillStyle = "rgba(255,255,255,0.5)";
      g.fillText("press enter to play again", W / 2, H / 2 + 18);
    } else if (!running) {
      g.fillStyle = "rgba(255,255,255,0.85)";
      g.font = "700 34px system-ui, sans-serif";
      g.textAlign = "center";
      g.fillText("PULSE", W / 2, H / 2 - 26);
      g.font = "400 14px system-ui, sans-serif";
      g.fillStyle = "rgba(255,255,255,0.5)";
      g.fillText("space to serve  ·  W/S or arrows  ·  first to 7", W / 2, H / 2 + 8);
    }

    // ball
    g.fillStyle = "#fff";
    g.beginPath();
    g.arc(ball.x * W, ball.y * H, BALL / 2, 0, 7);
    g.fill();

    // scores
    g.fillStyle = "rgba(255,255,255,0.85)";
    g.font = "700 30px system-ui, sans-serif";
    g.textAlign = "center";
    g.fillText(scoreL, W / 4, 42);
    g.fillText(scoreR, (W / 4) * 3, 42);

    requestAnimationFrame(frame);
  }

  size();
  reset(1);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
