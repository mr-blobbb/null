<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOID</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box}
  .hud{display:flex;align-items:center;gap:20px;font-size:15px;letter-spacing:.1em}
  .hud button{border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.07);color:#f4f4f5;border-radius:999px;padding:8px 18px;font-size:13px;letter-spacing:.06em;cursor:pointer}
  #stage{width:min(92vw,560px);border-radius:14px;border:1px solid rgba(255,255,255,0.14);background:#101014;touch-action:none}
  #status{font-size:13px;color:rgba(255,255,255,0.5);min-height:18px;letter-spacing:.04em;text-align:center}
</style>
</head>
<body>
  <div class="hud"><span id="score">SCORE 0</span><button id="new">new game</button><span id="lives">LIVES ●●●</span></div>
  <canvas id="stage" width="560" height="420"></canvas>
  <div id="status">← → or drag to move · space to launch</div>
<script>
(function () {
  var cv = document.getElementById("stage");
  var g = cv.getContext("2d");
  var scoreEl = document.getElementById("score");
  var livesEl = document.getElementById("lives");
  var statusEl = document.getElementById("status");

  var W = cv.width, H = cv.height;
  var COLS = 10, ROWS = 5, BW = 48, BH = 18, GAP = 8;
  var OX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, OY = 46;

  var paddle, ball, bricks, score, lives, running, raf = null;
  var keys = { left: false, right: false };

  function buildBricks() {
    bricks = [];
    for (var r = 0; r < ROWS; r++)
      for (var c = 0; c < COLS; c++)
        bricks.push({ x: OX + c * (BW + GAP), y: OY + r * (BH + GAP), alive: true, row: r });
  }

  function resetBall() {
    ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 9, vx: 0, vy: 0, stuck: true };
  }

  function build() {
    paddle = { w: 88, h: 10, x: W / 2 - 44, y: H - 26 };
    buildBricks();
    score = 0;
    lives = 3;
    running = false;
    scoreEl.textContent = "SCORE 0";
    livesEl.textContent = "LIVES ●●●";
    statusEl.textContent = "← → or drag to move · space to launch";
    resetBall();
    loop();
  }

  function launch() {
    if (!ball.stuck) return;
    ball.stuck = false;
    ball.vx = (Math.random() < 0.5 ? -1 : 1) * 3.1;
    ball.vy = -3.6;
    running = true;
    statusEl.textContent = "";
  }

  function loop() {
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(step);
  }

  function step() {
    update();
    draw();
    loop();
  }

  function update() {
    if (keys.left) paddle.x -= 6.2;
    if (keys.right) paddle.x += 6.2;
    paddle.x = Math.max(4, Math.min(W - paddle.w - 4, paddle.x));

    if (ball.stuck) { ball.x = paddle.x + paddle.w / 2; ball.y = paddle.y - 9; return; }

    ball.x += ball.vx;
    ball.y += ball.vy;
    if (ball.x < 7) { ball.x = 7; ball.vx *= -1; }
    if (ball.x > W - 7) { ball.x = W - 7; ball.vx *= -1; }
    if (ball.y < 7) { ball.y = 7; ball.vy *= -1; }

    // paddle bounce
    if (ball.vy > 0 && ball.y > paddle.y - 7 && ball.y < paddle.y + paddle.h &&
        ball.x > paddle.x - 6 && ball.x < paddle.x + paddle.w + 6) {
      var hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      ball.vx = hit * 4.4;
      ball.vy = -Math.max(3.2, Math.abs(ball.vy));
    }

    // bricks
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x > b.x - 6 && ball.x < b.x + BW + 6 && ball.y > b.y - 6 && ball.y < b.y + BH + 6) {
        b.alive = false;
        score += 10;
        scoreEl.textContent = "SCORE " + score;
        ball.vy *= -1;
        break;
      }
    }

    if (!bricks.some(function (b) { return b.alive; })) {
      statusEl.textContent = "cleared! +1 life";
      lives++;
      livesEl.textContent = "LIVES " + new Array(lives + 1).join("●");
      buildBricks();
      resetBall();
      running = false;
      return;
    }

    if (ball.y > H + 12) {
      lives--;
      livesEl.textContent = "LIVES " + (lives > 0 ? new Array(lives + 1).join("●") : "—");
      if (lives <= 0) {
        statusEl.textContent = "game over — score " + score;
        running = false;
        ball.stuck = true;
        ball.x = paddle.x + paddle.w / 2;
        ball.y = paddle.y - 9;
      } else {
        resetBall();
        running = false;
      }
    }
  }

  function draw() {
    g.fillStyle = "#101014";
    g.fillRect(0, 0, W, H);

    bricks.forEach(function (b) {
      if (!b.alive) return;
      var shade = 0.85 - b.row * 0.16;
      g.fillStyle = "rgba(244,244,245," + shade.toFixed(2) + ")";
      g.fillRect(b.x, b.y, BW, BH);
    });

    g.fillStyle = "#f4f4f5";
    g.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    g.beginPath();
    g.arc(ball.x, ball.y, 6, 0, 7);
    g.fill();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") keys.left = true;
    if (e.key === "ArrowRight") keys.right = true;
    if (e.key === " ") { launch(); e.preventDefault(); }
    if (e.key === "Enter" && statusEl.textContent.indexOf("game over") === 0) build();
  });
  document.addEventListener("keyup", function (e) {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
  });

  var drag = false;
  cv.addEventListener("pointerdown", function (e) { drag = true; launch(); move(e); });
  cv.addEventListener("pointermove", function (e) { if (drag) move(e); });
  window.addEventListener("pointerup", function () { drag = false; });
  function move(e) {
    var r = cv.getBoundingClientRect();
    var x = (e.clientX - r.left) * (W / r.width);
    paddle.x = Math.max(4, Math.min(W - paddle.w - 4, x - paddle.w / 2));
  }

  document.getElementById("new").addEventListener("click", build);
  build();
})();
</script>
</body>
</html>
