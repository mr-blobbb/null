<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNAKE</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;box-sizing:border-box}
  .hud{display:flex;align-items:center;gap:20px;font-size:15px;letter-spacing:.1em}
  .hud button{border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.07);color:#f4f4f5;border-radius:999px;padding:8px 18px;font-size:13px;letter-spacing:.06em;cursor:pointer}
  #board{width:min(92vw,78vh,460px);aspect-ratio:1;border-radius:14px;border:1px solid rgba(255,255,255,0.14);background:#101014}
  #status{font-size:13px;color:rgba(255,255,255,0.5);min-height:18px;letter-spacing:.04em;text-align:center}
</style>
</head>
<body>
  <div class="hud"><span id="score">SCORE 0</span><button id="new">new game</button><span id="best">BEST —</span></div>
  <canvas id="board" width="460" height="460"></canvas>
  <div id="status">arrows or swipe to steer</div>
<script>
(function () {
  var cv = document.getElementById("board");
  var g = cv.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var statusEl = document.getElementById("status");

  var GRID = 20;
  var CELL = cv.width / GRID;
  var snake, dir, nextDir, food, score, dead, timer;
  var best = null;
  try { best = +localStorage.getItem("snake.best") || null; } catch (e) {}
  if (best) bestEl.textContent = "BEST " + best;

  function spawnFood() {
    while (true) {
      var x = (Math.random() * GRID) | 0, y = (Math.random() * GRID) | 0;
      if (!snake.some(function (s) { return s.x === x && s.y === y; })) { food = { x: x, y: y }; return; }
    }
  }

  function build() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    dead = false;
    scoreEl.textContent = "SCORE 0";
    statusEl.textContent = "arrows or swipe to steer";
    spawnFood();
    clearInterval(timer);
    timer = setInterval(tick, 110);
    draw();
  }

  function setDir(x, y) {
    if (dir.x + x === 0 && dir.y + y === 0) return; // no 180° flips
    nextDir = { x: x, y: y };
  }

  function tick() {
    if (dead) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      dead = true;
      statusEl.textContent = "game over — score " + score;
      clearInterval(timer);
      if (!best || score > best) {
        best = score;
        try { localStorage.setItem("snake.best", best); } catch (e) {}
        bestEl.textContent = "BEST " + best;
      }
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = "SCORE " + score;
      spawnFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    g.fillStyle = "#101014";
    g.fillRect(0, 0, cv.width, cv.height);
    g.fillStyle = "rgba(255,255,255,0.06)";
    for (var i = 1; i < GRID; i++) {
      g.fillRect(i * CELL, 0, 1, cv.height);
      g.fillRect(0, i * CELL, cv.width, 1);
    }
    g.fillStyle = "#f4f4f5";
    g.fillRect(food.x * CELL + 4, food.y * CELL + 4, CELL - 8, CELL - 8);
    snake.forEach(function (s, i) {
      g.fillStyle = i === 0 ? "#ffffff" : "rgba(244,244,245,0.72)";
      g.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "ArrowUp" || k === "w") { setDir(0, -1); e.preventDefault(); }
    else if (k === "ArrowDown" || k === "s") { setDir(0, 1); e.preventDefault(); }
    else if (k === "ArrowLeft" || k === "a") { setDir(-1, 0); e.preventDefault(); }
    else if (k === "ArrowRight" || k === "d") { setDir(1, 0); e.preventDefault(); }
    else if (dead && (k === " " || k === "Enter")) build();
  });

  var touch = null;
  cv.addEventListener("touchstart", function (e) {
    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  cv.addEventListener("touchmove", function (e) {
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener("touchend", function (e) {
    if (!touch) return;
    var dx = e.changedTouches[0].clientX - touch.x;
    var dy = e.changedTouches[0].clientY - touch.y;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
    touch = null;
  });

  document.getElementById("new").addEventListener("click", build);
  build();
})();
</script>
</body>
</html>
