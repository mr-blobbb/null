<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACE</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b0d;overflow:hidden;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none}
  #board{background:#0e0e11;border:1px solid rgba(255,255,255,0.12);border-radius:14px;display:block;max-width:min(92vw,560px)}
  .hud{display:flex;gap:18px;color:rgba(255,255,255,0.85);font-size:14px;letter-spacing:.08em}
  .hud b{font-weight:700}
  #dpad{display:none;grid-template-columns:repeat(3,56px);grid-auto-rows:56px;gap:6px;margin-top:4px}
  #dpad button{border:1px solid rgba(255,255,255,0.2);border-radius:12px;background:rgba(255,255,255,0.06);color:#fff;font-size:20px}
  @media (pointer:coarse){#dpad{display:grid}}
  #msg{position:absolute;inset:0;display:grid;place-items:center;color:#fff;pointer-events:none}
  #msg div{text-align:center}
  #msg h1{font-size:34px;margin:0 0 6px;letter-spacing:.02em}
  #msg p{font-size:14px;color:rgba(255,255,255,0.55);margin:0}
</style>
</head>
<body>
  <div class="hud"><span>SCORE <b id="score">0</b></span><span>BEST <b id="best">0</b></span></div>
  <canvas id="board" width="420" height="420"></canvas>
  <div id="dpad">
    <span></span><button data-d="up">▲</button><span></span>
    <button data-d="left">◀</button><span></span><button data-d="right">▶</button>
    <span></span><button data-d="down">▼</button><span></span>
  </div>
  <div id="msg"><div><h1 id="msgTitle">TRACE</h1><p id="msgSub">arrows / WASD to start</p></div></div>
<script>
(function () {
  var cv = document.getElementById("board");
  var g = cv.getContext("2d");
  var N = 21, CELL = cv.width / N;
  var snake = [{ x: 10, y: 10 }];
  var dir = { x: 1, y: 0 };
  var next = null;
  var food = { x: 15, y: 10 };
  var score = 0, best = 0, alive = false, tick = 0;
  var spd = 150;

  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");
  var msg = document.getElementById("msg");
  var msgTitle = document.getElementById("msgTitle");
  var msgSub = document.getElementById("msgSub");

  try { best = +localStorage.getItem("trace.best") || 0; } catch (e) {}
  bestEl.textContent = best;

  function placeFood() {
    while (true) {
      var f = { x: (Math.random() * N) | 0, y: (Math.random() * N) | 0 };
      if (!snake.some(function (s) { return s.x === f.x && s.y === f.y; })) { food = f; return; }
    }
  }

  function setDir(x, y) {
    if (!alive) {
      if (!snake.length || (snake[1] && snake[1].x === snake[0].x + x && snake[1].y === snake[0].y + y)) return;
      start();
    }
    if (dir.x === -x && dir.y === -y) return; // no reversing
    next = { x: x, y: y };
  }

  function start() {
    snake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }];
    dir = { x: 1, y: 0 };
    score = 0; scoreEl.textContent = "0";
    alive = true;
    msg.style.display = "none";
    placeFood();
  }

  function die() {
    alive = false;
    if (score > best) {
      best = score;
      try { localStorage.setItem("trace.best", best); } catch (e) {}
      bestEl.textContent = best;
    }
    msgTitle.textContent = "TRACED OUT";
    msgSub.textContent = "score " + score + " · press any arrow to restart";
    msg.style.display = "grid";
    snake = [{ x: 10, y: 10 }];
    dir = { x: 1, y: 0 };
  }

  function step() {
    if (!alive) return;
    if (next) { dir = next; next = null; }
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) return die();
    if (snake.some(function (s, i) { return i < snake.length - 1 && s.x === head.x && s.y === head.y; })) return die();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      spd = Math.max(70, 150 - score * 3);
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    g.fillStyle = "#0e0e11";
    g.fillRect(0, 0, cv.width, cv.height);
    g.strokeStyle = "rgba(255,255,255,0.04)";
    for (var i = 1; i < N; i++) {
      g.beginPath(); g.moveTo(i * CELL, 0); g.lineTo(i * CELL, cv.height); g.stroke();
      g.beginPath(); g.moveTo(0, i * CELL); g.lineTo(cv.width, i * CELL); g.stroke();
    }
    g.fillStyle = "rgba(255,255,255,0.9)";
    var r = CELL / 2 - 2;
    g.beginPath(); g.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, r, 0, 7); g.fill();
    for (var s = 0; s < snake.length; s++) {
      g.globalAlpha = 1 - s / snake.length * 0.55;
      var x = snake[s].x * CELL + 1.5, y = snake[s].y * CELL + 1.5;
      g.beginPath(); g.roundRect(x, y, CELL - 3, CELL - 3, 4); g.fill();
    }
    g.globalAlpha = 1;
  }

  addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    if (k === "arrowup" || k === "w") setDir(0, -1);
    else if (k === "arrowdown" || k === "s") setDir(0, 1);
    else if (k === "arrowleft" || k === "a") setDir(-1, 0);
    else if (k === "arrowright" || k === "d") setDir(1, 0);
    else return;
    e.preventDefault();
  });

  document.querySelectorAll("#dpad button").forEach(function (b) {
    b.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      var d = b.dataset.d;
      if (d === "up") setDir(0, -1);
      else if (d === "down") setDir(0, 1);
      else if (d === "left") setDir(-1, 0);
      else setDir(1, 0);
    });
  });

  setInterval(step, 90);
  draw();
})();
</script>
</body>
</html>
