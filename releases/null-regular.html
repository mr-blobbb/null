  /* ---------- back to top ---------- */
  function backTop() {
    var btn = d.h("button", {
      type: "button",
      class: "btn-icon btn-outline back-top elev",
      "aria-label": "Back to top",
    }, [d.icon("up")]);
    var scroller = document.body.classList.contains("lb") ? d.qs("#scrollview") : window;
    var shown = false;
    function onScroll() {
      var y = scroller === window
        ? window.scrollY || document.documentElement.scrollTop
        : scroller.scrollTop;
      if (y > 700 && !shown) {
        shown = true;
        btn.classList.add("show");
      } else if (y <= 700 && shown) {
        shown = false;
        btn.classList.remove("show");
      }
    }
    btn.addEventListener("click", function () {
      if (scroller === window) window.scrollTo({ top: 0, behavior: "smooth" });
      else scroller.scrollTo({ top: 0, behavior: "smooth" });
    });
    (scroller === window ? window : scroller).addEventListener("scroll", onScroll, { passive: true });
    document.body.appendChild(btn);
  }

  /* ---------- keyboard ---------- */
  function shortcuts() {
    document.addEventListener("keydown", function (e) {
      var typing = isTyping(e.target);
      if (e.key === "/" && !typing) {
        e.preventDefault();
        N.search.open();
        return;
      }
      if (typing) return;
      panicCheck(e);
    });
  }

  /* ---------- panic key ---------- */
  var panicLast = 0;
  function panicCheck(e) {
    var p = N.prefs;
    var key = p.get("panicKey") || "`";
    if (e.key !== key) return;
    e.preventDefault();
    var now = Date.now();
    if (p.get("panicMode") === "double") {
      if (now - panicLast <= 400) {
        panicLast = 0;
        run();
      } else {
        panicLast = now;
      }
    } else {
      run();
    }
    function run() {
      var url = p.get("panicUrl") || "https://classroom.google.com";
      try {
        window.location.replace(url);
      } catch (err) {
        window.location.href = url;
      }
    }
  }

  /* ============================================================
     the hidden pages, and how you fall into them
       /void     hold Backspace and the page erases line by line
       /blob     a small orb sits in the corner during period four
       /time     type the current half of the day, or outlast midnight
       /credits  the shop's completion reward (see shop.js)
     ============================================================ */
  var VOID_URL = N.url("/void");
  var BLOB_URL = N.url("/blob");
  var TIME_URL = N.url("/time");

  function isTyping(t) {
    return (
      !!t &&
      (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)
    );
  }

  /* the eggs stay off the player, and nothing fires over another overlay */
  function eggsAllowed() {
    var b = document.body;
    return !b.classList.contains("player-page") && !b.classList.contains("no-chrome");
  }
  function eggsReady() {
    return (
      eggsAllowed() &&
      !d.qs(".modal-ov.open") &&
      !d.qs(".search-ov.open") &&
      !d.qs(".dc-ov") &&
      !d.qs(".dc-gate")
    );
  }

  /* ---------- /void: hold Backspace ----------
     A tap does nothing. Keep holding and the page is wiped away in thin
     horizontal lines, bottom to top; let go early and it snaps back. The
     hold has to run to the end (or the void is not impressed). */
  var HOLD_MS = 150; // a tap never starts the wipe
  var ERASE_MS = 1900; // hold this long to finish it
  var LINE_PX = 12; // one erased line (matches the stripe period in extra.css)
  var eraseEl = null;
  var eraseRaf = 0;
  var eraseAt = 0;
  var holdTimer = 0;

  function eraseBegin() {
    if (eraseEl) return;
    var ov = d.h("div", { class: "erase-ov", "aria-hidden": "true" }, [
      d.h("div", { class: "erase-fill" }),
      d.h("div", { class: "erase-edge" }),
      d.h("div", { class: "erase-hint" }, "keep holding to erase"),
    ]);
    document.body.appendChild(ov);
    eraseEl = ov;
    eraseAt = Date.now();
    requestAnimationFrame(eraseStep);
    setTimeout(function () {
      if (eraseEl === ov) ov.classList.add("holding");
    }, 220);
  }

  function eraseStep() {
    if (!eraseEl) return;
    var p = Math.min(1, (Date.now() - eraseAt) / ERASE_MS);
    /* snap to whole lines so it reads as one line at a time, not a slide */
    var h = Math.min(window.innerHeight, Math.round((p * window.innerHeight) / LINE_PX) * LINE_PX);
    var fill = d.qs(".erase-fill", eraseEl);
    var edge = d.qs(".erase-edge", eraseEl);
    if (fill) fill.style.height = h + "px";
    if (edge) edge.style.bottom = h + "px";
    if (p >= 1) {
      eraseFinish();
      return;
    }
    eraseRaf = requestAnimationFrame(eraseStep);
  }

  function eraseFinish() {
    cancelAnimationFrame(eraseRaf);
    var ov = eraseEl;
    eraseEl = null;
    if (ov) {
      /* last line falls: drop the stripes and close the screen out */
      ov.classList.add("filled");
      var fill = d.qs(".erase-fill", ov);
      var edge = d.qs(".erase-edge", ov);
      if (fill) fill.style.height = "100%";
      if (edge) edge.style.bottom = "100%";
    }
    setTimeout(function () {
      location.href = VOID_URL;
    }, 150);
  }

  function eraseCancel() {
    cancelAnimationFrame(eraseRaf);
    var ov = eraseEl;
    eraseEl = null;
    if (!ov) return;
    ov.classList.add("out");
    var fill = d.qs(".erase-fill", ov);
    var edge = d.qs(".erase-edge", ov);
    if (fill) fill.style.height = "0px";
    if (edge) edge.style.bottom = "0px";
    setTimeout(function () {
      if (ov.parentNode) ov.parentNode.removeChild(ov);
    }, 260);
  }

  function armErase() {
    document.addEventListener("keydown", function (e) {
      if (e.key !== "Backspace" || e.repeat) return;
      if (isTyping(e.target) || !eggsReady()) return;
      e.preventDefault();
      if (eraseEl || holdTimer) return;
      holdTimer = setTimeout(function () {
        holdTimer = 0;
        eraseBegin();
      }, HOLD_MS);
    });
    function stop() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = 0;
      }
      if (eraseEl) eraseCancel();
    }
    document.addEventListener("keyup", function (e) {
      if (e.key === "Backspace") stop();
    });
    window.addEventListener("blur", stop);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) stop();
    });
  }

  /* ---------- /time: type the current half of the day ----------
     "am" before noon, "pm" after. The chunk resets on any non-letter so a
     word that merely ends in am/pm does not count. */
  function armTimeCode() {
    var chunk = "";
    document.addEventListener("keydown", function (e) {
      if (e.repeat) return;
      var k = e.key;
      if (!k || k.length !== 1 || !/[a-z]/i.test(k)) {
        chunk = "";
        return;
      }
      if (isTyping(e.target)) {
        chunk = "";
        return;
      }
      chunk = (chunk + k.toLowerCase()).slice(-8);
      var frame = new Date().getHours() < 12 ? "am" : "pm";
      if (chunk === frame && eggsReady()) {
        chunk = "";
        location.href = TIME_URL;
      }
    });
  }

  /* ---------- midnight: the day rolls over with confetti ---------- */
  function midnightParty() {
    N.modal.open({
      title: "Midnight",
      icon: "clock",
      body:
        "<p>It is officially a new day. NULL is awake from <b>midnight to 8:00 AM</b>, so the halls are yours.</p>" +
        "<p style='color:var(--text-2)'>The <b>/time</b> page has the live clock, if you want to watch it with us.</p>",
      actions: [
        { label: "Stay up", variant: "outline" },
        {
          label: "Open /time",
          variant: "primary",
          onClick: function () {
            location.href = TIME_URL;
          },
        },
      ],
    });
    /* confetti() guards itself for ~2.6 s, so space the bursts out past it */
    confetti();
    setTimeout(confetti, 2700);
    setTimeout(confetti, 5400);
  }

  function midnightTick() {
    var now = new Date();
    if (now.getHours() !== 0 || now.getMinutes() !== 0) return;
    if (!eggsReady()) return; /* another overlay owns the screen: try again */
    var key = "midnight:" + now.toDateString();
    if (N.flags.get(key)) return;
    N.flags.set(key);
    midnightParty();
  }

  function armMidnight() {
    midnightTick();
    setInterval(midnightTick, 10000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) midnightTick();
    });
  }

  /* ---------- /blob: the orb that shows up in period four ----------
     One click swaps the face to -𐃷-; a second, at least a second later,
     drops you on /blob. */
  var orbEl = null;
  var orbArmedAt = 0;
  /* the dev console can force the orb on or off, or hand it back to the
     schedule (null) */
  var orbForced = null;

  function periodFourNow() {
    if (!N.schedule || !N.schedule.blocksFor) return false;
    var info = N.schedule.todayInfo();
    if (!info || !info.type) return false;
    var blocks = N.schedule.blocksFor(info.type);
    var now = new Date();
    var secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
    for (var i = 0; i < blocks.length; i++) {
      if (blocks[i].n !== 4) continue;
      var s = N.schedule.parseHM(blocks[i].start) * 60;
      var e = N.schedule.parseHM(blocks[i].end) * 60;
      return secs >= s && secs < e;
    }
    return false;
  }

  function paintOrb() {
    var want = orbForced === null ? periodFourNow() : !!orbForced;
    if (want && eggsAllowed()) orbShow();
    else if (orbEl) orbHide();
  }

  /* nldev: force the face on, force it off, then back on the schedule */
  function orbToggle() {
    orbForced = orbForced === null ? true : orbForced ? false : null;
    paintOrb();
    return orbForced;
  }

  function orbShow() {
    if (orbEl) return;
    var face = d.h("span", { class: "orb-face" }, "•𐃷•");
    var btn = d.h(
      "button",
      {
        type: "button",
        class: "blob-orb",
        title: "•𐃷•",
        "aria-label": "blob",
        onclick: function () {
          var now = Date.now();
          if (!orbArmedAt) {
            orbArmedAt = now;
            face.textContent = "-𐃷-";
            btn.classList.add("armed");
            return;
          }
          if (now - orbArmedAt < 1000) return; // cooldown between the two clicks
          location.href = BLOB_URL;
        },
      },
      [face],
    );
    document.body.appendChild(btn);
    orbEl = btn;
  }

  function orbHide() {
    var el = orbEl;
    orbEl = null;
    orbArmedAt = 0;
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function armOrb() {
    paintOrb();
    setInterval(paintOrb, 10000);
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) paintOrb();
    });
  }

  /* ---------- cloaking: open the whole site in about:blank / blob: ----------
     There is no API for "are popups allowed?", so NULL learns it the one way a
     page can: the first time a cloak window fails to open, it remembers. From
     then on it does not fire a doomed window.open at all: it just shows the
     warning and asks for popups, with a Try again for once they're enabled. */
  var POPUP_KEY = "popupsBlocked";

  function popupsBlocked() {
    return !!N.prefs.get(POPUP_KEY);
  }

  function noteBlocked() {
    N.prefs.set(POPUP_KEY, true);
  }

  function noteAllowed() {
    if (N.prefs.get(POPUP_KEY)) N.prefs.set(POPUP_KEY, false);
  }

  function cloakBlocked(mode) {
    N.modal.open({
      title: "Popups are blocked",
      icon: "warn",
      iconTone: "danger",
      body:
        "<p>Your browser is blocking popups, so cloaked windows <b>can’t open</b>. NULL won’t keep firing them until that changes.</p>" +
        "<p>Allow popups for NULL (usually the icon at the right of the address bar), then press <b>Try again</b>.</p>",
      actions: [
        { label: "Close", variant: "outline" },
        {
          label: "Try again",
          variant: "primary",
          onClick: function () {
            noteAllowed();
            N.cloak.site(mode);
          },
        },
      ],
    });
  }

  /* A tiny shell document that frames the real site in an iframe. Used for
     both modes: about:blank gets this written into the blank window, blob:
     gets it served from a blob: URL. The tab title/favicon come from the
     active tab preset either way. */
  function cloakShell() {
    var p = N.tab.current();
    return (
      "<!doctype html><html><head><meta charset='utf-8'><title>" +
      N.tab.titleFor(p) +
      "</title><link rel='icon' href='" +
      (p.icon || N.url("/public/favicon.svg")) +
      "'></head>" +
      "<body style='margin:0'><iframe src='" +
      location.origin +
      N.base +
      "' style='width:100vw;height:100vh;border:0'></iframe></body></html>"
    );
  }

  /* Popup blockers can refuse the open but still hand back a WindowProxy
     (or kill the tab a moment later). In every failure case we make sure
     nothing is left open: close the window, show the warning only.
     `to` is the preset's real site: once the cloaked window is up, this tab
     navigates there so the address bar matches the name on the tab. */
  function cloakOpen(url, mode, shell, to) {
    var w = null;
    try {
      w = window.open(url, "_blank");
    } catch (err) {
      w = null;
    }
    if (!w) {
      noteBlocked();
      cloakBlocked(mode);
      return;
    }
    if (mode === "blank") {
      /* about:blank windows share the opener's origin: write the shell in */
      try {
        w.document.open();
        w.document.write(shell);
        w.document.close();
      } catch (err) {
        try {
          w.close();
        } catch (e2) {}
        noteBlocked();
        cloakBlocked(mode);
        return;
      }
    }
    /* some blockers cancel the tab right after it opens: if the browser
       closed it, don't leave a stray tab and don't pretend it worked */
    noteAllowed();
    setTimeout(function () {
      if (w.closed) {
        noteBlocked();
        cloakBlocked(mode);
      }
    }, 800);
    if (to) {
      /* the cloaked copy is already open and loaded from here, so handing
         this tab over to the real site costs nothing */
      d.toast("Opening " + hostOf(to) + " in this tab", { icon: "ban" });
      setTimeout(function () {
        location.href = to;
      }, 700);
      return;
    }
    d.toast(mode === "blank" ? "Opened NULL in about:blank" : "Opened NULL in blob:", {
      icon: "ban",
    });
  }

  /* the host of a redirect target, for the toast: never throws on junk */
  function hostOf(url) {
    try {
      return new URL(url).hostname;
    } catch (err) {
      return url;
    }
  }

  /* where this tab hands over to: the current preset's real site, unless the
     user turned the redirect off in Settings */
  function cloakTarget() {
    if (N.prefs.get("cloakRedirect") === false) return null;
    return N.tab.url ? N.tab.url() : null;
  }

  N.cloak = {
    /* has the browser been seen blocking NULL's popups? */
    blocked: popupsBlocked,
    markBlocked: noteBlocked,
    clear: noteAllowed,
    /* the address this tab would become: settings shows it before you click */
    target: cloakTarget,
    site: function (mode) {
      /* if popups are known to be blocked, don't even try to open about:blank
         or blob:: warn, and let the user enable them first */
      if (popupsBlocked()) {
        cloakBlocked(mode);
        return;
      }
      var shell = cloakShell();
      var url = mode === "blob" ? URL.createObjectURL(new Blob([shell], { type: "text/html" })) : "about:blank";
      cloakOpen(url, mode, shell, cloakTarget());
    },
  };

  /* ---------- confetti (grayscale) ----------
     Fired when a class period ends. Toggleable via prefs.confetti.
     Also exposed as N.fx.confetti for the dev console. */
  var confettiBusy = false;
  function confetti() {
    if (confettiBusy) return;
    confettiBusy = true;
    setTimeout(function () { confettiBusy = false; }, 2600);
    var ov = d.h("div", { class: "cf-ov", "aria-hidden": "true" });
    /* golden confetti is a shop unlock: otherwise stay grayscale */
    var cols =
      N.econ && N.econ.isUnlocked("fx", "goldconfetti")
        ? ["#ffd45e", "#ffb020", "#ffe9a8", "#f5c542", "#ffdf8a"]
        : ["#f5f5f6", "#c9c9cf", "#a1a1aa", "#71717a", "#52525b"];
    for (var i = 0; i < 80; i++) {
      var p = d.h("span", { class: "cf-p" + (Math.random() < 0.5 ? " s" : "") });
      p.style.left = Math.random() * 100 + "%";
      p.style.background = cols[i % cols.length];
      p.style.setProperty("--cf-drift", (Math.random() * 220 - 110).toFixed(0) + "px");
      p.style.setProperty("--cf-rot", (Math.random() * 720 - 360).toFixed(0) + "deg");
      p.style.animationDuration = (2 + Math.random() * 1.4).toFixed(2) + "s";
      p.style.animationDelay = (Math.random() * 0.5).toFixed(2) + "s";
      ov.appendChild(p);
    }
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.classList.add("on"); });
    setTimeout(function () {
      ov.classList.remove("on");
      setTimeout(function () {
        if (ov.parentNode) ov.parentNode.removeChild(ov);
      }, 400);
    }, 3400);
  }

  /* ---------- period bells ----------
     Confetti has to land ON the bell, not within half a minute of it: the
     schedule is read to find the seconds left in the current block (or in
     the passing period) and a single timer is aimed at that instant. Both
     bells fire: a period ending (which is when the passing period starts)
     and the passing period ending (which is when class starts). The key of
     the block we're in changes at each one, so "it changed" is the trigger. */
  var schedTimer = null;
  var lastKey = null;

  function blockKey() {
    if (!N.schedule) return null;
    var info = N.schedule.todayInfo();
    if (!info.type) return null;
    var lv = N.schedule.live(N.schedule.blocksFor(info.type));
    if (!lv.block) return "end";
    return lv.i + (lv.passing ? "p" : "");
  }

  /* aim the timer at the next bell; a little past the second so the clock
     has definitely rolled over when we look */
  function armBell() {
    if (schedTimer) clearTimeout(schedTimer);
    schedTimer = null;
    if (!N.schedule) return;
    var info = N.schedule.todayInfo();
    var ms = null;
    if (info.type) {
      var lv = N.schedule.live(N.schedule.blocksFor(info.type));
      if (lv.block) ms = lv.secLeft * 1000 + 120;
    }
    /* nothing left today (or no school): look again in a minute */
    schedTimer = setTimeout(ring, ms == null || ms <= 0 ? 60000 : Math.min(ms, 900000));
  }

  function ring() {
    schedTimer = null;
    var key = blockKey();
    /* only a real bell: never the end of the day, never a first reading */
    if (lastKey !== null && key && key !== "end" && key !== lastKey) {
      if (N.prefs.get("confetti") !== false && !document.hidden) confetti();
    }
    lastKey = key;
    armBell();
  }

  function watchPeriodEnd() {
    if (!N.schedule || schedTimer) return;
    lastKey = blockKey();
    armBell();
    /* timers are throttled in a background tab, so never celebrate a bell
       that went by while this window was hidden: just re-sync and re-aim */
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) return;
      lastKey = blockKey();
      armBell();
    });
  }

  /* ============================================================
     screensaver: after two idle minutes a dim glass overlay fades
     in: drifting grayscale game art, a live clock and a wake hint.
     Any pointer or key wakes it. Skipped on the player / 404 and
     whenever an overlay is already open.
     ============================================================ */
  var SS_DELAY = 120000; // 2 minutes idle
  var ssTimer = null;
  var ssEl = null;
  var ssClockInt = null;

  function ssGated() {
    return (
      document.body.classList.contains("player-page") ||
      document.body.classList.contains("page-404") ||
      document.body.classList.contains("no-chrome") ||
      !!d.qs(".modal-ov.open") ||
      !!d.qs(".search-ov.open") ||
      document.hidden
    );
  }

  function ssHide() {
    if (!ssEl) return;
    var el = ssEl;
    ssEl = null;
    clearInterval(ssClockInt);
    el.classList.remove("on");
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 500);
    ssArm();
  }

  function ssClock() {
    if (!ssEl) return;
    var el = d.qs(".ss-clock", ssEl);
    var now = new Date();
    var h = now.getHours() % 12 || 12;
    var m = now.getMinutes();
    var s = now.getSeconds();
    var ap = now.getHours() >= 12 ? "PM" : "AM";
    if (el) el.textContent = h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s + " " + ap;
  }

  function ssShow() {
    if (ssEl || ssGated()) {
      ssArm();
      return;
    }
    var games = N.catalog.games().filter(function (g) {
      return g.thumb;
    });
    var ov = d.h("div", { class: "ss-ov", "aria-hidden": "true" });
    ov.appendChild(d.h("div", { class: "ss-vign" }));
    var art = d.h("div", { class: "ss-art" });
    var count = Math.min(18, Math.max(6, games.length));
    for (var i = 0; i < count; i++) {
      var g = games[Math.floor(Math.random() * games.length)];
      var img = d.h("img", { src: g.thumb, alt: "", draggable: "false" });
      img.addEventListener("error", function (e) {
        if (e.target && e.target.parentNode) e.target.parentNode.removeChild(e.target);
      });
      var slow = i % 2 === 1;
      var tile = d.h("div", { class: "ss-tile" + (slow ? " slow" : "") }, [img]);
      tile.style.left = (4 + Math.random() * 82) + "%";
      tile.style.top = (6 + Math.random() * 74) + "%";
      tile.style.setProperty("--ss-drift", (10 + Math.random() * 26).toFixed(1) + "px");
      tile.style.animationDuration = (slow ? 26 + Math.random() * 14 : 15 + Math.random() * 18).toFixed(1) + "s";
      tile.style.animationDelay = (-Math.random() * 34).toFixed(1) + "s";
      art.appendChild(tile);
    }
    ov.appendChild(art);
    ov.appendChild(d.h("div", { class: "ss-brand" }, [d.icon("ban"), "NULL"]));
    ov.appendChild(d.h("div", { class: "ss-clock" }, "-:--"));
    ov.appendChild(
      d.h("div", { class: "ss-date" },
        new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })),
    );
    ov.appendChild(d.h("div", { class: "ss-hint" }, "move mouse or press any key"));
    document.body.appendChild(ov);
    ssEl = ov;
    requestAnimationFrame(function () {
      ov.classList.add("on");
    });
    ssClock();
    ssClockInt = setInterval(ssClock, 1000);
  }

  function ssArm() {
    clearTimeout(ssTimer);
    ssTimer = setTimeout(ssShow, SS_DELAY);
  }

  function ssWake() {
    ssHide();
    ssArm();
  }

  /* immediate screensaver (dev console button): bypasses the idle wait */
  function ssNow() {
    ssHide();
    ssShow();
  }

  function initSs() {
    if (ssGated()) return;
    ["pointermove", "pointerdown", "keydown", "wheel", "touchstart"].forEach(function (ev) {
      document.addEventListener(ev, ssWake, { passive: true });
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) ssHide();
      else ssArm();
    });
    ssArm();
  }

  /* ---------- marathon mode: auto-switch games on a timer ----------
     The ticker lives here so it keeps running on any NULL page. The games
     page owns the controls; prefs hold the interval (marathonMin) and the
     next-fire time (marathonAt). */
  var marathonTimer = null;
  function marathonTick() {
    if (document.hidden) return;
    if (N.prefs.get("marathon") === false) return; // feature disabled in settings
    var min = parseInt(N.prefs.get("marathonMin"), 10) || 0;
    if (!min) {
      if (marathonTimer) {
        clearInterval(marathonTimer);
        marathonTimer = null;
      }
      return;
    }
    var at = parseInt(N.prefs.get("marathonAt"), 10) || 0;
    if (!at || Date.now() < at) return;
    /* due: launch a random game directly, no warning modal mid-marathon */
    N.prefs.set("marathonAt", Date.now() + min * 60000);
    var g = N.catalog.games();
    if (!g.length) return;
    var pick = g[Math.floor(Math.random() * g.length)];
    N.recent.add("game", pick.id);
    location.href = N.launch.playerUrl("game", pick.id);
  }
  function initMarathon() {
    if (marathonTimer) return;
    if (parseInt(N.prefs.get("marathonMin"), 10) > 0) marathonTick();
    marathonTimer = setInterval(marathonTick, 1000);
  }

  /* ---------- performance-mode suggestion ----------
     Weak devices (low device memory / few cores) get a one-time nudge to
     turn on performance mode, plus a friendly "close some tabs" tip. */
  function perfSuggest() {
    if (N.prefs.get("perf")) return;
    if (N.flags.get("perfSuggest")) return;
    var mem = navigator.deviceMemory; // Chrome only: undefined elsewhere
    var cores = navigator.hardwareConcurrency;
    var weak =
      (mem && mem <= 4) ||
      (!mem && cores && cores <= 4) ||
      (cores && cores <= 2);
    if (!weak) return;
    setTimeout(function () {
      if (document.body.classList.contains("player-page") || document.body.classList.contains("page-404")) return;
      if (d.qs(".modal-ov.open")) return;
      N.flags.set("perfSuggest");
      N.modal.open({
        title: "Performance mode",
        icon: "zap",
        body:
          "<p>NULL noticed this device looks a bit underpowered.</p>" +
          "<p>Performance mode disables hover effects, glow and heavy shadows for a smoother experience. You can flip it anytime in Settings.</p>" +
          "<p style='color:var(--text-2)'>Closing extra tabs and apps can also free up memory and speed things up.</p>",
        actions: [
          { label: "Not now", variant: "outline" },
          {
            label: "Turn on performance mode",
            variant: "primary",
            onClick: function () {
              N.prefs.set("perf", true);
              N.theme.setPerf(true);
              d.toast("Performance mode on", { icon: "zap" });
            },
          },
        ],
      });
    }, 2600);
  }

  /* ---------- measured frame rate ----------
     Device memory is a guess; the frame rate isn't. We sample rAF quietly
     in the background and, if two windows in a row come in under FPS_FLOOR,
     offer Ultra-Performance mode once. The flag is set whether or not the
     offer is taken, so nobody gets asked twice. */
  var FPS_FLOOR = 20;

  function ultraOn() {
    N.prefs.set("perf", "ultra");
    N.theme.setPerf("ultra");
    d.toast("Ultra-Performance mode on", { icon: "zap" });
  }

  /* returns true once the offer is spent, or already was. While another
     modal owns the screen we hold off and try again next window, so the one
     and only ask never gets swallowed. */
  function fpsOffer(fps) {
    if (N.flags.get("ultraSuggest")) return true;
    if (d.qs(".modal-ov.open")) return false;
    N.flags.set("ultraSuggest");
    N.modal.open({
      title: "Turn on Ultra-Performance mode?",
      icon: "zap",
      body:
        "<p>NULL measured this device at about <b>" +
        Math.round(fps) +
        " fps</b>, which is slow enough to feel sticky.</p>" +
        "<p>Ultra-Performance mode drops every animation, particle and effect, and only draws what is on screen. NULL looks plainer, and moves a lot faster.</p>" +
        "<p style='color:var(--text-2)'>You can switch it back off any time in Settings.</p>",
      actions: [
        { label: "Keep it as is", variant: "outline" },
        { label: "Enable Ultra mode", variant: "primary", onClick: ultraOn },
      ],
    });
    return true;
  }

  function fpsWatch() {
    if (N.prefs.get("perf") === "ultra") return;
    if (N.flags.get("ultraSuggest")) return;
    /* the player runs real games: heavy there is normal, not a problem */
    if (document.body.classList.contains("no-chrome")) return;
    if (!window.requestAnimationFrame) return;
    var frames = 0;
    var slow = 0;
    var t0 = 0;
    function tick(now) {
      if (N.prefs.get("perf") === "ultra") return;
      if (!t0) t0 = now;
      frames++;
      var span = now - t0;
      if (span < 2500) {
        requestAnimationFrame(tick);
        return;
      }
      var fps = (frames * 1000) / span;
      /* a background tab pauses rAF, which would otherwise read as 0 fps */
      slow = document.hidden ? 0 : fps < FPS_FLOOR ? slow + 1 : 0;
      frames = 0;
      t0 = now;
      if (slow >= 2 && fpsOffer(fps)) return;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* ---------- weekly wrap-up ----------
     Once a week (Monday-keyed), the first page load after the week rolls
     over shows a summary of the previous week's plays. Fires on every page
     (shell runs everywhere), ~1.2 s after load so it never fights the
     first-run welcome chain on the home page. */
  function wrapupModal(weekKey, s) {
    var mon = new Date(weekKey + "T00:00:00");
    var end = new Date(mon.getTime());
    end.setDate(end.getDate() + 6);
    var range =
      mon.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      " - " +
      end.toLocaleDateString(undefined, { month: "short", day: "numeric" });

    var html =
      "<p style='margin:0 0 4px;color:#a3a3a3;font-size:14px;'>Your NULL week: <b style='color:var(--text)'>" +
      range +
      "</b>. Everything below is local to your browser.</p>";
    html +=
      "<div class='wu-stats'>" +
      "<div class='wu-stat'><b>" + s.total + "</b><span>plays</span></div>" +
      "<div class='wu-stat'><b>" + s.distinct + "</b><span>games & apps</span></div>" +
      "<div class='wu-stat'><b>" + (s.top.length ? s.top[0].n : 0) + "</b><span>top item</span></div>" +
      "</div>";
    if (s.top.length) {
      html += "<div class='wu-top'><b>Most played</b>";
      s.top.forEach(function (t, i) {
        var e = N.catalog.find(t.k, t.id);
        var name = e ? e.name : t.id;
        html +=
          "<div class='wu-item'><span class='wu-rank'>" +
          (i + 1) +
          "</span>" +
          d.escHtml(name) +
          "<span class='wu-count'>" + t.n + "×</span></div>";
      });
      html += "</div>";
    }
    html +=
      "<p style='margin:14px 0 0;font-size:12.5px;color:#737373;'>New week: the log restarts today. See you next Monday.</p>";

    N.modal.open({
      title: "Your week in NULL",
      icon: "ann",
      body: html,
      actions: [{ label: "Got it", variant: "primary" }],
    });
  }

  function wrapupCheck() {
    if (!N.week || !N.modal) return;
    var prev = N.week.rollover();
    if (!prev) return;
    var key = "wrapup:" + prev.week;
    if (N.flags.get(key)) return;
    N.flags.set(key);
    wrapupModal(prev.week, N.week.summary(prev.plays));
  }

  /* dev-console / debug entry: show the current week's wrap-up on demand */
  N.wrapup = {
    check: wrapupCheck,
    show: function () {
      if (!N.week || !N.modal) return false;
      var s = N.week.summary();
      if (!s.total) return false;
      wrapupModal(N.week.key(), s);
      return true;
    },
  };

  function init() {
    /* clean urls: a visitor landing on /shop.html gets /shop in the address
       bar, so every NULL url is the same shape. Skipped on the 404 page,
       whose address GitHub keeps for the redirect dance to work. */
    if (N.cleanAddress) N.cleanAddress();

    /* resolve [data-icon] placeholders left in static HTML */
    d.qsa("[data-icon]").forEach(function (el) {
      var ic = d.icon(el.dataset.icon);
      if (el.tagName === "SPAN") {
        el.replaceWith(ic);
      } else {
        el.textContent = "";
        el.appendChild(ic);
      }
    });

    var raw = document.body.classList.contains("no-chrome");
    if (!raw) {
      var navMount = d.qs('[data-mount="nav"]');
      var footMount = d.qs('[data-mount="foot"]');
      if (navMount) navMount.appendChild(topbar());
      if (footMount) footMount.appendChild(footer());
    }

    N.modal.armSgGames();
    shortcuts();
    N.tab.apply();
    N.tab.smartStart();
    initMarathon();
    initSs();
    watchPeriodEnd();

    /* the hidden pages: hold Backspace, the period-four orb, the clock codes */
    armErase();
    armTimeCode();
    armOrb();
    armMidnight();

    /* weekly wrap-up: slightly delayed so it stacks above (never under)
       the first-run welcome chain on the home page */
    setTimeout(wrapupCheck, 1200);
    perfSuggest();
    /* give the first paint time to settle before judging the frame rate */
    setTimeout(fpsWatch, 5000);
    paintAnnDots();
    paintShopDot();

    /* PWA: register the root service worker so NULL is installable and the
       shell works offline. Dev/preview hosts skip it *and* clean up after
       themselves: a cached shell there means stale assets (a cached
       JS-wrapped stylesheet leaves every page unstyled). */
    if ("serviceWorker" in navigator) {
      var host = location.hostname;
      var devHost =
        host === "localhost" ||
        host === "127.0.0.1" ||
        host === "::1" ||
        /(^|\.)(freebuff|daytona|vly|preview|local)\./.test(host) ||
        /daytona|freebuff|preview/.test(host);
      if (devHost) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (rs) {
            rs.forEach(function (r) {
              r.unregister();
            });
          })
          .catch(function () {});
        if (window.caches) {
          caches
            .keys()
            .then(function (keys) {
              keys.forEach(function (k) {
                caches.delete(k);
              });
            })
            .catch(function () {});
        }
      } else {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register(N.url("sw.js")).catch(function () {});
        });
      }
    }

    /* custom scrollbar on library pages */
    if (document.body.classList.contains("lb")) {
      var sv = d.qs("#scrollview");
      if (sv) N.scroll.attach(sv);
    }
    if (!raw) backTop();
  }

  /* ---------- install as an app (PWA) ----------
     Chrome fires beforeinstallprompt once the manifest + service worker
     requirements are met. We stash the event so Settings can trigger the
     real browser prompt on demand instead of relying on the address-bar
     icon alone. */
  var installEvt = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    installEvt = e;
    N.bus.emit("installReady");
  });
  window.addEventListener("appinstalled", function () {
    installEvt = null;
    N.bus.emit("installReady");
  });
  N.install = {
    installed: function () {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
    },
    ready: function () {
      return !!installEvt;
    },
    prompt: function () {
      if (!installEvt) return Promise.resolve("unavailable");
      var evt = installEvt;
      installEvt = null;
      evt.prompt();
      return evt.userChoice.then(function (r) {
        N.bus.emit("installReady");
        return (r && r.outcome) || "dismissed";
      });
    },
  };

  N.shell = {
    init: init,
    screensaverNow: ssNow,
    /* dev console: the blob orb and the midnight party on demand */
    orb: orbToggle,
    midnightNow: midnightParty,
  };
  N.fx = { confetti: confetti };
  N.perf = { ultra: ultraOn, watchFps: fpsWatch, floor: FPS_FLOOR };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

/* NULL · release-shell.js
   The app inside releases/null-{regular,mini,lite}.html. It is NOT one of the
   site's page scripts: the single-file builds ship the same runtime (store,
   theme, econ, cards, schedule, daily, search…) plus an embedded catalog whose
   entries carry their own game code as a data: URI, so everything runs with no
   server and no other files.

   What the shell owns:
     · the window chrome: header, page nav, footer
     · the views: home, games/apps/proxies, schedule, announcements, shop,
       backups, settings
     · the player overlay, and the launch hooks that make cards, search results
       and "play random" open games in it instead of navigating to a player page
       that does not exist in a single file

   Tier differences come from window.RELEASE_TIER:
     regular · everything, readable source
     mini    · same, minified by the build script
     lite    · full runtime but stripped: no theme packs, no particles, no glow,
               no shop, and performance mode is pinned on so the animations and
               backdrop effects are off. */

(function () {
  var N = window.N;
  var d = N.dom;
  var C = window.NULL_CONTENT || { announcements: [], pages: [] };
  var TIER = window.RELEASE_TIER || "regular";
  var LITE = TIER === "lite";
  var root = document.getElementById("rel");
  var viewHost = null;
  var state = { q: "", page: "home" };

  var NAV = {
    regular: ["home", "games", "apps", "proxies", "announcements", "schedule", "shop", "backups", "settings"],
    mini: ["home", "games", "apps", "proxies", "announcements", "schedule", "shop", "backups", "settings"],
    lite: ["home", "games", "apps", "proxies", "schedule", "settings"]
  };
  var NAV_T = {
    home: "Home", games: "Games", apps: "Apps", proxies: "Proxies",
    announcements: "News", schedule: "Schedule", shop: "Shop",
    backups: "Backups", settings: "Settings"
  };

  /* the embedded catalog: catalog.js and this shell read the same object */
  function cat() {
    return window.NULL_CATALOG || { games: [], apps: [], proxies: [] };
  }

  function go(page) {
    state.page = page;
    try {
      location.hash = page;
    } catch (e) {}
    paintNav();
    render();
    window.scrollTo(0, 0);
  }

  /* ============================================================
     header + nav
     ============================================================ */
  function header() {
    var h = d.h("div", { class: "rel-top glass-2" });

  /* ============================================================
     player overlay + playtime banking
     ============================================================ */
  var clock = null;
  var lastTick = 0;

  function clockOn() {
    if (!N.econ || !N.econ.bank) return;
    clockOff(true);
    lastTick = Date.now();
    clock = setInterval(function () {
      var secs = Math.round((Date.now() - lastTick) / 1000);
      if (secs < 5) return;
      lastTick = Date.now();
      var got = N.econ.bank(secs);
      if (got && (got.xp || got.coins)) {
        var bits = [];
        if (got.xp) bits.push("+" + got.xp + " XP");
        if (got.coins) bits.push("+" + got.coins + " coins");
        d.toast(bits.join(" · "), { icon: "coin" });
      }
    }, 5000);
  }

  function clockOff(silent) {
    if (!clock) return;
    clearInterval(clock);
    clock = null;
    var secs = Math.round((Date.now() - lastTick) / 1000);
    if (secs > 0 && N.econ && N.econ.bank) N.econ.bank(secs);
    if (!silent && N.econ && N.econ.reload) N.econ.reload();
  }

  function openPlayer(entry, kind) {
    var run = function () {
      N.recent.add(kind, entry.id);
      if (N.econ && N.econ.trackPlay) N.econ.trackPlay(kind, entry.id);
      N.tab.apply();

      var overlay = d.h("div", { class: "player", style: { zIndex: "400" } });
      var load = d.h("div", { class: "player-loading" }, [
        d.h("div", { class: "spin" }),
        d.h("span", null, "starting…")
      ]);
      var frame = d.h("iframe", {
        title: entry.name,
        style: { width: "100%", height: "100%", border: "0", background: "#0c0c0f" }
      });
      frame.addEventListener("load", function () {
        load.remove();
      });
      frame.src = entry.data || entry.file;

      var back = d.h("button", {
        type: "button",
        class: "btn-icon btn-ghost",
        onclick: function () {
          clockOff();
          overlay.remove();
          document.body.style.overflow = "";
        }
      }, [d.icon("back")]);
      var meta = d.h("div", { class: "player-meta" }, [
        d.h("b", null, entry.name),
        d.h("span", null, (kind === "game" ? "Game" : "App") + " · NULL " + TIER)
      ]);
      var fs = d.h("button", {
        type: "button",
        class: "btn-icon btn-outline",
        title: "Fullscreen",
        style: { width: "38px", height: "38px", borderRadius: "11px" },
        onclick: function () {
          if (document.fullscreenElement) document.exitFullscreen();
          else if (overlay.requestFullscreen) overlay.requestFullscreen();
        }
      }, [d.icon("max")]);

      var bar = d.h("div", { class: "player-bar" }, [
        back,
        meta,
        d.h("div", { class: "player-actions" }, [fs])
      ]);
      overlay.appendChild(bar);
      overlay.appendChild(d.h("div", { class: "player-frame" }, [load, frame]));
      document.body.appendChild(overlay);
      document.body.style.overflow = "hidden";
      clockOn();
    };

    if (entry.warning) {
      N.modal.open({
        title: entry.warning.title || "Heads up",
        icon: "warn",
        iconTone: "warn",
        body: "<p>" + d.escHtml(entry.warning.description || "").replace(/\n/g, "<br>") + "</p>",
        dismissible: false,
        actions: [
          { label: "Go back", variant: "outline" },
          { label: "Okay", variant: "primary", onClick: run }
        ]
      });
      return;
    }
    run();
  }

     page, so every route into a game goes through the overlay above instead:
     library cards, search hits, "play random" and the dev console all call

  N.launch.game = function (entry) {

      grid.textContent = "";

    var S = N.schedule;

    view.appendChild(d.h("div", { class: "view-head" }, [d.h("h2", null, "School schedule")]));
    var panel = d.h("div", { class: "panel glass" });
    view.appendChild(panel);
    if (!S) return view;

    var info = S.todayInfo();
    if (!info.type) {
      panel.appendChild(d.h("p", { class: "lines", style: { color: "var(--text-2)" } }, info.dayName + ": no school. Monday is a Regular day."));
      return view;
    }
    var blocks = S.blocksFor(info.type);
    panel.appendChild(
      d.h("div", { class: "today-card" }, [
        d.h("span", { class: "chip" + (info.type === "win" ? " accent" : "") }, info.type === "win" ? "Homeroom/WIN day" : "Regular schedule"),

        d.h("span", { class: "tc-note" }, info.kind.note)
      ]),
    );
    var strip = S.liveStrip(blocks);
    panel.appendChild(strip.el);
    var lv = S.live(blocks);
    panel.appendChild(S.grid(blocks, lv.block ? lv.i : -1, { live: true }));
    panel.appendChild(
      d.h("p", { class: "sched-note" }, "Times are the sample bells. Rename periods and pick a lunch period on the full site's /schedule page."),
    );

    setInterval(function () {
      if (!document.body.contains(panel)) return;
      var nv = S.live(blocks);
      strip.paint(nv);
      var idx = nv.block ? nv.i : -1;
      panel.querySelectorAll(".sched-row").forEach(function (r, i) {
        r.classList.toggle("now", i === idx);
      });
      /* the moment a period ends and the next begins */
      var key = nv.block ? nv.block.name : null;
      if (key !== periodKey) {
        if (periodKey !== undefined && key && !LITE && N.fx) N.fx.confetti();
        periodKey = key;
      }
    }, 1000);
    return view;

  function fmtTime(sec) {

  function buy(type, id, name, price) {
    var st = N.econ.state();
    if (st.coins < price) {
      d.toast("Not enough coins yet. Keep playing to earn more!", { type: "err", icon: "coin" });
      return;
    }
    N.modal.confirm({
      title: "Unlock " + name + "?",

      body: "<p>This spends <b>" + price + " coins</b>. You have <b>" + st.coins + "</b>.</p><p style='color:var(--text-2)'>Unlocks are local to this browser.</p>",
      okLabel: "Buy for " + price,
      onOk: function () {
        var r = N.econ.buy(type, id);
        if (!r.ok) {
          d.toast(r.reason === "not enough coins" ? "Not enough coins yet." : "Could not unlock that.", { type: "err" });
          return;
        }
        d.toast("Unlocked: " + name, { icon: "check" });
        if (N.fx && N.fx.confetti) N.fx.confetti();
        render();
      }

  function packCard(p) {
    var owned = !!(p.free || N.econ.isUnlocked("theme", p.id));
    var applied = N.prefs.get("accent") === p.id;
    var foot = ownedFoot(owned, applied, function () {
      if (applied) {
        N.prefs.set("accent", "off");
        N.theme.setAccent("off");
      } else {
        N.prefs.set("accent", p.id);
        N.theme.setAccent(p.id);

      if (N.seasons) N.seasons.refresh();
      render();
    });
    if (!owned) {

        type: "button",
        class: "btn btn-primary btn-sm",
        onclick: function () {
          buy("theme", p.id, p.name, p.price);
        }
      }, "Unlock"));
    }
    return shopRow(
      N.theme.packThumb(p, { lock: !owned }),
      d.h("div", { class: "shop-info" }, [
        d.h("h3", null, p.name),
        d.h("p", null, p.desc || ""),

    var owned = !!(p.free || N.econ.isUnlocked("particle", p.id));

    var foot = ownedFoot(owned, applied, function () {
      if (applied) {
        N.prefs.set("particles", "none");
        N.theme.setParticles("none");
      } else {
        N.prefs.set("particles", p.id);
        N.theme.setParticles(p.id);
      }
      d.toast(applied ? "Background particles off" : "Particles: " + p.name, { icon: "sparkle" });
      render();
    });
    if (!owned) {
      foot.appendChild(d.h("span", { class: "chip price-chip" }, [d.icon("coin"), String(p.price)]));
      foot.appendChild(d.h("button", {
        type: "button",
        class: "btn btn-primary btn-sm",
        onclick: function () {
          buy("particle", p.id, p.name, p.price);
        }
      }, "Unlock"));
    }
    return shopRow(
      N.theme.partThumb(p, { lock: !owned }),
      d.h("div", { class: "shop-info" }, [
        d.h("h3", null, p.name),
        d.h("p", null, p.desc || ""),
        d.h("div", { class: "chips-row" }, (p.tags || []).map(function (t) {
          return d.h("span", { class: "chip" }, t);
        }))
      ]),
      foot,
    );
  }

  function shopSection(title, icon, hint, rows) {
    var sec = d.h("div", { class: "section" });
    sec.appendChild(d.h("div", { class: "section-head" }, [
      d.h("h2", null, [d.icon(icon), title]),
      d.h("span", { class: "hint" }, hint || "")
    ]));
    sec.appendChild(d.h("div", { class: "shop-grid" }, rows));
    return sec;
  }

  function shopView() {
    var view = d.h("div", { class: "rel-view" });
    view.appendChild(
      d.h("div", { class: "page-head" }, [
        d.h("h2", null, "Shop"),
        d.h("p", { style: { color: "var(--text-2)" } }, "Play to bank XP and coins: spend them here. No real money, nothing leaves this browser.")
      ]),
    );
    view.appendChild(ecoBar());

    var st = N.econ.state();
    view.appendChild(
      d.h("div", { class: "rel-actions" }, [
        d.h("button", {
          type: "button",
          class: "btn btn-primary",
          onclick: function () {
            N.daily.openCrate(function () {
              render();
            });
          }
        }, [d.icon("gift"), st.canSpin ? "Open the daily crate" : "Crate opened today"]),
        d.h("button", {
          type: "button",
          class: "btn btn-outline",
          onclick: function () {
            N.modal.open({
              title: "Daily quests",
              icon: "zap",
              body: N.daily.questList(function () {
                render();
              })
            });
          }
        }, "Daily quests"),
        d.h("button", {
          type: "button",
          class: "btn btn-outline",
          onclick: function () {
            N.modal.open({
              title: "Achievements",
              icon: "trophy",
              body: N.daily.achList(function () {
                render();
              })
            });
          }
        }, "Achievements")
      ]),
    );

    var betas = C.betas || [];
    if (betas.length) {
      view.appendChild(
        shopSection("Beta games", "game", "unlocked builds join your library", betas.map(function (b) {
          var owned = N.econ.isUnlocked("game", b.id);
          var foot = d.h("div", { class: "shop-foot" });
          if (owned) {
            foot.appendChild(d.h("span", { class: "chip ok" }, [d.h("span", { class: "dot" }), "Unlocked"]));
          } else {
            foot.appendChild(d.h("span", { class: "chip price-chip" }, [d.icon("coin"), String(b.price)]));
            foot.appendChild(d.h("button", {
              type: "button",
              class: "btn btn-primary btn-sm",
              onclick: function () {
                buy("game", b.id, b.name, b.price);
              }
            }, "Unlock"));
          }
          return shopRow(
            d.h("div", { class: "shop-thumb" }, [d.icon("game")]),
            d.h("div", { class: "shop-info" }, [d.h("h3", null, b.name), d.h("p", null, b.desc || "")]),
            foot,
          );
        })),
      );
    }

    if (!LITE) {
      view.appendChild(shopSection("Theme packs", "pen", "a palette and a live backdrop", N.econ.THEMES.map(packCard)));
      view.appendChild(shopSection("Background particles", "sparkle", "ambient motion everywhere", N.econ.PARTICLES.map(partCard)));
    }

    view.appendChild(
      shopSection("Boosts", "boost", "speed up earning", N.econ.BOOSTS.map(function (b) {
        var owned = N.econ.isUnlocked("fx", b.id);
        var foot = d.h("div", { class: "shop-foot" });
        if (owned) foot.appendChild(d.h("span", { class: "chip ok" }, [d.h("span", { class: "dot" }), "Active"]));
        else {
          foot.appendChild(d.h("span", { class: "chip price-chip" }, [d.icon("coin"), String(b.price)]));
          foot.appendChild(d.h("button", {
            type: "button",
            class: "btn btn-primary btn-sm",
            onclick: function () {
              buy("fx", b.id, b.name, b.price);
            }
          }, "Unlock"));
        }
        return shopRow(d.h("div", { class: "shop-thumb" }, [d.icon("boost")]), d.h("div", { class: "shop-info" }, [d.h("h3", null, b.name), d.h("p", null, b.desc || "")]), foot);
      })),
    );

    view.appendChild(
      shopSection("Effects", "sparkle", "cosmetic unlocks", N.econ.FX.map(function (f) {
        var owned = N.econ.isUnlocked("fx", f.id);
        var foot = d.h("div", { class: "shop-foot" });
        if (owned) foot.appendChild(d.h("span", { class: "chip ok" }, [d.h("span", { class: "dot" }), "Unlocked"]));
        else {
          foot.appendChild(d.h("span", { class: "chip price-chip" }, [d.icon("coin"), String(f.price)]));
          foot.appendChild(d.h("button", {
            type: "button",
            class: "btn btn-primary btn-sm",
            onclick: function () {
              buy("fx", f.id, f.name, f.price);
            }
          }, "Unlock"));
        }
        return shopRow(d.h("div", { class: "shop-thumb" }, [d.icon("sparkle")]), d.h("div", { class: "shop-info" }, [d.h("h3", null, f.name), d.h("p", null, f.desc || "")]), foot);
      })),
    );
    return view;
  }

  /* ============================================================
     settings
     ============================================================ */
  function settingsView() {
    var view = d.h("div", { class: "rel-view" });
    var look = d.h("div", { class: "set-card glass" }, [d.h("h2", { class: "set-title" }, "Appearance")]);
    view.appendChild(look);
    themeRow(look);
    accentRow(look);
    if (!LITE) glowRow(look);
    perfRow(look);

    if (!LITE) {
      var packs = d.h("div", { class: "set-card glass", style: { marginTop: "14px" } }, [
        d.h("h2", { class: "set-title" }, "Theme packs"),
        d.h("p", { class: "set-sub" }, "A palette and a live animated backdrop. Locked packs show what you get. Nothing is hidden.")
      ]);
      view.appendChild(packs);
      packs.appendChild(d.h("div", { class: "shop-grid" }, N.theme.allPacks().map(packCard)));

      var parts = d.h("div", { class: "set-card glass", style: { marginTop: "14px" } }, [
        d.h("h2", { class: "set-title" }, "Background particles"),
        d.h("p", { class: "set-sub" }, "Ambient motion behind the whole interface.")
      ]);
      view.appendChild(parts);
      parts.appendChild(d.h("div", { class: "shop-grid" }, N.theme.allParticles().map(partCard)));
    }

    var misc = d.h("div", { class: "set-card glass", style: { marginTop: "14px" } }, [d.h("h2", { class: "set-title" }, "Browser tab & data")]);
    view.appendChild(misc);
    tabRow(misc);
    dataRow(misc);
    return view;
  }

  function seg(parent, options, current, onPick) {
    var box = d.h("div", { class: "seg" });
    options.forEach(function (o) {
      var b = d.h("button", {
        type: "button",
        class: "chip chip-btn" + (current === o.id ? " on" : ""),
        onclick: function () {
          box.querySelectorAll("button").forEach(function (x) {
            x.classList.remove("on");
          });
          b.classList.add("on");
          onPick(o.id);
        }
      }, o.name);
      box.appendChild(b);
    });
    parent.appendChild(box);
    return box;
  }

  function themeRow(card) {
    var row = d.h("div", { class: "set-row" }, [
      d.h("div", { class: "lbl-txt" }, [d.h("b", null, "Theme"), d.h("span", null, "Dark or Light: NULL inverted.")])
    ]);
    seg(row, [{ id: "dark", name: "Dark" }, { id: "light", name: "Light" }], N.prefs.get("theme"), function (id) {
      N.prefs.set("theme", id);
      N.theme.setTheme(id);
    });
    card.appendChild(row);
    return row;
  }

  function accentRow(card) {
    var box = d.h("div", { class: "glow-row" });
    var row = d.h("div", { class: "set-row" }, [
      d.h("div", { class: "lbl-txt" }, [d.h("b", null, "Accent"), d.h("span", null, "Restrained: grayscale stays.")]),
      box
    ]);
    var list = N.theme.ACCENTS.concat(N.theme.extraAccents ? N.theme.extraAccents() : []);
    var applied = N.prefs.get("accent");
    if (applied !== "off" && !list.some(function (a) {
      return a.id === applied;
    })) applied = "off";
    list.forEach(function (a) {
      var b = d.h("button", {
        type: "button",
        class: "chip chip-btn" + (applied === a.id ? " on" : ""),
        onclick: function () {
          box.querySelectorAll("button").forEach(function (x) {
            x.classList.remove("on");
          });
          b.classList.add("on");
          N.prefs.set("accent", a.id);
          N.theme.setAccent(a.id);
        }
      }, a.name);
      box.appendChild(b);
    });
    if (N.theme.customOn && N.theme.customOn()) {
      var pick = d.h("input", { type: "color", class: "field", value: N.prefs.get("accentColor") || "#6cc7ff", style: { width: "46px", height: "30px", padding: "0" } });
      pick.addEventListener("input", function () {
        N.theme.setCustomAccent(pick.value);
      });
      box.appendChild(pick);
    }
    card.appendChild(row);
    return row;
  }

  function glowRow(card) {
    var box = d.h("div", { class: "glow-row" });
    var row = d.h("div", { class: "set-row" }, [
      d.h("div", { class: "lbl-txt" }, [d.h("b", null, "Glow border"), d.h("span", null, "Re-inks the viewport edge. Neon lights the cards.")]),
      box
    ]);
    function paintG() {
      box.textContent = "";
      N.theme.GLOWS.forEach(function (g) {
        if (g.id === "custom" && N.theme.customOn && !N.theme.customOn()) return;
        var b = d.h("button", {
          type: "button",
          class: "chip chip-btn" + (N.prefs.get("glow") === g.id ? " on" : ""),
          onclick: function () {
            box.querySelectorAll("button").forEach(function (x) {
              x.classList.remove("on");
            });
            b.classList.add("on");
            N.prefs.set("glow", g.id);
            N.theme.setGlow(g.id);
            c1.hidden = c2.hidden = g.id !== "custom";
          }
        }, g.name);
        if (g.colors) {
          b.appendChild(
            d.h("span", { class: "accent-dots" }, g.colors.slice(0, 4).map(function (c) {
              return d.h("i", { style: { background: c } });
            })),
          );
        }
        box.appendChild(b);
      });
      c1.hidden = c2.hidden = N.prefs.get("glow") !== "custom";
    }
    var c1 = d.h("input", { type: "color", class: "field", value: N.prefs.get("glowColor1") || "#35c3f2", style: { width: "44px", height: "30px", padding: "0" } });
    var c2 = d.h("input", { type: "color", class: "field", value: N.prefs.get("glowColor2") || "#a86bff", style: { width: "44px", height: "30px", padding: "0" } });
    [c1, c2].forEach(function (inp) {
      inp.addEventListener("input", function () {
        N.prefs.set(inp === c1 ? "glowColor1" : "glowColor2", inp.value);
        if (N.prefs.get("glow") === "custom") N.theme.setGlow("custom");
      });
    });
    box.appendChild(c1);
    box.appendChild(c2);
    paintG();
    card.appendChild(row);
    return row;
  }

  /* perf is false | true | "ultra": ultra adds no animation at all, no
     effect layers and no off-screen paint (perf.css) */
  function perfRow(card) {
    var sw = d.h("input", { type: "checkbox", checked: !!N.prefs.get("perf") });
    var usw = d.h("input", { type: "checkbox", checked: N.prefs.get("perf") === "ultra" });
    if (LITE) {
      sw.disabled = true;
      usw.disabled = true;
    }
    function apply() {
      var level = usw.checked ? "ultra" : sw.checked;
      N.prefs.set("perf", level);
      N.theme.setPerf(level);
      sw.checked = !!level;
      usw.checked = level === "ultra";
    }
    sw.addEventListener("change", apply);
    usw.addEventListener("change", apply);

    function rowFor(label, hint, input) {
      var lab = d.h("label", { class: "switch" });
      lab.appendChild(input);
      lab.appendChild(d.h("span", { class: "track" }));
      var row = d.h("div", { class: "set-row" }, [
        d.h("div", { class: "lbl-txt" }, [d.h("b", null, label), d.h("span", null, hint)]),
        lab
      ]);
      card.appendChild(row);
      return row;
    }
    var row = rowFor(
      "Performance mode",
      "Disables animation, glow, particles and blur on slower devices.",
      sw
    );
    rowFor(
      "Ultra-Performance mode",
      "No animation at all, no effects, and only what's on screen is drawn.",
      usw
    );
    return row;
  }

  function tabRow(card) {
    var sel = d.h("select", { class: "field", style: { height: "38px", maxWidth: "240px", padding: "0 10px" } });
    N.tab.list.forEach(function (p) {
      var o = d.h("option", { value: p.id }, p.name);
      if (p.id === N.prefs.get("tab")) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener("change", function () {
      N.prefs.set("tab", sel.value);
      N.tab.apply();
    });
    var row = d.h("div", { class: "set-row" }, [
      d.h("div", { class: "lbl-txt", style: { flex: "1" } }, [
        d.h("b", null, "Tab preset"),
        d.h("span", null, "Overrides the browser tab title & icon.")
      ]),
      sel
    ]);
    card.appendChild(row);
    return row;
  }

  function exportData() {
    var bag = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf("null:") === 0) bag[k] = localStorage.getItem(k);
      }
    } catch (e) {}
    var payload = { app: "null", v: 1, at: new Date().toISOString(), data: bag };
    var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = d.h("a", { href: url, download: "null-data-" + new Date().toISOString().slice(0, 10) + ".json" });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () {
      URL.revokeObjectURL(url);
    }, 4000);
    d.toast("Downloaded " + Object.keys(bag).length + " saved items", { icon: "check" });
  }

  function importData(file) {
    var reader = new FileReader();
    reader.onerror = function () {
      d.toast("Could not read that file.", { type: "err" });
    };
    reader.onload = function () {
      var bag = null;
      try {
        var parsed = JSON.parse(String(reader.result));
        bag = parsed && parsed.data ? parsed.data : parsed;
      } catch (e) {}
      if (!bag || typeof bag !== "object") {
        d.toast("That is not a NULL backup file.", { type: "err" });
        return;
      }
      var n = 0;
      Object.keys(bag).forEach(function (k) {
        if (k.indexOf("null:") !== 0) return;
        try {
          localStorage.setItem(k, String(bag[k]));
          n++;
        } catch (e) {}
      });
      d.toast("Restored " + n + " items: reloading", { icon: "check" });
      setTimeout(function () {
        location.reload();
      }, 700);
    };
    reader.readAsText(file);
  }

  function dataRow(card) {
    var file = d.h("input", { type: "file", accept: "application/json,.json", style: { display: "none" } });
    file.addEventListener("change", function () {
      if (file.files && file.files[0]) importData(file.files[0]);
      file.value = "";
    });
    document.body.appendChild(file);

    var row = d.h("div", { class: "set-row" }, [
      d.h("div", { class: "lbl-txt" }, [
        d.h("b", null, "NULL data on this device"),
        d.h("span", null, N.recent.list().length + " recent · " + N.favs.list().length + " favorites · " + N.econ.state().coins + " coins")
      ]),
      d.h("div", { class: "icon-btn-row" }, [
        d.h("button", { type: "button", class: "btn btn-outline btn-sm", onclick: exportData }, [d.icon("download"), "Download"]),
        d.h("button", { type: "button", class: "btn btn-outline btn-sm", onclick: function () { file.click(); } }, [d.icon("upload"), "Upload"]),
        d.h("button", {
          type: "button",
          class: "btn btn-outline-danger btn-sm",
          onclick: function () {
            N.modal.confirm({
              title: "Wipe all NULL data?",
              icon: "trash",
              iconTone: "danger",
              body: "<p>Removes recent, favorites, preferences, coins and unlocks for this browser. No undo.</p>",
              okLabel: "Wipe everything",
              okVariant: "danger",
              onOk: function () {
                var keys = [];
                try {
                  for (var i = 0; i < localStorage.length; i++) {
                    var k = localStorage.key(i);
                    if (k && k.indexOf("null:") === 0) keys.push(k);
                  }
                } catch (e) {}
                keys.forEach(function (k) {
                  N.store.del(k);
                });
                location.reload();
              }
            });
          }
        }, [d.icon("trash"), "Wipe"])
      ])
    ]);
    card.appendChild(row);
    return row;
  }

  /* ============================================================
     render
     ============================================================ */
  function render() {
    if (viewHost) viewHost.remove();
    var page = state.page;
    if (page === "games") viewHost = libraryView(cat().games || [], "game");
    else if (page === "apps") viewHost = libraryView(cat().apps || [], "app");
    else if (page === "proxies") viewHost = libraryView(cat().proxies || [], "proxy");
    else if (page === "schedule") viewHost = scheduleView();
    else if (page === "announcements") viewHost = announcementsView();
    else if (page === "shop") viewHost = shopView();
    else if (page === "backups") viewHost = backupsView();
    else if (page === "settings") viewHost = settingsView();
    else viewHost = homeView();
    root.appendChild(viewHost);
  }

  function boot() {
    /* lite is the stripped build: no backdrop, no particles, no motion */
    if (LITE) {
      N.prefs.set("perf", true);
      N.prefs.set("particles", "none");
      N.prefs.set("glow", "off");
      document.documentElement.dataset.perf = "1";
    }
    root.appendChild(header());
    root.appendChild(nav());

    var h = (location.hash || "").replace("#", "");
    if ((NAV[TIER] || NAV.regular).indexOf(h) >= 0) state.page = h;

    N.theme.applyAll();
    N.tab.apply();
    N.modal.armSgGames();
    render();

    var foot = d.h("div", { class: "foot" });
    foot.appendChild(d.h("span", null, "NULL " + TIER + " · single-file build · " + new Date().getFullYear()));
    foot.appendChild(d.h("span", null, "Favorites, history, coins and settings live in this browser."));
    if (N.search) {
      foot.appendChild(
        d.h("button", { type: "button", class: "btn btn-ghost btn-sm", onclick: function () { N.search.open(); } }, "Search everything"),
      );
    }
    root.appendChild(foot);

    /* the site's global shortcuts (panic key, "/" to search, tab cloak) come
       from shell.js; it only wires chrome into [data-mount] nodes, which this
       build deliberately does not provide. */
    if (N.shell && N.shell.init) N.shell.init();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();

</script>
</body>
