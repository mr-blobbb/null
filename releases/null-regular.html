   offline, behind a network that blocks fonts.googleapis.com, and with no
   third-party request in the critical path. font-display:block keeps the
   glyphs invisible for the instant before the file lands, instead of painting

/* ---------- tokens ---------- */
:root {
  color-scheme: dark;
  --bg: #0a0a0b;
  --bg-2: #101012;
  --text: #f5f5f6;
  --text-2: rgba(245, 245, 246, 0.58);
  --line: rgba(255, 255, 255, 0.13);
  --line-2: rgba(255, 255, 255, 0.26);
  --glass-bg: #161618; /* flat surfaces: no translucency, no blur */
  --glass-bg-2: #1c1c1f;
  --glass-bg-3: #26262b;
  --elev: #17171a;
  --overlay: rgba(0, 0, 0, 0.62);
  --thumb: #3b3b41;
  --thumb-hi: #56565e;
  --ok: #56c990;
  --warn: #d9b24f;
  --bad: #e06a6a;
  --ok-bg: rgba(86, 201, 144, 0.12);
  --warn-bg: rgba(217, 178, 79, 0.12);
  --bad-bg: rgba(224, 106, 106, 0.12);
  /* accents are overridden inline for the chosen palette; grayscale below */
  --ac-1: #e6e7ea;
  --ac-2: #a2a6ae;

  --r-sm: 9px;
  --r-md: 12px;
  --r-lg: 16px;
  --r-xl: 22px;
  --nh: 60px;
  --maxw: 1180px;
  --shadow-1: 0 8px 26px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 18px 54px rgba(0, 0, 0, 0.45);
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

/* ---------- schedule row layout (always three columns) ---------- */
.sched-row {
  grid-template-columns: 44px minmax(0, 1fr) auto !important;
}
.sched-mini .home-grid .sched-row {
  grid-template-columns: 34px minmax(0, 1fr) auto !important;
}

html[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f3f4;
  --bg-2: #ececef;
  --text: #111113;
  --text-2: rgba(17, 17, 19, 0.62);
  --line: rgba(17, 17, 19, 0.13);
  --line-2: rgba(17, 17, 19, 0.26);
  --glass-bg: #ffffff;
  --glass-bg-2: #f6f6f7;
  --glass-bg-3: #ececee;
  --elev: #ffffff;
  --overlay: rgba(17, 17, 19, 0.4);
  --thumb: #c4c4ca;
  --thumb-hi: #9d9da5;
  --ac-1: #26262b;
  --ac-2: #55555f;
  --shadow-1: 0 8px 24px rgba(20, 20, 28, 0.09);
  --shadow-2: 0 18px 52px rgba(20, 20, 28, 0.16);
}

/* ---------- layout compactness ----------
   One spacing scale the whole site shares: nav height, page gutters, the
   rhythm between sections, grid gaps and card padding. Settings writes
   html[data-density]; every value below is a plain multiple of the regular
   one, so nothing drifts apart and no page needs its own override. */
:root {
  --nh: 60px;
  --pad-x: 22px;
  --pad-top: 34px;
  --pad-bottom: 90px;
  --sec-gap: 42px;
  --grid-gap: 18px;
  --card-pad: 20px;
  --card-gap: 18px;
  --tile: 230px;
}
html[data-density="comfy"] {
  --nh: 64px;
  --pad-x: 30px;
  --pad-top: 44px;
  --pad-bottom: 110px;
  --sec-gap: 54px;
  --grid-gap: 24px;
  --card-pad: 26px;
  --card-gap: 22px;
  --tile: 260px;
}
html[data-density="spacious"] {
  --nh: 68px;
  --pad-x: 40px;
  --pad-top: 54px;
  --pad-bottom: 132px;
  --sec-gap: 68px;
  --grid-gap: 30px;
  --card-pad: 32px;
  --card-gap: 26px;
  --tile: 290px;
}
html[data-density="compact"] {
  --nh: 52px;
  --pad-x: 15px;
  --pad-top: 24px;
  --pad-bottom: 64px;
  --sec-gap: 26px;
  --grid-gap: 11px;
  --card-pad: 14px;
  --card-gap: 13px;
  --tile: 200px;
}

/* ---------- base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  height: 100%;
  scrollbar-gutter: stable;
}

body {
  margin: 0;
  /* column + min-height keeps the footer on the bottom edge on short pages
     (announcements, backups) instead of floating with dead space below it */
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue",
    Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

p {
  margin: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

img,
svg,
canvas {
  display: block;
  max-width: 100%;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}

input,
select,
textarea {
  font: inherit;
  color: inherit;
}

::selection {
  background: var(--ac-1);
  color: var(--bg);
}

:focus-visible {
  outline: 2px solid var(--ac-1);
  outline-offset: 2px;
  border-radius: 6px;
}

.skip-link {
  position: absolute;
  left: -9999px;
  top: 0;
  z-index: 200;
  background: var(--elev);
  border: 1px solid var(--line);
  border-radius: 0 0 var(--r-sm) 0;
  padding: 8px 14px;
}
.skip-link:focus {
  left: 0;
}

/* old ambient-glow layer: intentionally inert (plain flat background),
   but the seasonal theme paints its soft wash on it */
.glow-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: transparent;
}

/* ---------- seasonal theme (fall / winter / spring / summer) ----------
   A soft color wash at the top of the page + a drifting particle layer
   pinned behind everything. The wash is CSS-only so it survives perf
   mode; particles are JS (seasons.js) and skip perf/reduced-motion. */
html[data-season="fall"] .glow-bg {
  background: radial-gradient(120% 60% at 50% -10%, rgba(217, 142, 61, 0.13), transparent 60%);
}
html[data-season="winter"] .glow-bg {
  background: radial-gradient(120% 60% at 50% -10%, rgba(127, 180, 232, 0.15), transparent 60%);
}
html[data-season="spring"] .glow-bg {
  background: radial-gradient(120% 60% at 50% -10%, rgba(226, 145, 176, 0.15), transparent 60%);
}
html[data-season="summer"] .glow-bg {
  background:
    radial-gradient(130% 70% at 50% -15%, rgba(240, 217, 140, 0.26), transparent 55%),
    radial-gradient(90% 50% at 50% 115%, rgba(240, 217, 140, 0.10), transparent 60%);
}
/* the two holiday variants ride along with their season, with a wash of
   their own so picking one visibly changes the page */
html[data-season="halloween"] .glow-bg {
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(255, 138, 61, 0.16), transparent 58%),
    radial-gradient(90% 55% at 50% 112%, rgba(150, 92, 235, 0.14), transparent 62%);
}
html[data-season="holidays"] .glow-bg {
  background:
    radial-gradient(120% 60% at 50% -10%, rgba(201, 79, 79, 0.15), transparent 58%),
    radial-gradient(90% 55% at 50% 112%, rgba(120, 200, 150, 0.13), transparent 62%);
}

.season-fx {
  position: fixed;
  inset: 0;
  z-index: -1;
  overflow: hidden;
  pointer-events: none;
}
.sf-p {
  position: absolute;
  top: -7vh;
  background-repeat: no-repeat;
  background-size: contain;
  user-select: none;
  animation: sf-fall linear infinite;
  will-change: transform;
}
html[data-season="summer"] .sf-p {
  filter: drop-shadow(0 0 5px rgba(230, 195, 92, 0.65));
}
html[data-season="winter"] .sf-p {
  filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.35));
}
html[data-season="halloween"] .sf-p {
  filter: drop-shadow(0 0 5px rgba(255, 138, 61, 0.5));
}
html[data-season="holidays"] .sf-p {
  filter: drop-shadow(0 0 5px rgba(242, 217, 140, 0.5));
}
.season-fx.sf-hidden .sf-p {
  animation-play-state: paused;
}
html[data-perf="1"] .sf-p {
  display: none;
}
@keyframes sf-fall {
  0% {
    transform: translate3d(0, -8vh, 0) rotate(0deg);
  }
  100% {
    transform: translate3d(var(--sf-sway, 0px), 110vh, 0) rotate(var(--sf-rot, 220deg));
  }
}

/* ---------- shared layout ---------- */
body > main {
  flex: 1 0 auto;
}

.page {
  width: 100%;
  max-width: var(--maxw);
  margin: 0 auto;
  padding: calc(var(--nh) + var(--pad-top)) var(--pad-x) var(--pad-bottom);
}

.page-narrow {
  max-width: 900px;
}

/* library pages scroll inside their own custom-scrolled area */
body.lb {
  overflow: hidden;
}
body.lb main.sview {
  position: relative;
  height: 100dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  max-width: none;
  padding: calc(var(--nh) + var(--pad-top)) var(--pad-x) calc(var(--pad-bottom) + 30px);
  scrollbar-width: none;
}
body.lb main.sview::-webkit-scrollbar {
  display: none;
  width: 0;
  height: 0;
}
main.sview > * {
  width: 100%;
  max-width: var(--maxw);
  margin-left: auto;
  margin-right: auto;
}

.section {
  margin-top: var(--sec-gap);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.section-head h2 {
  font-size: 22px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-head .hint {
  font-size: 13px;
  color: var(--text-2);
}
.section-head .more {
  font-size: 13px;
  color: var(--text-2);
  white-space: nowrap;
  transition: color 0.18s;
}
.section-head .more:hover {
  color: var(--text);
}

/* ============================================================
   flat surfaces: solid fills, hairline borders only
   ============================================================ */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--line);
}

.glass-2 {
  background: var(--glass-bg-2);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
}

.elev {
  background: var(--elev);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-1);
}

.card {
  border-radius: var(--r-lg);
}

/* ============================================================
   buttons / chips / fields
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 40px;
  padding: 0 18px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.01em;
  transition: transform 0.14s var(--ease), box-shadow 0.18s, background 0.18s,
    border-color 0.18s, color 0.18s, opacity 0.18s;
  user-select: none;
  white-space: nowrap;
}
.btn:active {
  transform: translateY(1px) scale(0.985);
}
.btn:disabled {
  opacity: 0.5;
  pointer-events: none;
}
.btn svg {
  width: 17px;
  height: 17px;
  flex: none;
}

.btn-primary {
  background: var(--ac-1);
  color: var(--bg);
  border-color: transparent;
}
.btn-primary:hover {
  filter: brightness(1.07);
}

.btn-outline {
  border-color: var(--line-2);
  background: var(--glass-bg);
}
.btn-outline:hover {
  background: var(--glass-bg-2);
  border-color: var(--thumb);
}

.btn-ghost {
  color: var(--text-2);
}
.btn-ghost:hover {
  color: var(--text);
  background: var(--glass-bg-2);
}

.btn-danger {
  background: var(--bad);
  color: #fff;
  border-color: color-mix(in srgb, var(--bad) 70%, #000);
}
.btn-danger:hover {
  filter: brightness(1.08);
  transform: translateY(-1px);
}

.btn-outline-danger {
  border: 1.5px solid color-mix(in srgb, var(--bad) 72%, transparent);
  color: var(--bad);
  background: transparent;
}
.btn-outline-danger:hover {
  background: var(--bad-bg);
}

.btn-sm {
  height: 32px;
  padding: 0 13px;
  font-size: 13px;
}
.btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 12px;
}
.btn-icon svg {
  width: 19px;
  height: 19px;
}
.btn-icon-sm {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 9px;
}
.btn-icon-sm svg {
  width: 18px;
  height: 18px;
}
.player-actions #btnFav {
  color: var(--text-2);
  border-color: transparent;
}
.player-actions #btnFav.on {
  color: var(--ac-1);
  border-color: color-mix(in srgb, var(--ac-1) 40%, transparent);
}
.player-actions #btnFav.on svg {
  fill: currentColor;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 24px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--glass-bg);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-2);
  white-space: nowrap;
}
.chip .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.chip.ok {
  color: var(--ok);
  background: var(--ok-bg);
  border-color: color-mix(in srgb, var(--ok) 30%, transparent);
}
.chip.warn {
  color: var(--warn);
  background: var(--warn-bg);
  border-color: color-mix(in srgb, var(--warn) 30%, transparent);
}
.chip.bad {
  color: var(--bad);
  background: var(--bad-bg);
  border-color: color-mix(in srgb, var(--bad) 30%, transparent);
}
.chip.accent {
  color: var(--ac-1);
  border-color: color-mix(in srgb, var(--ac-1) 35%, transparent);
}
.chip-btn {
  cursor: pointer;
  color: var(--text-2);
  transition: all 0.16s;
  user-select: none;
}
.chip-btn:hover {
  border-color: var(--line-2);
  color: var(--text);
  background: var(--glass-bg-2);
}
.chip-btn.on {
  color: var(--bg);
  background: var(--ac-1);
  border-color: var(--ac-1);
}

.field {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 42px;
  padding: 0 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line-2);
  background: var(--glass-bg);
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
  color: var(--text);
}
.field:hover {
  border-color: var(--thumb);
}
.field:focus-within {
  border-color: var(--ac-1);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac-1) 16%, transparent);
}
.field input,
.field select,
.field textarea {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
}
.field input::placeholder,
.field textarea::placeholder {
  color: var(--text-2);
}
.field svg {
  width: 17px;
  height: 17px;
  flex: none;
  color: var(--text-2);
}
textarea.field {
  height: auto;
  padding: 12px 14px;
  resize: vertical;
  min-height: 90px;
}

label.lbl {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--text-2);
  margin: 0 0 8px 4px;
}

/* switch */
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 25px;
  flex: none;
}
.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.switch .track {
  position: absolute;
  inset: 0;
  border-radius: 999px;
  background: var(--glass-bg-3);
  border: 1px solid var(--line-2);
  transition: background 0.2s;
}
.switch .track::after {
  content: "";
  position: absolute;
  top: 2.5px;
  left: 3px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--text);
  transition: transform 0.22s var(--ease);
}
.switch input:checked + .track {
  background: color-mix(in srgb, var(--ac-1) 30%, transparent);
}
.switch input:checked + .track::after {
  transform: translateX(19px);
}

/* ============================================================
   header / navigation
   ============================================================ */
.topbar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 90;
  height: var(--nh);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 max(18px, calc((100vw - var(--maxw)) / 2));
  background: var(--bg);
  border-bottom: 1px solid color-mix(in srgb, var(--ac-1) 12%, var(--line));
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: none;
}
.brand-mark {
  width: 30px;
  height: 30px;
  color: var(--text);
}
.brand-name {
  font-weight: 750;
  letter-spacing: 0.24em;
  font-size: 16.5px;
  margin-right: -0.24em;
}
.brand-name em {
  font-style: normal;
  opacity: 0.45;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 6px;
}
.nav-link {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 38px;
  padding: 0 13px;
  border-radius: 11px;
  font-size: 14px;
  font-weight: 560;
  color: var(--text-2);
  transition: color 0.16s, background 0.16s;
  white-space: nowrap;
}
/* soft radial halo instead of a flat pill: fades at the edges so the
   highlight reads as light behind the icon, not a box sitting on top */
.nav-link:hover {
  color: var(--text);
  background:
    radial-gradient(120% 130% at 50% 50%,
      color-mix(in srgb, var(--text) 14%, transparent) 0%,
      color-mix(in srgb, var(--text) 7%, transparent) 55%,
      transparent 78%);
}
.nav-link:hover .msr {
  /* translate, not transform: the per-icon animations below run on
     transform, and a hovered transform would become the implicit start
     frame of every one of them (which silently killed the 360 spin) */
  translate: 0 -1px;
}
.nav-link.on {
  color: var(--text);
  background: transparent;
  box-shadow: inset 0 -2px 0 var(--ac-1);
}
.nav-link.on .msr {
  color: var(--ac-1);
}
.nav-link.on:hover {
  background:
    radial-gradient(120% 130% at 50% 50%,
      color-mix(in srgb, var(--text) 8%, transparent) 0%,
      color-mix(in srgb, var(--text) 4%, transparent) 55%,
      transparent 78%);
}
.nav-link svg {
  width: 16px;
  height: 16px;
}

.more-wrap {
  position: relative;
}
.more-menu {
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  width: min(340px, calc(100vw - 28px));
  padding: 8px;
  border-radius: var(--r-lg);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition: opacity 0.18s var(--ease), transform 0.18s var(--ease),
    visibility 0.18s;
  z-index: 120;
  max-height: min(640px, calc(100dvh - var(--nh) - 24px));
  overflow-y: auto;
  scrollbar-width: thin;
}
.more-wrap.open .more-menu {
  opacity: 1;
  visibility: visible;
  transform: none;
}
.more-menu .mg {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-2);
  padding: 12px 12px 5px;
}
.more-menu a.mi {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8.5px 12px;
  border-radius: 10px;
  font-size: 14px;
  color: var(--text-2);
  transition: background 0.14s, color 0.14s;
}
.more-menu a.mi:hover {
  background: var(--glass-bg-2);
  color: var(--text);
}
.more-menu a.mi.on {
  color: var(--text);
  background: var(--glass-bg-3);
}
.more-menu a.mi svg {
  width: 16px;
  height: 16px;
  flex: none;
}

.searchbox {
  margin-left: auto;
  width: min(300px, 30vw);
  height: 38px;
}
.searchbox .field {
  height: 38px;
  border-radius: 999px;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
}
.top-actions .btn-icon {
  border-radius: 11px;
}

.burger {
  display: none;
}

/* ============================================================
   Material Symbols: icon base + per-context sizing/colors.
   d.icon() now returns <span class="msr">ligature</span>, so all
   glyph styling lives here (old svg rules are inert leftovers).
   ============================================================ */
.msr {
  font-family: "Material Symbols Rounded";
  font-weight: normal;
  font-style: normal;
  font-size: 20px;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  font-feature-settings: "liga";
  -webkit-font-feature-settings: "liga";
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -moz-osx-font-smoothing: grayscale;
  user-select: none;
  -webkit-user-select: none;
  flex: none;
  vertical-align: middle;
  font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
}

.btn .msr {
  font-size: 17px;
}
.btn-icon .msr {
  font-size: 19px;
}
.btn-icon-sm .msr {
  font-size: 18px;
}
.nav-link .msr {
  font-size: 19px;
}
.drawer a.mi .msr {
  font-size: 18px;
}
.field .msr {
  font-size: 17px;
  color: var(--text-2);
}
.modal-ic .msr {
  font-size: 19px;
}
.stat .msr {
  font-size: 15px;
  color: var(--ac-1);
}
.panel-head h2 .msr {
  font-size: 17px;
  color: var(--ac-1);
}
.eyebrow .msr {
  font-size: 15px;
}
.set-card .set-title .msr {
  font-size: 17px;
  color: var(--ac-1);
}
.danger-zone .dz-head .msr {
  font-size: 16px;
}
.ann-card .ann-link .msr {
  font-size: 14px;
}
.tile .tile-ic .msr {
  font-size: 19px;
}
.tile .go .msr {
  font-size: 14px;
}
.empty .msr {
  font-size: 34px;
  opacity: 0.8;
}
.toast .msr {
  font-size: 17px;
}
.toast.err .msr {
  color: var(--bad);
}
.pop button .msr,
.pop a .msr {
  font-size: 17px;
}
.back-top .msr {
  font-size: 18px;
}
.hero-search .msr {
  font-size: 19px;
}
.feat-more .msr {
  font-size: 14px;
}
.rec-row .ric .msr {
  font-size: 18px;
  color: var(--text-2);
}
.rec-row .fav-row .msr,
.tfoot .fav .msr {
  font-size: 18px;
}
.rec-row .fav-row.on {
  color: var(--ac-1);
}
/* filled star states */
#btnFav.on .msr,
.tfoot .fav.on .msr,
.fav-row.on .msr {
  font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
}

/* brand mark is now a Material glyph */
.brand-mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  width: auto;
  height: auto;
  color: var(--text);
}

/* ============================================================
   top nav: icon-only links, no Home link, no More dropdown
   ============================================================ */
.nav-links {
  gap: 2px;
  margin-left: 2px;
}
.nav-links .nav-link {
  width: 42px;
  padding: 0;
  justify-content: center;
}
.nav-links .nav-link .msr {
  font-size: 20px;
}
@media (max-width: 860px) {
  .topbar .searchbox {
    width: 42px;
    justify-content: center;
    padding: 0;
    border-radius: 999px;
  }
  .searchbox .sb-txt {
    display: none;
  }
}

/* ============================================================
   top nav: each icon has its own one-shot hover animation.
   transform only, fires once per hover (not a loop).
   ============================================================ */
@keyframes ic-tilt {
  0%, 100% { transform: rotate(0); }
  25% { transform: rotate(-14deg); }
  65% { transform: rotate(12deg); }
}
@keyframes ic-squish {
  0%, 100% { transform: scale(1); }
  30% { transform: scale(1.12, 0.82); }
  55% { transform: scale(0.9, 1.14); }
  75% { transform: scale(1.06, 0.95); }
}
@keyframes ic-spin {
  /* a whole turn, not half of one. A 180deg turn ends facing the wrong way
     and then jumps back to 0 the moment the animation stops (no forwards
     fill): that jump is the sloppy snap. A full spin lands exactly where it
     started, so there is nothing to snap back from. */
  0% { transform: rotate(0deg) scale(1); }
  55% { transform: rotate(205deg) scale(1.09); }
  100% { transform: rotate(360deg) scale(1); }
}
@keyframes ic-bounce {
  0%, 100% { transform: translateY(0); }
  35% { transform: translateY(-5px); }
  70% { transform: translateY(-2px); }
}
@keyframes ic-nudge {
  0%, 100% { transform: rotate(0); }
  40% { transform: rotate(-12deg); }
}
@keyframes ic-shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-2.5px) rotate(-6deg); }
  45% { transform: translateX(2.5px) rotate(6deg); }
  70% { transform: translateX(-1.5px) rotate(-3deg); }
}
@keyframes ic-drop {
  0%, 100% { transform: translateY(0); }
  30% { transform: translateY(4px); }
  55% { transform: translateY(0); }
  75% { transform: translateY(2px); }
}
@keyframes ic-turn {
  /* both stops spelled out: a bare `to` is interpolated as a matrix, and
     rotate(360deg) is the identity matrix, so the gear never moved */
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes ic-slash {
  0% { transform: scale(1) rotate(0); }
  35% { transform: scale(0.82) rotate(-14deg); }
  100% { transform: scale(1) rotate(0); }
}
@keyframes ic-look {
  0%, 100% { transform: translateX(0); }
  35% { transform: translateX(2.5px) rotate(8deg); }
  70% { transform: translateX(-1.5px) rotate(-5deg); }
}
@keyframes ic-flip {
  0% { transform: rotateY(0); }
  100% { transform: rotateY(180deg); }
}
.nav-link[data-ic] .msr {
  display: inline-block;
  will-change: transform;
  transition: translate 0.18s ease, transform 0.18s ease;
}
.nav-link[data-ic="games"]:hover .msr { animation: ic-tilt 0.55s ease; }
.nav-link[data-ic="apps"]:hover .msr { animation: ic-squish 0.5s ease; }
.nav-link[data-ic="proxies"]:hover .msr { animation: ic-spin 0.8s cubic-bezier(0.4, 0, 0.25, 1); }
.nav-link[data-ic="schedule"]:hover .msr { animation: ic-bounce 0.55s ease; }
.nav-link[data-ic="announcements"]:hover .msr { animation: ic-nudge 0.4s ease; }
.nav-link[data-ic="shop"]:hover .msr { animation: ic-shake 0.5s ease; }
.nav-link[data-ic="backups"]:hover .msr { animation: ic-drop 0.55s ease; }
.nav-link[data-ic="settings"]:hover .msr { animation: ic-turn 0.6s ease-in-out; }

/* brand: the slash in the NULL mark snaps through a little stretch. The
   .snap class is toggled by shell.js so entering the mark OR the wordmark
   runs it: a plain :hover would only fire once per visit to the whole
   anchor, so sliding across the logo did nothing. */
.brand .brand-mark .msr.snap { animation: ic-slash 0.5s ease; }
/* search: the magnifier glances left and right, like it is looking */
.searchbox:hover .msr { animation: ic-look 0.6s ease; }
/* theme toggle: the sun/moon flips over like a coin
   (transform-origin center, backface stays visible: the glyph just spins) */
.theme-btn:hover .msr {
  display: inline-block;
  animation: ic-flip 0.55s ease;
}
/* the theme icon swap also gets a settle pop: theme.js re-renders the
   glyph after the toggle, so give the fresh node a small entrance */
.theme-btn .msr.pop-in {
  animation: ic-slash 0.4s ease;
}

/* ============================================================
   dev console (type nldev: full-screen glass terminal overlay)
   ============================================================ */
.dc-ov {
  position: fixed;
  inset: 0;
  z-index: 400; /* above modals (300) */
  display: grid;
  place-items: center;
  padding: 22px;
  background: rgba(0, 0, 0, 0.68);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.18s var(--ease), visibility 0.18s;
}
.dc-ov.on {
  opacity: 1;
  visibility: visible;
}
.dc-box {
  width: min(1080px, 100%);
  height: min(780px, calc(100dvh - 44px));
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-2);
  overflow: hidden;
  transform: translateY(14px) scale(0.985);
  transition: transform 0.22s var(--ease);
}
.dc-ov.on .dc-box {
  transform: none;
}
.dc-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  background: var(--glass-bg);
}
.dc-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.dc-brand .msr {
  color: var(--ac-1);
}
.dc-brand b {
  font-size: 13.5px;
  letter-spacing: 0.22em;
  white-space: nowrap;
}
.dc-ver {
  font-size: 12px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dc-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
  flex: none;
}
.dc-cols {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 12px;
  padding: 14px;
  align-content: start;
  scrollbar-width: thin;
  scrollbar-color: var(--thumb) transparent;
}
.dc-cols::-webkit-scrollbar {
  width: 10px;
}

/* ============================================================
   glow border: slim neon ring at the viewport edge: a 5px border
   with a soft 5px glow hugging it. No blur filters: the glow is two
   stepped bands, so corners stay complete and it stays GPU-cheap.
   Corner radii are matched per layer (inner arc is always the same
   radius) so the glow follows the ring perfectly around corners.
   The gradient rotates in a loop (--nga); comet mode adds a bright
   streak. The border is uniform all the way round: it does not react
   to the cursor.
   ============================================================ */
@property --nga {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}
#null-glow-el {
  position: fixed;
  inset: 0;
  z-index: 9997;
  pointer-events: none;
  transition: opacity 0.6s ease;
}
#null-glow-el i {
  position: absolute;
  inset: 0;
  transition: opacity 0.75s ease;
}
/* ring band shape shared by every border layer (padding = thickness) */
#null-glow-el .ng-ring,
#null-glow-el .ng-glow,
#null-glow-el .ng-glow2,
#null-glow-el .ng-comet {
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
}
/* crisp 5px border */
#null-glow-el .ng-ring {
  padding: 5px;
  border-radius: 12px;
  opacity: 0.95;
  animation: nga 8s linear infinite;
}
/* soft glow: inner step (7px) and outer step (10px) fall off like a blur */
#null-glow-el .ng-glow2 {
  padding: 7px;
  border-radius: 14px;
  opacity: 0.45;
  animation: nga-rev 13s linear infinite;
}
#null-glow-el .ng-glow {
  padding: 10px;
  border-radius: 17px;
  opacity: 0.22;
  animation: nga 17s linear infinite reverse;
}
/* comet streak: same geometry as the ring so it hugs the border */
#null-glow-el .ng-comet {
  padding: 6px;
  border-radius: 13px;
  opacity: 0.95;
  animation: nga 5s linear infinite;
}
/* crossfade helpers: theme.js toggles these when a preset changes */
#null-glow-el .ng-in {
  opacity: 0 !important;
}
#null-glow-el .ng-xf {
  opacity: 0 !important;
}
#null-glow-el.ng-off {
  opacity: 0;
}
@keyframes nga {
  to {
    --nga: 360deg;
  }
}
@keyframes nga-rev {
  from {
    --nga: 360deg;
  }
  to {
    --nga: 0deg;
  }
}
@media (prefers-reduced-motion: reduce) {
  #null-glow-el i,
  .nav-link[data-ic] .msr,
  .brand .brand-mark .msr.snap,
  .searchbox:hover .msr,
  .theme-btn:hover .msr {
    animation: none !important;
  }
}

  display: none;
}

}
.tile .count {
  position: absolute;
  top: 16px;
  right: 16px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  border: 1px solid var(--line);
  padding: 3px 9px;
  border-radius: 999px;
}

/* recent / favorites rows */
.rec-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rec-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--r-md);
  cursor: pointer;
  transition: background 0.15s, transform 0.15s var(--ease);
}
.rec-row:hover {
  background: var(--glass-bg-2);
  transform: translateX(2px);
}
.rec-row .ric {
  width: 42px;
  height: 42px;
  flex: none;
  border-radius: 11px;
  overflow: hidden;
  background: var(--bg-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
}
.rec-row .ric img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.rec-row .ric svg {
  width: 18px;
  height: 18px;
  color: var(--text-2);
}
.rec-row .rtxt {
  flex: 1;
  min-width: 0;
}
.rec-row .rtxt b {
  display: block;
  font-size: 14px;
  font-weight: 620;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rec-row .rtxt span {
  font-size: 11.5px;
  color: var(--text-2);
}
.rec-row .kind-chip {
  flex: none;
}
.rec-row .fav-row {
  flex: none;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  color: var(--text-2);
  border-radius: 8px;
}
.rec-row .fav-row:hover {
  color: var(--text);
  background: var(--glass-bg-3);
}
.rec-row .fav-row.on svg {
  fill: currentColor;
}

.home-cols {
  display: grid;
  grid-template-columns: 1.25fr 1fr;
  gap: var(--grid-gap);
  align-items: start;
}
.panel {
  border-radius: var(--r-lg);
  padding: var(--card-pad);
}
.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.panel-head h2 {
  font-size: 17px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.panel-head h2 svg {
  width: 17px;
  height: 17px;
  color: var(--ac-1);
}
.panel-head .icon-btn-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  text-align: center;
  padding: 46px 20px;
  color: var(--text-2);
  border: 1px dashed var(--line-2);
  border-radius: var(--r-lg);
  background: var(--glass-bg);
}
.empty svg {
  width: 34px;
  height: 34px;
  opacity: 0.8;
}
.empty b {
  font-size: 15px;
  color: var(--text);
}
.empty p {
  font-size: 13px;
  max-width: 340px;
  line-height: 1.5;
}

/* ============================================================
   schedule
   ============================================================ */
.sched-wrap {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.sched-days {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.sched-days .chip-btn {
  height: 32px;
  padding: 0 15px;
  font-size: 13px;
}
.sched-grid {
  display: grid;
  gap: 8px;
}
.sched-row {
  display: grid;
  grid-template-columns: 120px 1fr 150px;
  gap: 14px;
  align-items: center;
  padding: 10px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--glass-bg);
  font-size: 14px;
  position: relative;
}
.sched-row.now {
  border-color: color-mix(in srgb, var(--ac-1) 55%, transparent);
  background: color-mix(in srgb, var(--ac-1) 9%, var(--glass-bg));
}
.sched-row .per {
  font-weight: 700;
}
.sched-row .crs {
  color: var(--text-2);
  font-size: 13.5px;
}
.sched-row .tm {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  font-size: 13.5px;
}
.sched-row .nowtag {
  position: absolute;
  top: -9px;
  left: 14px;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: 0.1em;
  padding: 2px 9px;
  border-radius: 999px;
  color: var(--bg);
  background: var(--ac-1);
}
.sched-note {
  font-size: 12.5px;
  color: var(--text-2);
}
.sched-mini .sched-row {
  grid-template-columns: 88px 1fr 122px;
  padding: 8px 12px;
  font-size: 13px;
}
.sched-mini .sched-row .tm {
  font-size: 12.5px;
}
.sched-nodays {
  padding: 16px 18px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  color: var(--text-2);
  font-size: 14px;
  background: var(--glass-bg);
}

/* ============================================================
   announcements
   ============================================================ */
/* unread dot: pulsing green marker before the eyebrow when a new
   announcement hasn't been seen yet. Fades out once it's marked seen. */
.ann-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22c55e;
  flex: none;
  animation: ann-pulse 1.8s ease-out infinite;
}
.ann-dot.gone {
  opacity: 0;
  transform: scale(0.4);
  animation: none;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
@keyframes ann-pulse {
  0% {
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55);
  }
  70% {
    box-shadow: 0 0 0 7px rgba(34, 197, 94, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
  }
}

/* weekly wrap-up modal: stat tiles + most-played list */
.wu-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0 16px;
}
.wu-stat {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--glass-bg-2);
  padding: 12px 8px;
  text-align: center;
}
.wu-stat b {
  display: block;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--ac-1);
}
.wu-stat span {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-2);
}
.wu-top {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 4px 12px;
  background: var(--glass-bg-2);
}
.wu-top > b {
  display: block;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--text-2);
  padding: 8px 0 2px;
}
.wu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  font-size: 14px;
  border-top: 1px solid var(--line);
}
.wu-rank {
  width: 20px;
  height: 20px;
  flex: none;
  border-radius: 50%;
  border: 1px solid var(--line-2);
  color: var(--text-2);
  font-size: 11.5px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.wu-count {
  margin-left: auto;
  font-size: 12.5px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}

.ann-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.ann-card {
  border-radius: var(--r-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: transform 0.18s var(--ease), border-color 0.18s;
}
.ann-card:hover {
  transform: translateY(-2px);
  border-color: var(--line-2);
}
.ann-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.ann-date {
  font-size: 12px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}
.ann-card h3 {
  font-size: 16.5px;
}
.ann-card p {
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.55;
}
.ann-card .ann-link {
  margin-top: auto;
  font-size: 13.5px;
  font-weight: 650;
  color: var(--ac-1);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding-top: 6px;
  width: fit-content;
}
.ann-card .ann-link svg {
  width: 14px;
  height: 14px;
}

/* page head */
.page-head {
  margin-bottom: 26px;
}
.page-head .eyebrow {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.page-head .eyebrow svg {
  width: 15px;
  height: 15px;
}
.page-head h1 {
  font-size: clamp(28px, 4.4vw, 42px);
  letter-spacing: -0.03em;
}
.page-head p {
  margin-top: 10px;
  max-width: 640px;
  color: var(--text-2);
  font-size: 15px;
  line-height: 1.55;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 22px 0 18px;
}
.toolbar .count {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-2);
  white-space: nowrap;
}
.filter-row {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar {
  display: none;
}

/* ============================================================
   backups / misc static lists
   ============================================================ */
.mirror-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.mirror {
  display: flex;
  gap: 16px;
  align-items: center;
  padding: 16px 18px;
  border-radius: var(--r-lg);
  transition: transform 0.16s var(--ease), border-color 0.16s;
}
.mirror:hover {
  transform: translateY(-2px);
  border-color: var(--line-2);
}
.mirror .m-num {
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 750;
  font-size: 13px;
  border: 1px solid var(--line-2);
  color: var(--text-2);
  background: var(--glass-bg);
}
.mirror .m-body {
  flex: 1;
  min-width: 0;
}
.mirror .m-body h3 {
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.mirror .m-body p {
  font-size: 13px;
  color: var(--text-2);
  margin-top: 3px;
}
.mirror .m-open {
  flex: none;
}

/* ============================================================
   settings
   ============================================================ */
.set-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  align-items: start;
}
.set-card--wide {
  grid-column: 1 / -1;
}
.set-card {
  border-radius: var(--r-lg);
  padding: 22px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.cloak-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  flex: none;
}
@media (max-width: 760px) {
  .set-grid {
    grid-template-columns: 1fr;
  }
}
.set-card .set-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16.5px;
}
.set-card .set-title svg {
  width: 17px;
  height: 17px;
  color: var(--ac-1);
}
.set-card .set-sub {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.5;
  margin-top: -12px;
}
.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.set-row:first-child {
  border-top: 0;
  padding-top: 0;
}
.set-row .lbl-txt b {
  font-size: 14px;
  font-weight: 620;
  display: block;
}
.set-row .lbl-txt span {
  font-size: 12.5px;
  color: var(--text-2);
}
.seg {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  border-radius: 14px;
  background: var(--glass-bg);
  border: 1px solid var(--line);
}
.seg button {
  display: flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 13px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  transition: all 0.16s;
}
.seg button.on {
  background: var(--ac-1);
  color: var(--bg);
}
.seg button .sw {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
  flex: none;
}

.keycap {
  min-width: 52px;
  height: 40px;
  padding: 0 14px;
  border-radius: 11px;
  font-size: 15px;
  font-weight: 640;
  font-family: inherit;
  text-align: center;
}
.keycap.on {
  background: var(--ac-1);
  color: var(--bg);
  border-color: var(--ac-1);
  animation: keypulse 1.1s ease-in-out infinite;
}
@keyframes keypulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.72; }
}

.accent-row,
.glow-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.accent-dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
}
.swatch-btn {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  height: 36px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--glass-bg);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  transition: all 0.15s;
}
.swatch-btn:hover {
  border-color: var(--line-2);
  color: var(--text);
}
.swatch-btn.on {
  border-color: var(--ac-1);
  color: var(--bg);
  background: var(--ac-1);
}
.select-field {
  width: 100%;
}
.tab-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--glass-bg);
}
.tab-preview img {
  width: 18px;
  height: 18px;
}
.tab-preview .tp-txt {
  min-width: 0;
}
.tab-preview .tp-txt b {
  display: block;
  font-size: 13.5px;
  font-weight: 620;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 340px;
}
.tab-preview .tp-txt span {
  font-size: 11.5px;
  color: var(--text-2);
}

.danger-zone {
  border-color: color-mix(in srgb, var(--bad) 40%, var(--line));
}
.danger-zone .dz-head {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--bad);
  font-size: 13px;
  font-weight: 750;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.danger-zone .dz-head svg {
  width: 16px;
  height: 16px;
}

/* ============================================================
   legal / markdown
   ============================================================ */
.md-out {
  padding: clamp(22px, 3.5vw, 40px);
  border-radius: var(--r-lg);
}
.md-out > :first-child {
  margin-top: 0;
}
.md-out h1,
.md-out h2,
.md-out h3 {
  margin: 1.5em 0 0.5em;
  scroll-margin-top: calc(var(--nh) + 20px);
}
.md-out h1 {
  font-size: 26px;
}
.md-out h2 {
  font-size: 21px;
}
.md-out h3 {
  font-size: 17px;
}
.md-out p,
.md-out ul,
.md-out ol,
.md-out blockquote,
.md-out pre,
.md-out table {
  margin: 0.9em 0;
  line-height: 1.65;
}
.md-out p {
  color: var(--text-2);
}
.md-out ul,
.md-out ol {
  padding-left: 22px;
  color: var(--text-2);
}
.md-out li {
  margin: 0.28em 0;
}
.md-out a {
  color: var(--ac-1);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.md-out code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.88em;
  background: var(--glass-bg-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0.12em 0.42em;
}
.md-out pre {
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 14px 16px;
  overflow-x: auto;
}
.md-out pre code {
  background: none;
  border: 0;
  padding: 0;
}
.md-out blockquote {
  border-left: 3px solid var(--ac-1);
  padding: 2px 0 2px 16px;
  color: var(--text-2);
}
.md-out hr {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 1.6em 0;
}
.md-out strong {
  color: var(--text);
}

/* ============================================================
   modals (one shared system)
   ============================================================ */
.modal-ov {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: grid;
  place-items: center;
  padding: 18px;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s, visibility 0.2s;
}
.modal-ov.open {
  opacity: 1;
  visibility: visible;
}
.modal {
  width: min(520px, 100%);
  max-height: min(620px, calc(100dvh - 36px));
  display: flex;
  flex-direction: column;
  border-radius: var(--r-lg);
  overflow: hidden;
  transform: translateY(10px) scale(0.985);
  transition: transform 0.24s var(--ease);
}
.modal-ov.open .modal {
  transform: none;
}
.modal-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px 20px 0;
}
.modal-ic {
  width: 38px;
  height: 38px;
  flex: none;
  border-radius: 12px;
  display: grid;
  place-items: center;
  color: var(--ac-1);
  background: var(--glass-bg-2);
  border: 1px solid var(--line);
}
.modal-ic.warn {
  color: var(--warn);
}
.modal-ic.danger {
  color: var(--bad);
}
.modal-ic svg {
  width: 19px;
  height: 19px;
}
.modal-head h3 {
  font-size: 18px;
  letter-spacing: -0.01em;
}
.modal-body {
  padding: 14px 20px 4px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--thumb) transparent;
}
.modal-body::-webkit-scrollbar {
  width: 9px;
}
.modal-body::-webkit-scrollbar-thumb {
  background: var(--thumb);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
.modal-body::-webkit-scrollbar-thumb:hover {
  background: var(--thumb-hi);
  background-clip: content-box;
  border: 3px solid transparent;
}
.modal-body p {
  font-size: 14.5px;
  color: var(--text-2);
  line-height: 1.6;
}
.modal-body p + p {
  margin-top: 10px;
}
.modal-body b {
  color: var(--text);
}
.modal-foot {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 16px 20px 20px;
  flex-wrap: wrap;
}

/* ============================================================
   search overlay
   ============================================================ */
.search-ov {
  position: fixed;
  inset: 0;
  z-index: 250;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.18s, visibility 0.18s;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: calc(var(--nh) + 30px) 16px 30px;
}
.search-ov.open {
  opacity: 1;
  visibility: visible;
}
.search-panel {
  width: min(680px, 100%);
  max-height: calc(100dvh - var(--nh) - 60px);
  display: flex;
  flex-direction: column;
  border-radius: var(--r-xl);
  overflow: hidden;
}
.search-input {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
}
.search-input svg {
  width: 19px;
  height: 19px;
  color: var(--text-2);
  flex: none;
}
.search-input input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 17px;
  color: var(--text);
}
.search-input .kbd {
  font-size: 11px;
  color: var(--text-2);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  padding: 2px 7px;
  flex: none;
}
.search-results {
  overflow-y: auto;
  padding: 10px;
  scrollbar-width: thin;
  scrollbar-color: var(--thumb) transparent;
}
.search-results::-webkit-scrollbar {
  width: 9px;
}
.search-results::-webkit-scrollbar-thumb {
  background: var(--thumb);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
.sr-group {
  font-size: 11px;
  font-weight: 750;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-2);
  padding: 10px 12px 4px;
}
.sr-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: left;
  padding: 9px 12px;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.13s;
}
.sr-row:hover,
.sr-row.sel {
  background: var(--glass-bg-2);
}
.sr-row .sr-ic {
  width: 36px;
  height: 36px;
  flex: none;
  border-radius: 10px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: var(--glass-bg-2);
  border: 1px solid var(--line);
  color: var(--ac-1);
}
.sr-row .sr-ic img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.sr-row .sr-ic svg {
  width: 17px;
  height: 17px;
}
.sr-row .sr-txt {
  flex: 1;
  min-width: 0;
}
.sr-row .sr-txt b {
  display: block;
  font-size: 14.5px;
  font-weight: 620;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sr-row .sr-txt span {
  font-size: 12px;
  color: var(--text-2);
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sr-none {
  padding: 34px 20px;
  text-align: center;
  color: var(--text-2);
  font-size: 14px;
}

/* ============================================================
   toasts
   ============================================================ */
.toasts {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: min(420px, calc(100vw - 30px));
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 18px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 560;
  box-shadow: var(--shadow-2);
  animation: toast-in 0.25s var(--ease);
  pointer-events: auto;
  max-width: 100%;
}
.toast svg {
  width: 16px;
  height: 16px;
  flex: none;
}
.toast.err {
  border-color: color-mix(in srgb, var(--bad) 45%, var(--line));
}
.toast.err svg {
  color: var(--bad);
}
.toast.out {
  opacity: 0;
  transition: opacity 0.3s;
}
@keyframes toast-in {
  from {
    transform: translateY(10px);
    opacity: 0;
  }
}
@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
}
.fade-up {
  animation: fade-up 0.4s var(--ease) both;
}

/* ============================================================
   player
   ============================================================ */
body.player-page {
  overflow: hidden;
}
.player {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}
.player-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: var(--bg-2);
  flex: none;
  min-height: 56px;
}
.player-meta {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 0 6px;
}
.player-meta b {
  font-size: 14.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 46vw;
}
.player-meta span {
  font-size: 11px;
  color: var(--text-2);
}
.player-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
}
.player-frame {
  flex: 1;
  position: relative;
  min-height: 0;
  display: grid;
  place-items: stretch;
  background: var(--bg-2);
}
.player-frame iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #0c0c0f;
}
.player-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--text-2);
  font-size: 13px;
  gap: 12px;
  pointer-events: none;
  z-index: 1;
}
.spin {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2.5px solid var(--line-2);
  border-top-color: var(--ac-1);
  animation: spin 0.9s linear infinite;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.player-note {
  position: absolute;
  left: 14px;
  bottom: 12px;
  z-index: 2;
  font-size: 11.5px;
  color: var(--text-2);
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--glass-bg-2);
  border: 1px solid var(--line);
  pointer-events: none;
}

/* ============================================================
   minimal theme cleanup + new home / schedule components
   ============================================================ */

/* glow borders are enabled by the Glow setting in Settings (theme.js) */

/* ---------- native selects: flat, with a small arrow ---------- */
select {
  appearance: none;
  -webkit-appearance: none;
  border-radius: var(--r-sm);
}
.field select,
select.field {
  background-color: transparent;
  padding-right: 34px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239a9aa2' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 12px center;
}
.field.select-field {
  position: relative;
  padding-right: 6px;
}
.field.select-field svg {
  display: none;
}

/* ---------- flat panels ---------- */
.panel {
  background: var(--glass-bg);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
}

/* ---------- home masthead (no card) ---------- */
.home-page {
  padding-top: calc(var(--nh) + 46px);
}
.mast {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  max-width: 760px;
  margin: 0 auto;
  padding: 26px 0 8px;
  text-align: left;
}
.mast-kicker {
  font-size: 12px;
  font-weight: 650;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-2);
}
.mast h1 {
  font-size: clamp(40px, 7.5vw, 72px);
  font-weight: 800;
  letter-spacing: -0.045em;
  line-height: 0.98;
}
.mast h1 .dim {
  color: var(--text-2);
  font-weight: 600;
}
.mast-sub {
  color: var(--text-2);
  font-size: 16px;
  line-height: 1.55;
  max-width: 600px;
}
.hero-search {
  width: min(640px, 100%);
  height: 56px;
  padding: 0 8px 0 20px;
  border-radius: 999px;
  gap: 12px;
  margin-top: 8px;
}
.hero-search > svg {

  height: 19px;
}
.hero-search input {

}
.hero-search .btn {

}

/* ---------- featured rail ---------- */
.feat-panel {
  background: var(--glass-bg);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 18px 16px 12px;
}
.feat-track {

}

.feat-track > .tcard {

}
.feat-empty {

}
.feat-more {

  font-size: 13px;

}
.feat-more:hover {

}
.feat-more svg {

}

/* ---------- schedule component ---------- */
.sched-days {

}
.sched-days .chip-btn {

}

.sched-row .s-name {

  text-overflow: ellipsis;
}
.sched-row .s-time {

.sched-note {

}
.hs-head {

  margin-bottom: 6px;
}
.hs-head b {

}
.hs-head > span {

.sched-nodays {

.live-strip .ls-badge.on .dot {

}
.live-strip .ls-badge b {

  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.live-strip .ls-badge span.ls-time {

.live-strip .ls-count .ls-left {

  letter-spacing: 0.12em;

.edit-panel {

}
.sched-editor {

.sched-editor .ed-lunch {

.sched-editor .ed-txt span {

}
.lunch-seg {
  display: inline-flex;
  gap: 4px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--bg-2);
}
.lunch-seg .chip {

  border: 0;
  background: transparent;
}
.lunch-seg .chip.on {
  background: var(--ac-1);
  color: var(--bg);
  border-color: transparent;
}
.sched-editor .ed-input {
  min-width: 0;
  width: 100%;
  border: 1px solid transparent;
  border-bottom-color: var(--line-2);
  background: transparent;
  color: var(--text);
  font-weight: 650;
  font-size: 14px;
  padding: 2px 4px;
  border-radius: 4px;
  outline: 0;
}
.sched-editor .ed-input:focus {
  border-bottom-color: var(--ac-1);
}
.sched-editor .s-name.fixed {
  color: var(--text-2);
  font-weight: 600;
}
.sched-editor .ed-foot {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}
.sched-editor .ed-foot .sp {
  flex: 1;
}
.sched-editor .ed-foot .hint {

#editBar .btn svg {

  height: 14px;
}

@media (max-width: 760px) {

  }
  .live-strip .ls-badge {

  }
  .live-strip .ls-count,
  .live-strip .ls-next {
    flex: 1;

  .live-strip .ls-count .ls-left,

  .sched-row {

  }

}
.pop {

  right: 0;

}
.pop-wrap.open .pop {

  transform: none;
}
.pop button,
.pop a {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 100%;
  text-align: left;
  padding: 8px 11px;
  border-radius: 9px;
  font-size: 13.5px;
  color: var(--text-2);

.pop button:hover,
.pop a:hover {

  color: var(--text);
}
.pop button svg,
.pop a svg {
  width: 15px;
  height: 15px;
}

/* ============================================================
   glow border presets (perf-aware)
   ============================================================ */
@property --ga {
  syntax: "<angle>";
  inherits: false;
  initial-value: 0deg;
}

.glow-el {
  position: relative;
  z-index: 0;
}
html[data-glow="flow"] .glow-el::after,
html[data-glow="drift"] .glow-el::after {
  content: "";
  position: absolute;
  inset: -1.5px;
  border-radius: inherit;
  padding: 1.5px;
  background: conic-gradient(
    from var(--ga),
    transparent 0 12%,
    color-mix(in srgb, var(--glow-c, var(--ac-1)) 85%, transparent) 26%,
    transparent 42% 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  opacity: 0.85;
  animation: ga-rot 6.5s linear infinite;
  pointer-events: none;
  z-index: -1;
}
html[data-glow="drift"] .glow-el::before {
  content: "";
  position: absolute;
  inset: -1.5px;
  border-radius: inherit;
  padding: 1.5px;
  background: conic-gradient(
    from var(--ga),
    transparent 0 40%,
    color-mix(in srgb, var(--glow-c, var(--ac-1)) 45%, transparent) 52%,
    transparent 60% 100%
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
  opacity: 0.7;
  animation: ga-rot-rev 11s linear infinite;
  pointer-events: none;
  z-index: -1;
}
html[data-glow="pulse"] .glow-el {
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow-c, var(--ac-1)) 25%, transparent);
  animation: ga-pulse 3.6s ease-in-out infinite;
}
@keyframes ga-rot {
  to {
    --ga: 360deg;
  }
}
@keyframes ga-rot-rev {
  from {
    --ga: 360deg;
  }
  to {
    --ga: 0deg;
  }
}
@keyframes ga-pulse {
  0%,
  100% {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow-c, var(--ac-1)) 18%, transparent),
      0 0 18px color-mix(in srgb, var(--glow-c, var(--ac-1)) 8%, transparent);
  }
  50% {
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow-c, var(--ac-1)) 45%, transparent),
      0 0 30px color-mix(in srgb, var(--glow-c, var(--ac-1)) 20%, transparent);
  }
}
@media (prefers-reduced-motion: reduce) {
  html[data-glow="flow"] .glow-el::after,
  html[data-glow="drift"] .glow-el::after,
  html[data-glow="drift"] .glow-el::before {
    animation: none;
  }
}

/* ============================================================
   performance mode
   ============================================================ */
html[data-perf="1"] *,
html[data-perf="1"] *::before,
html[data-perf="1"] *::after {
  animation-duration: 0.001s !important;
  transition-duration: 0.001s !important;
}
html[data-perf="1"] .topbar,
html[data-perf="1"] .search-ov,
html[data-perf="1"] .modal-ov,
html[data-perf="1"] .player-bar,
html[data-perf="1"] .drawer-ov,
html[data-perf="1"] .site-foot,
html[data-perf="1"] .glass,
html[data-perf="1"] .glass-2,
html[data-perf="1"] .tcard {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
html[data-perf="1"] .tcard:hover {
  transform: none;
}
html[data-perf="1"] .glow-el {
  box-shadow: none !important;
}

}
.not-found .numb {

/* NULL · perf.css
   Ultra-Performance mode. Performance mode (data-perf="1") shortens
   animation; this is the floor: no motion, no effect layers, no blur and
   no paint work for anything off screen. Meant for machines that cannot
   hold a frame: shell.js only turns it on with the user's say-so.

   Kept in its own file rather than appended to global.css so the rule set
   can be read (and shipped or dropped) on its own. Loaded after
   global.css, so it wins on equal specificity. */

html[data-perf="ultra"] *,
html[data-perf="ultra"] *::before,
html[data-perf="ultra"] *::after {
  animation: none !important;
  transition: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  box-shadow: none !important;
  text-shadow: none !important;
}

/* keep the one outline that matters: where the keyboard is */
html[data-perf="ultra"] :focus-visible {
  outline: 2px solid var(--ac-1);
  outline-offset: 2px;
}

/* effect layers are pure decoration: drop them entirely */
html[data-perf="ultra"] .part-fx,
html[data-perf="ultra"] .pack-fx,
html[data-perf="ultra"] .pack-preview,
html[data-perf="ultra"] .part-preview,
html[data-perf="ultra"] #null-glow-el,
html[data-perf="ultra"] .glow-bg,
html[data-perf="ultra"] .sf-p,
html[data-perf="ultra"] .cf-ov {
  display: none !important;
}

/* no card lift on hover either (the standard perf rule only covers
   [data-perf="1"], and ultra sets its own value) */
html[data-perf="ultra"] .tcard:hover,
html[data-perf="ultra"] .mirror:hover,
html[data-perf="ultra"] .ann-card:hover,
html[data-perf="ultra"] .shop-card:hover,
html[data-perf="ultra"] .panel:hover {
  transform: none !important;
}

/* only paint what's on screen: cards and rows outside the viewport skip
   layout + paint until they're scrolled to */
html[data-perf="ultra"] .tcard,
html[data-perf="ultra"] .mirror,
html[data-perf="ultra"] .ann-card,
html[data-perf="ultra"] .set-card,
html[data-perf="ultra"] .shop-card,
html[data-perf="ultra"] .shop-row,
html[data-perf="ultra"] .panel,
html[data-perf="ultra"] .section {
  content-visibility: auto;
  contain-intrinsic-size: auto 300px;
}

/* ============================================================
   Mini-Perf mode (Settings → Appearance)
   The opposite trade to Ultra-Perf: nothing is stripped, nothing is
   turned off, no effect layer is dropped and no animation is shortened.
   The only thing it does is tell the browser to skip layout, paint and
   animation for the blocks that are off screen, then restore them the
   moment they scroll back in. Full visuals, less work per frame.

   Two things had to be true for this to not fight the scrollbar:

     · Only page-level blocks get it. The first cut put it on every tile
       (a card, a row, a mirror in a grid), and that is what made the page
       rubber-band: a grid item's height feeds the row height, so every
       tile popping back in re-laid out the rows around it and shoved the
       content under the cursor. Big standalone blocks have stable heights
       and the same win without the fight.
     · `contain-intrinsic-size: auto <size>` is the important half: `auto`
       remembers each block's own last size, so the scrollbar does not jump
       on the way back past it.

   Skipped on the effect layers and the fixed nav, which must stay painted
   at all times. */
html[data-mini="1"] .section,
html[data-mini="1"] .panel,
html[data-mini="1"] .home-cols > *,
html[data-mini="1"] .legal-body > * {
  content-visibility: auto;
  contain-intrinsic-size: auto 480px;
}

/* a full page of cards is a known-tall block: give the first pass something
   closer to its real height than the default guess. The library grids are
   not in here on purpose: they are virtualized by cards.js, and the browser
   sizing their tiles for them is what this whole comment is about. */
html[data-mini="1"] .shop-grid,
html[data-mini="1"] .home-grid,
html[data-mini="1"] .ann-list {
  content-visibility: auto;
  contain-intrinsic-size: auto 900px;
}

/* the library grid is virtualized: cards.js empties and refills rows as you
   scroll. Browser scroll anchoring cannot hold on to a node that is about to
   be removed, so it keeps re-picking one and nudging the page. Every row is
   an explicit height, so there is nothing for anchoring to correct anyway. */
body.lb #scrollview,
.vgrid .vrow {
  overflow-anchor: none;
}

/* NULL · extra.css
   Additions kept out of global.css on purpose. Linked on every page after
   global.css so these rules win when they need to. */

/* The `hidden` attribute is how this site hides things, but any author
   `display` rule beats the browser's own [hidden], and almost every element
   here is a flex or grid box. Say it once, loudly, and `hidden` means hidden. */
[hidden] {
  display: none !important;
}

/* ============================================================
   layout compactness (Settings → Appearance)
   global.css sets the scale behind html[data-density]; these are the
   handful of rules that live later in the cascade, so they re-take it
   here. One scale, every page: no per-page density styling.
   ============================================================ */
html[data-density] .set-grid,
html[data-density] .shop-grid,
html[data-density] .home-cols {
  gap: var(--grid-gap);
}
html[data-density] .set-card {
  padding: var(--card-pad);
  gap: var(--card-gap);
}
html[data-density] .shop-grid {
  grid-template-columns: repeat(auto-fill, minmax(var(--tile), 1fr));
}
html[data-density] .shop-grid--list {
  grid-template-columns: 1fr;
}
html[data-density] .shop-rows {
  gap: calc(var(--grid-gap) * 0.55);
}
html[data-density] .set-row {
  padding: calc(var(--card-gap) * 0.66) 0;
}
html[data-density="compact"] .shop-grid--list .pack-thumb,
html[data-density="compact"] .shop-grid--list .part-thumb {
  width: 128px;
  flex-basis: 128px;
}

/* the density and season pickers hold four or more options: wrap them
   instead of pushing the card wider than the screen */
.seg {
  flex-wrap: wrap;
}

/* ============================================================
   custom background image (Shop unlock)
   A fixed layer behind the theme pack and the particles, holding
   whatever picture the visitor set in Settings: a link or an upload.
   --bg-dim lays the page's own background colour over it as a tint,
   so text stays readable on any picture. */
.bg-fx {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
}
.bg-fx::after {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--bg);
  opacity: var(--bg-dim, 0.35);
}
html[data-perf="ultra"] .bg-fx,
html[data-perf="1"] .bg-fx {
  display: none;
}

/* ============================================================
   Neon's tubes and pulse rings
   econ.js names these two kinds neonTube / neonPulse, so theme.js writes the
   classes pf-p-neonTube / pf-p-neonPulse. The rules further down this sheet
   spell the same selectors in lowercase, which never matched a class: the
   Neon pack's tubes and rings were quietly drawing as bare dots. Same
   declarations, correct case. The keyframes they share (pk-neon-flicker,
   pk-neon-bob, pk-neon-pulse) are the ones already defined down there.
   ============================================================ */
.pf-p-neonTube b {
  width: calc(var(--s) * 1.8);
  height: calc(var(--s) * 40);
  border-radius: 999px;
  background: linear-gradient(180deg, transparent, var(--glow-4, #6cff9e) 26%, #fff 74%, var(--glow-1, #00e5ff));
  box-shadow:
    0 0 12px color-mix(in srgb, var(--glow-1, #00e5ff) 85%, transparent),
    0 0 40px color-mix(in srgb, var(--glow-4, #6cff9e) 55%, transparent);
  animation:
    pk-neon-flicker calc(var(--dur, 5) * 0.5s) steps(2, end) infinite,
    pk-neon-bob calc(var(--dur, 5) * 6s) ease-in-out infinite alternate;
  animation-delay: calc(var(--delay, 0) * -1s);
}
.pf-p-neonPulse b {
  width: calc(var(--s) * 80);
  height: calc(var(--s) * 80);
  border-radius: 50%;
  border: calc(var(--s) * 0.5) solid color-mix(in srgb, var(--glow-2, #b14bff) 60%, transparent);
  box-shadow: 0 0 30px color-mix(in srgb, var(--glow-2, #b14bff) 55%, transparent);
  animation-name: pk-neon-pulse;
  animation-duration: calc(var(--dur, 5) * 4.4s);
  animation-timing-function: ease-out;
  animation-delay: calc(var(--delay, 0) * -1s);
}

/* ============================================================
   hidden-page triggers (shell.js)
   hold Backspace wipes the page into /void, and the period-four
   orb leads to /blob.
   ============================================================ */
.erase-ov {
  position: fixed;
  inset: 0;
  z-index: 200;
  overflow: hidden;
  pointer-events: none;
}
.erase-fill {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0;
  background: var(--bg);
  will-change: height;
  -webkit-mask-image: repeating-linear-gradient(to top, #000 0 7px, transparent 7px 12px);
  mask-image: repeating-linear-gradient(to top, #000 0 7px, transparent 7px 12px);
}
.erase-edge {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 2px;
  background: var(--text-2);
  opacity: 0.5;
}
.erase-hint {
  position: absolute;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--text-2);
  opacity: 0;
  transition: opacity 0.3s var(--ease);
}
.erase-ov.holding .erase-hint {
  opacity: 0.7;
}
/* released early: the wipe unwinds back down */
.erase-ov.out .erase-fill {
  transition: height 0.2s var(--ease);
}
.erase-ov.out .erase-edge {
  transition: bottom 0.2s var(--ease);
}
/* held to the end: the stripes close up and the screen goes blank */
.erase-ov.filled .erase-fill {
  -webkit-mask-image: none;
  mask-image: none;
  transition: height 0.12s linear;
}

.blob-orb {
  position: fixed;
  left: 18px;
  bottom: 18px;
  z-index: 70;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--line-2);
  background: var(--glass-bg-2);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow-1);
  color: var(--text-2);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease);
}
.blob-orb:hover {
  transform: scale(1.06);
  color: var(--text);
}
.blob-orb.armed {
  color: var(--text);
  border-color: var(--ac-1);
}
.orb-face {
  letter-spacing: 0.02em;
}
@media (hover: none) {
  .blob-orb {
    width: 48px;
    height: 48px;
  }
}

/* ============================================================
   player fullscreen: the bar docks to the bottom and auto-hides
   ============================================================ */
body.player-page.fs .player-bar {
  position: absolute;
  top: auto;
  bottom: 0;
  left: 0;
  right: 0;
  border-bottom: 0;
  border-top: 1px solid var(--line);
  transform: translateY(calc(100% + 10px));
  opacity: 0;
  transition: transform 0.24s var(--ease), opacity 0.24s var(--ease);
}
body.player-page.fs .player-bar.show {
  transform: none;
  opacity: 1;
}

/* ---------- player: hide the bar, keep a handle ----------
   Hiding drops the bar out of the layout (so the frame takes the whole
   screen) and leaves a small chat-head at the bottom edge. It idles dimmed
   over the game and wakes up on hover, or for a few seconds after hiding
   so it is obvious where the controls went. */
.player-bar {
  transition: transform 0.28s var(--ease), opacity 0.28s var(--ease);
}
body.player-page.bar-hidden .player-bar {
  position: absolute;
  top: auto;
  bottom: 0;
  left: 0;
  right: 0;
  border-bottom: 0;
  border-top: 1px solid var(--line);
  transform: translateY(calc(100% + 4px));
  opacity: 0;
  pointer-events: none;
}
.bar-handle[hidden] {
  display: none;
}
.bar-handle {
  position: fixed;
  left: 50%;
  bottom: 14px;
  z-index: 6;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 34px;
  padding: 0 13px 0 9px;
  border-radius: 999px;
  border: 1px solid var(--line-2);
  background: color-mix(in srgb, var(--glass-bg) 90%, transparent);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  box-shadow: var(--shadow-1);
  color: var(--text);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: lowercase;
  cursor: pointer;
  opacity: 0.34;
  transform: translateX(-50%);
  transition: opacity 0.2s, transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  animation: bh-in 0.3s var(--ease) both;
}
.bar-handle .bh-ic {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--glass-bg-3);
  color: var(--text);
  flex: none;
}
.bar-handle .bh-ic .msr {
  font-size: 15px;
}
.bar-handle .bh-txt {
  max-width: 0;
  overflow: hidden;
  white-space: nowrap;
  opacity: 0;
  transition: max-width 0.22s var(--ease), opacity 0.18s;
}
.bar-handle:hover,
.bar-handle:focus-visible,
.bar-handle.awake {
  opacity: 1;
}
.bar-handle:hover,
.bar-handle:focus-visible {
  transform: translateX(-50%) translateY(-2px);
  border-color: color-mix(in srgb, var(--ac-1) 45%, var(--line-2));
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6), 0 0 0 4px color-mix(in srgb, var(--ac-1) 12%, transparent);
}
.bar-handle:hover .bh-txt,
.bar-handle:focus-visible .bh-txt,
.bar-handle.awake .bh-txt {
  max-width: 90px;
  opacity: 1;
}
.bar-handle.awake {
  animation: bh-pulse 1.5s ease-in-out 2;
}
@keyframes bh-in {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(16px);
  }
  to {
    opacity: 0.34;
    transform: translateX(-50%);
  }
}
@keyframes bh-pulse {
  0%,
  100% {
    box-shadow: var(--shadow-1), 0 0 0 0 color-mix(in srgb, var(--ac-1) 30%, transparent);
  }
  50% {
    box-shadow: var(--shadow-1), 0 0 0 9px color-mix(in srgb, var(--ac-1) 0%, transparent);
  }
}
@media (prefers-reduced-motion: reduce) {
  .bar-handle {
    animation: none;
  }
}
body.player-page.fs .player-note {
  bottom: 14px;
}
.player-page .player-note {
  position: fixed;
  left: 50%;
  bottom: 66px;
  transform: translateX(-50%);
  z-index: 5;
  font-size: 11.5px;
  color: var(--text-2);
  background: var(--glass-bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 14px;
  pointer-events: none;
  white-space: nowrap;
  max-width: calc(100vw - 24px);
  overflow: hidden;
  text-overflow: ellipsis;
}
