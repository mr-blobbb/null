    star: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="{C}" d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5z"/></svg>',
    /* petal: a soft teardrop */
    petal: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="{C}" d="M12 2C17 8 19.5 12.5 12 22 4.5 12.5 7 8 12 2Z"/></svg>',
    /* mote: a plain soft round light, for the summer pass */
    mote: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="{C}"/></svg>',
  };

  /* ---------- themes ----------
     `kinds` is walked in order, one shape per particle, so the mix and the
     order of what falls are both visible in the list. `size` is the px
     range, `n` how many, `window` the day range a holiday claims inside its
     season, `palette` the colors the shapes take, `colors` the pair used for
     --ac-* when the visitor has no accent of their own. */
  var THEMES = {
    fall: {
      id: "fall",
      label: "Fall",
      hint: "leaves drift behind everything",
      kinds: ["leaf"],
      size: [14, 26],
      n: 16,
      palette: ["#c97b3a", "#d9a441", "#a85a32", "#e0b45f"],
      colors: { c1: "#d98e3d", c2: "#e6b45f" },
    },
    halloween: {
      id: "halloween",
      label: "Halloween",
      hint: "bats and leaves drift behind everything",
      kinds: ["bat", "bat", "leaf"],
      size: [12, 24],
      n: 18,
      window: { month: 9, from: 18, to: 31 },
      palette: ["#ff8a3d", "#a06be0", "#e0b45f", "#c97b3a"],
      colors: { c1: "#e2813d", c2: "#a06be0" },
    },
    winter: {
      id: "winter",
      label: "Winter",
      hint: "snow drifts behind everything",
      kinds: ["snow"],
      size: [10, 18],
      n: 22,
      palette: ["#eef1f6", "#d9dee8", "#ffffff"],
      colors: { c1: "#7fb4e8", c2: "#b9d8f5" },
    },
    holidays: {
      id: "holidays",
      label: "Holidays",
      hint: "snow and gold light drift behind everything",
      kinds: ["snow", "star"],
      size: [10, 20],
      n: 22,
      window: { month: 11, from: 8, to: 31 },
      palette: ["#ffffff", "#f2d98c", "#c94f4f", "#8fd6a5"],
      colors: { c1: "#c94f4f", c2: "#8fd6a5" },
    },
    spring: {
      id: "spring",
      label: "Spring",
      hint: "blossom petals float behind everything",
      kinds: ["petal"],
      size: [11, 20],
      n: 14,
      palette: ["#e291b0", "#f0b8cf", "#d97b9c", "#f3cfe0"],
      colors: { c1: "#e291b0", c2: "#f0b8cf" },
    },
    summer: {
      id: "summer",
      label: "Summer",
      hint: "light motes drift behind everything",
      kinds: ["mote"],
      size: [8, 16],
      n: 12,
      palette: ["#e6c35c", "#f0d98c", "#f5e3a8"],
      colors: { c1: "#d9b64a", c2: "#f0d98c" },
    },
  };

  /* the seasons themselves: which months they cover, and which themes they
     offer. The first variant is the plain season and the one that wins when
     no holiday window is open. */
  var SEASONS = [
    { id: "winter", months: [11, 0, 1], variants: ["winter", "holidays"] },
    { id: "spring", months: [2, 3, 4], variants: ["spring"] },
    { id: "summer", months: [5, 6, 7], variants: ["summer"] },
    { id: "fall", months: [8, 9, 10], variants: ["fall", "halloween"] },
  ];

  function seasonFor(date) {
    var m = (date || new Date()).getMonth();
    return (
      SEASONS.find(function (s) {
        return s.months.indexOf(m) >= 0;
      }) || SEASONS[0]
    );
  }

  function themeFor(id) {
    return (id && THEMES[id]) || THEMES.fall;
  }

  /* is today inside a variant's own window? */
  function inWindow(t, date) {
    if (!t.window) return false;
    var d = date || new Date();
    return d.getMonth() === t.window.month && d.getDate() >= t.window.from && d.getDate() <= t.window.to;
  }

  /* the theme the calendar alone would pick right now */
  function autoTheme(date) {
    var season = seasonFor(date);
    var hit = null;
    season.variants.forEach(function (id) {
      if (inWindow(THEMES[id], date)) hit = id;
    });
    return THEMES[hit || season.variants[0]];
  }

  function detect() {
    /* dev-console preview wins over everything */
    var ov = N.prefs.get("seasonOverride");
    if (ov && THEMES[ov]) return THEMES[ov];
    /* then the theme the visitor picked in Settings */
    var pick = N.prefs.get("seasonVariant");
    if (pick && THEMES[pick]) return THEMES[pick];
    return autoTheme();
  }

  /* ---------- particle layer ---------- */
  var fx = null;

  function gated() {
    return (
      document.body.classList.contains("player-page") ||
      document.body.classList.contains("page-404")
    );
  }

  function spawn() {
    var t = detect();
    var perf = N.prefs.get("perf");
    var reduced =
      window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (N.prefs.data.seasonal === false || gated() || perf || reduced) return;
    if (fx && fx.el.isConnected) return;

    var el = document.createElement("div");
    el.className = "season-fx";
    el.setAttribute("aria-hidden", "true");
    for (var i = 0; i < t.n; i++) {
      var svg = SHAPES[t.kinds[i % t.kinds.length]] || SHAPES.fall || SHAPES.mote;
      var p = document.createElement("span");
      p.className = "sf-p";
      var uri =
        "data:image/svg+xml;utf8," +
        encodeURIComponent(svg.replace("{C}", t.palette[i % t.palette.length]));
      p.style.backgroundImage = "url(\"" + uri + "\")";
      var px = (t.size[0] + Math.random() * (t.size[1] - t.size[0])).toFixed(1);
      p.style.width = px + "px";
      p.style.height = px + "px";
      p.style.left = (Math.random() * 100).toFixed(2) + "%";
      p.style.opacity = (0.3 + Math.random() * 0.45).toFixed(2);
      p.style.animationDelay = (-Math.random() * 18).toFixed(2) + "s";
      p.style.animationDuration = (9 + Math.random() * 11).toFixed(2) + "s";
      p.style.setProperty("--sf-sway", (Math.random() * 120 - 60).toFixed(0) + "px");
      p.style.setProperty("--sf-rot", (Math.random() * 520 - 260).toFixed(0) + "deg");
      el.appendChild(p);
    }
    document.body.appendChild(el);
    fx = { el: el };
    if (document.hidden) el.classList.add("sf-hidden");
  }

  function kill() {
    if (!fx) return;
    if (fx.el.parentNode) fx.el.parentNode.removeChild(fx.el);
    fx = null;
  }

  /* ---------- accent + season flag ---------- */
  function accentApply() {
    var on = N.prefs.data.seasonal !== false;
    if (!on) {
      root.removeAttribute("data-season");
      if (!N.prefs.data.accent || N.prefs.data.accent === "off") {
        root.style.removeProperty("--ac-1");
        root.style.removeProperty("--ac-2");
      }
      return;
    }
    var t = detect();
    root.dataset.season = t.id;
    /* seasonal colors only when the user hasn't picked their own accent */
    if (!N.prefs.data.accent || N.prefs.data.accent === "off") {
      root.style.setProperty("--ac-1", t.colors.c1);
      root.style.setProperty("--ac-2", t.colors.c2);
    }
  }

  function refresh() {
    accentApply();
    kill();
    if (!document.hidden) spawn();
  }

  /* pause particle animation while the tab is hidden */
  document.addEventListener("visibilitychange", function () {
    if (fx) fx.el.classList.toggle("sf-hidden", document.hidden);
  });

  refresh();

  N.seasons = {
    now: detect,
    refresh: refresh,
    /* the theme the calendar alone would pick, ignoring any pick or preview */
    auto: autoTheme,
    /* every theme on offer for the season we are in: Settings lists these so
       the season and its holiday are both there to choose between */
    options: function (date) {
      var season = seasonFor(date);
      var auto = autoTheme(date);
      return season.variants.map(function (id) {
        return Object.assign({}, THEMES[id], { season: season.id, auto: id === auto.id });
      });
    },
    all: function () {
      return Object.keys(THEMES).map(function (id) {
        return Object.assign({}, THEMES[id]);
      });
    },
    /* Settings: choose which theme is worn. `id` is a theme id, or null for
       "Automatic" (the calendar, holiday windows included). Clears any
       dev-console preview so the choice actually takes. */
    setVariant: function (id) {
      N.prefs.set("seasonal", true);
      N.prefs.set("seasonOverride", null);
      N.prefs.set("seasonVariant", id && THEMES[id] ? id : null);
      refresh();
      return detect();
    },
    /* dev console: force a theme, follow the calendar, or turn it off */
    pick: function (id) {
      if (!id || id === "off") {
        N.prefs.set("seasonal", false);
        N.prefs.set("seasonOverride", null);
        N.prefs.set("seasonVariant", null);
      } else if (id === "auto") {
        N.prefs.set("seasonal", true);
        N.prefs.set("seasonOverride", null);
        N.prefs.set("seasonVariant", null);
      } else {
        N.prefs.set("seasonal", true);
        N.prefs.set("seasonOverride", id);
      }
      refresh();
    },
  };
})();

/* NULL · scroll.js
   Custom overlay scrollbar for the library pages (games / apps / proxies).
   The native page scrollbar is hidden; a slim frosted pill tracks scroll.
   The page itself keeps scrolling normally. */
(function () {
  var N = (window.N = window.N || {});
  var d = N.dom;

  function attach(container) {
    if (!container) return null;
    /* one rail per container */
    if (container._nullRail) return container._nullRail;

    container.style.position = "relative";
    var rail = d.h("div", { class: "rail", "aria-hidden": "true" });
    var thumb = d.h("div", { class: "th" });
    rail.appendChild(thumb);
    container.appendChild(rail);

    var hideTimer = null;
    var dragging = false;

    function size() {
      var sh = container.scrollHeight;
      var ch = container.clientHeight;
      if (sh <= ch + 2) {
        rail.classList.remove("show");
        return;
      }
      var th = Math.max(46, (ch / sh) * ch);
      thumb.style.height = th + "px";
      pos();
    }

    function pos() {
      var sh = container.scrollHeight - container.clientHeight;
      var ch = container.clientHeight;
      if (sh <= 0) return;
      var maxTop = ch - thumb.offsetHeight - 8;
      var p = (container.scrollTop / sh) * maxTop;
      thumb.style.top = Math.max(4, p) + "px";
    }

    function wake() {
      size();
      rail.classList.add("show");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(function () {
        if (!dragging) rail.classList.remove("show");
      }, 1400);
    }

    var ticking = false;
    container.addEventListener(
      "scroll",
      function () {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(function () {
            pos();
            wake();
            ticking = false;
          });
        }
      },
      { passive: true },
    );

    rail.addEventListener("mouseenter", wake);
    rail.addEventListener("mouseleave", function () {
      if (!dragging) rail.classList.remove("show");
    });

    thumb.addEventListener("pointerdown", function (e) {
      dragging = true;
      rail.classList.add("drag");
      thumb.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    thumb.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var rect = rail.getBoundingClientRect();
      var sh = container.scrollHeight - container.clientHeight;
      var maxTop = rect.height - thumb.offsetHeight;
      var y = e.clientY - rect.top - thumb.offsetHeight / 2;
      var ratio = d.clamp(y / maxTop, 0, 1);
      container.scrollTop = ratio * sh;
    });
    function up(e) {
      dragging = false;
      rail.classList.remove("drag");
      try {
        thumb.releasePointerCapture(e.pointerId);
      } catch (err) {}
      wake();
    }
    thumb.addEventListener("pointerup", up);
    thumb.addEventListener("pointercancel", up);

    var ro = null;
    if (typeof ResizeObserver !== "undefined") {
      ro = new ResizeObserver(function () {
        wake();
      });
      ro.observe(container);
    }

    window.addEventListener("resize", wake);
    wake();

    container._nullRail = { rail: rail, size: size, destroy: function () {
        if (ro) ro.disconnect();
        window.removeEventListener("resize", wake);
        rail.remove();
        delete container._nullRail;
      } };
    return container._nullRail;
  }

  N.scroll = { attach: attach };
})();

/* NULL · router.js
   Single source of truth for the navigation model: which links exist, where
   they point, and which one is active on the current page. Pages are plain
   HTML files: this just keeps their menus/footers consistent.

   Root pages are linked by their extensionless site path ("/schedule"), which
   is what a visitor sees in the address bar. GitHub Pages serves those through
   404.html (it redirects to the real file) and the service worker answers for
   them offline; /games/ style folder links hit the directory index directly. */
(function () {
  var N = (window.N = window.N || {});

  /* top nav: icon-only destinations. Home is the NULL brand mark itself,
     so it is not a separate link. The mobile drawer shows all of these. */
  var PRIMARY = [
    { id: "games", t: "Games", url: "/games/", icon: "game" },
    { id: "apps", t: "Apps", url: "/apps/", icon: "grid" },
    { id: "proxies", t: "Proxies", url: "/proxies/", icon: "proxy" },
    { id: "schedule", t: "Schedule", url: "/schedule", icon: "sched" },
    { id: "announcements", t: "Announcements", url: "/announcements", icon: "ann" },
    { id: "shop", t: "Shop", url: "/shop", icon: "store" },
    { id: "backups", t: "Backups", url: "/backups", icon: "backups" },
    /* the only nav item that opens a menu instead of a page: it lists what is
       installed so an extension popup is one click from anywhere. The page
       behind it is the same manager, linked at the bottom of that menu. */
    { id: "extensions", t: "Extensions", url: "/extensions", icon: "puzzle", menu: "ext" },
    { id: "labs", t: "Labs", url: "/labs", icon: "beaker" },
    { id: "settings", t: "Settings", url: "/settings", icon: "settings" },
  ];

  /* grouped view used by the mobile drawer */
  var GROUPS = [
    {
      name: "Library",
      links: [
        { t: "Games", url: "/games/", icon: "game" },
        { t: "Apps", url: "/apps/", icon: "grid" },
        { t: "Proxies", url: "/proxies/", icon: "proxy" },
      ],
    },
    {
      name: "More",
      links: [
        { t: "Announcements", url: "/announcements", icon: "ann" },
        { t: "Schedule", url: "/schedule", icon: "sched" },
        { t: "Shop", url: "/shop", icon: "store" },
        { t: "Backups", url: "/backups", icon: "backups" },
        { t: "Extensions", url: "/extensions", icon: "puzzle" },
        { t: "Labs", url: "/labs", icon: "beaker" },
        { t: "Settings", url: "/settings", icon: "settings" },
      ],
    },
  ];

  /* About / District / License / Privacy / Terms / Cookies live only in the
     footer bottom links: they are not menu destinations. */
  var FOOT = [
    {
      name: "Explore",
      links: [
        { t: "Home", url: "/" },
        { t: "Games", url: "/games/" },
        { t: "Apps", url: "/apps/" },
        { t: "Proxies", url: "/proxies/" },
        { t: "Announcements", url: "/announcements" },
        { t: "Schedule", url: "/schedule" },
        { t: "Shop", url: "/shop" },
        { t: "Settings", url: "/settings" },
      ],
    },
    {
      name: "Info",
      links: [
        { t: "About", url: "/about" },
        { t: "District", url: "/district" },
        { t: "License", url: "/license" },
        { t: "Privacy", url: "/privacy" },
        { t: "Terms", url: "/terms" },
        { t: "Cookies", url: "/cookies" },
      ],
    },
  ];

  function isActive(url) {
    /* compare the page against the link *inside* NULL: strip the folder NULL
       is served from first, so the same table lights up the right item at a
       domain root and under a project path alike */
    var p = location.pathname;
    if (N.base !== "/" && p.indexOf(N.base) === 0) p = "/" + p.slice(N.base.length);
    if (url === "/") return p === "/" || p === "/index.html";
    /* normalize both sides: strip the trailing slash, any /index.html
       suffix and any .html, so /games, /games/, /games/index.html and
       /games.html all light up the same nav item on any host */
    function norm(s) {
      if (s.length > 1 && s.charAt(s.length - 1) === "/") s = s.slice(0, -1);
      if (s.slice(-11) === "/index.html") s = s.slice(0, -11);
      return s.replace(/\.html$/, "");
    }
    var dir = norm(p);
    var target = norm(url);
    return dir === target || dir === target + ".html";
  }

  N.router = {
    PRIMARY: PRIMARY,
    GROUPS: GROUPS,
    FOOT: FOOT,
    isActive: isActive,
    all: function () {
      return PRIMARY.concat(
        GROUPS.reduce(function (a, g) {
          return a.concat(g.links);
        }, []),
      );
    },
  };
})();

/* NULL: catalog.js
   Runtime view of the auto-generated catalog (window.NULL_CATALOG).
   Also owns the launch flows: game/app warning modals, proxy redirect
   confirmations and recently-played tracking. */
(function () {
  var N = (window.N = window.N || {});
  var d = N.dom;

  function raw() {
    return window.NULL_CATALOG || { games: [], apps: [], proxies: [] };
  }

  /* shop-unlocked beta games merge into the live library at runtime. They
     stay out of the auto-discovered catalog until a player buys them, then
     they behave like any other entry: library, search, featured, recents. */
  function betaGames() {
    if (!N.econ || !N.econ.unlockedBetas) return [];
    return N.econ.unlockedBetas().map(function (b) {
      return {
        id: b.id,
        name: b.name,
        desc: b.desc,
        file: b.file,
        thumb: b.thumb || null,
        labels: b.labels || ["beta"],
      };
    });
  }

  /* An entry stores its own site paths inside the catalog: the game folder
     plus its thumbnail. Prefix those with the folder NULL is served from, here
     in the one place the rest of the site reads entries from, so cards, search,
     the player and the thumbnails all get an address they can use as-is. */
  function live(list) {
    return (list || []).map(function (e) {
      var out = Object.assign({}, e);
      /* keep=true: a game file and a thumbnail are real files, not pages */
      if (out.file) out.file = N.url(out.file, true);
      if (out.thumb) out.thumb = N.url(out.thumb, true);
      return out;
    });
  }

  N.catalog = {
    games: function () {
      return live(raw().games.concat(betaGames()));
    },
    apps: function () {
      return live(raw().apps);
    },
    proxies: function () {
      return live(raw().proxies);
    },
    find: function (kind, id) {
      var list = kind === "app" ? this.apps() : kind === "proxy" ? this.proxies() : this.games();
      return list.find(function (e) {
        return e.id === id;
      });
    },
    thumb: function (kind, entry) {
      if (entry && entry.thumb) return entry.thumb;
      return d.fbFor(kind);
    },
    counts: function () {
      return {
        games: this.games().length,
        apps: this.apps().length,
        proxies: this.proxies().length,
      };
    },
  };

  var KIND_LABEL = { game: "Game", app: "App", proxy: "Proxy" };

  function playerUrl(kind, id) {
    return N.url("/player") + "?k=" + encodeURIComponent(kind) + "&id=" + encodeURIComponent(id);
  }

  function go(kind, entry) {
    var id = entry.id;
    if (!entry.file && kind !== "proxy") {
      d.toast("The files for “" + entry.name + "” are missing.", { type: "err" });
      return;
    }
    N.recent.add(kind, id);
    if (kind !== "proxy" && N.plays) N.plays.tap(kind, id); /* powers card badges */
    if (kind !== "proxy" && N.week) N.week.log(kind, id); /* weekly wrap-up log */
    if (N.econ && N.econ.trackPlay) N.econ.trackPlay(kind, id); /* quests + achievements */

    if (entry.warning) {
      N.modal.open({
        title: entry.warning.title || "Heads up",
        icon: "warn",
        iconTone: "warn",
        body:
          "<p>" +
          d.escHtml(entry.warning.description || "").replace(/\n/g, "<br>") +
          "</p>",
        dismissible: false,
        actions: [
          { label: "Go back", variant: "outline" },
          {
            label: "Okay",
            variant: "primary",
            onClick: function () {
              location.href = playerUrl(kind, id);
            },
          },
        ],
      });
      return;
    }
    if (N.ext) N.ext.emit("player:open", { kind: kind, id: id });
    location.href = playerUrl(kind, id);
  }

  function openExternal(url, name, status) {
    var host = "";
    try {
      host = new URL(url).host;
    } catch (err) {}
    var blocked = status === "Blocked";
    var body =
      "<p><b>" +
      d.escHtml(name) +
      "</b> lives outside NULL. Continue opens it in a new tab on <b>" +
      d.escHtml(host || "an external site") +
      "</b>.</p>" +
      (blocked
        ? '<p style="color:var(--bad)">Its status is marked <b>Blocked</b>: it may be unavailable right now.</p>'
        : "") +
      "<p>This can trigger a popup / redirect prompt: that’s NULL asking the browser for permission, and it’s not malicious.</p>";
    N.modal.open({
      title: "Leave NULL?",
      icon: "ext",
      body: body,
      actions: [
        { label: "Cancel", variant: "outline" },
        {
          label: "Continue",
          variant: "primary",
          onClick: function () {
            var w = null;
            try {
              w = window.open(url, "_blank", "noopener");
            } catch (err) {}
            if (!w) d.toast("The browser blocked the popup. Allow popups for NULL.", { type: "err" });
          },
        },
      ],
    });
  }

  N.launch = {
    game: function (entry) {
      go("game", entry);
    },
    app: function (entry) {
      go("app", entry);
    },
    proxy: function (entry) {
      N.recent.add("proxy", entry.id);
      openExternal(entry.url, entry.name, entry.status);
    },
    openExternal: openExternal,
    randomGame: function () {
      /* games only: a beta build labelled "app" must never turn up here */
      var g = N.catalog.games().filter(function (e) {
        return !e.labels || e.labels[0] !== "app";
      });
      if (!g.length) {
        d.toast("No games in the library yet.", { type: "err" });
        return;
      }
      go("game", g[Math.floor(Math.random() * g.length)]);
    },

      { n: 2, start: "8:35", end: "9:20" },
      { key: "win", start: "9:25", end: "10:10" },
      { n: 3, start: "10:15", end: "11:00" },

      { n: 7, start: "1:41", end: "2:23" },
      { n: 8, start: "2:28", end: "3:10"}

    reg: {
      label: "Regular schedule",
      short: "Regular",

      label: "Homeroom/WIN",
      short: "Homeroom/WIN",

        return;
      }
      if (e <= s) {
        errs.push(label + " ends at " + fmtHM(e) + ", which is not after " + fmtHM(s) + ".");

      if (s < prevEnd) {
        errs.push(label + " starts at " + fmtHM(s) + ", inside the period before it (ends " + fmtHM(prevEnd) + ").");

    if (Math.abs(a.length - b.length) > max) return max + 1;
    if (!a.length || !b.length) return Math.max(a.length, b.length);
    var prev = new Array(b.length + 1);
    var cur = new Array(b.length + 1);
    for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) {
      cur[0] = i;
      for (j = 1; j <= b.length; j++) {
        var cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      }
      var t = prev;
      prev = cur;
      cur = t;
    }
    var dist = prev[b.length];
    return dist > max ? max + 1 : dist;
  }

  /* best score for one token against one (pre-normalized) haystack string */
  function tokScore(tok, s) {
    if (!tok || !s) return 0;
    if (s === tok) return 120;
    if (s.indexOf(tok) === 0) return 108;
    var words = s.split(" ");
    var best = 0;
    for (var i = 0; i < words.length; i++) {
      var w = words[i];
      if (!w) continue;
      if (w === tok) return 100;
      if (w.indexOf(tok) === 0) {
        best = Math.max(best, 92);
        continue;
      }
      if (tok.length >= 3 && w.length >= tok.length) {
        var lim = tok.length >= 5 ? 2 : 1;
        if (editDist(tok, w, lim) <= lim) {
          best = Math.max(best, 70);
          continue;
        }
      }
    }
    if (best) return best;
    if (s.indexOf(tok) >= 0) return 62;
    if (tok.length >= 4 && editDist(tok, s, 2) <= 2) return 50;
    if (tok.length >= 6 && editDist(tok, s, 3) <= 3) return 42;
    return 0;
  }

  /* every token must land somewhere; scores add up.
     Fields are pre-normalized once per item (see buildIndex) so the
     hot path never re-regexes the big haystacks. */
  function scoreItem(it, toks) {
    var total = 0;
    for (var i = 0; i < toks.length; i++) {
      var best = tokScore(toks[i], it._t);
      var h = Math.floor(tokScore(toks[i], it._h) * 0.55);
      var b = Math.floor(tokScore(toks[i], it._x) * 0.45);
      if (h > best) best = h;
      if (b > best) best = b;
      if (!best) return 0;
      total += best;
    }
    return total;
  }

  /* ---------- page bodies: fetched once, cached, indexed lazily ---------- */
  var pageText = {}; // url -> text | null (null = failed)
  var live = null; // open overlay: { input, render, rebuild }

  function stripHtml(html) {
    return html
      .replace(/<script[\s\S]*?<\/script>/gi, " ")
      .replace(/<style[\s\S]*?<\/style>/gi, " ")
      .replace(/<[^>]+>/g, " ")
      .replace(/\s+/g, " ")
      .toLowerCase();
  }

  function fetchPageText(pg) {
    if (pageText[pg.url] !== undefined) return;
    pageText[pg.url] = null;
    /* the site path, so a page reads itself back from the folder NULL is
       actually served from */
    var src = N.url(pg.url);
    function got(html) {
      pageText[pg.url] = stripHtml(html);
      if (live) live.rebuild();
    }
    function miss() {
      /* clean urls: a static host only serves the .html file, and the
         library pages live at games/index.html, apps/index.html… */
      var base = src.replace(/\/+$/, "");
      var alts = [base + ".html", base + "/index.html"];
      var i = 0;
      (function tryAlt() {
        if (i >= alts.length) {
          pageText[pg.url] = null;
          return;
        }
        fetch(alts[i++])
          .then(function (r) {
            return r.ok ? r.text() : Promise.reject();
          })
          .then(got)
          .catch(tryAlt);
      })();
    }
    fetch(src)
      .then(function (r) {
        return r.ok ? r.text() : Promise.reject();
      })
      .then(got)
      .catch(miss);
  }

  /* ---------- index ---------- */
  function buildIndex() {
    var idx = [];
    N.catalog.games().forEach(function (g) {
      var raw = g.name + " " + g.desc + " " + (g.labels || []).join(" ") + " game play";
      idx.push({
        kind: "game",
        icon: "game",
        title: g.name,
        _t: norm(g.name),
        _h: norm(raw),
        _x: "",
        run: function () {

        },
        thumb: N.catalog.thumb("game", g),
      });
    });
    N.catalog.apps().forEach(function (a) {
      var raw = a.name + " " + a.desc + " " + (a.labels || []).join(" ") + " app tool";
      idx.push({
        kind: "app",
        icon: "grid",
        title: a.name,
        _t: norm(a.name),
        _h: norm(raw),
        _x: "",
        run: function () {
          N.launch.app(a);
        },
        thumb: N.catalog.thumb("app", a),
      });
    });
    N.catalog.proxies().forEach(function (p) {
      var raw = p.name + " " + p.desc + " " + p.url + " proxy link external";
      idx.push({
        kind: "proxy",
        icon: "proxy",
        title: p.name,
        _t: norm(p.name),
        _h: norm(raw),
        _x: "",
        run: function () {
          N.launch.proxy(p);
        },
        thumb: N.catalog.thumb("proxy", p),
      });
    });
    (C.pages || []).forEach(function (pg) {
      var raw = pg.title + " " + pg.desc + " " + pg.kw + " " + pg.grp;
      idx.push({
        kind: pg.kind || "page",
        icon: pg.icon || "list",
        title: pg.title,
        _t: norm(pg.title),
        _h: norm(raw),
        _x: norm(pageText[pg.url] || ""),
        run: function () {
          location.href = N.url(pg.url);
        },
      });
      /* the hidden pages skip body indexing: their text is the joke, and
         blob's wall of lines would match half the site's vocabulary */
      if (pg.body !== false) fetchPageText(pg);
    });
    (C.announcements || []).forEach(function (a) {
      var raw = a.title + " " + a.desc + " " + a.category + " announcement news";
      idx.push({
        kind: "announcement",
        icon: "ann",
        title: a.title,
        _t: norm(a.title),
        _h: norm(raw),
        _x: "",
        run: function () {
          location.href = N.url("/announcements");
        },
      });
    });
    return idx;
  }

  function search(q, idx) {
    var toks = norm(q)
      .split(/\s+/)
      .filter(Boolean);
    if (!toks.length) return [];
    var out = [];
    idx.forEach(function (it) {
      var score = scoreItem(it, toks);
      if (score) out.push({ it: it, score: score });
    });
    out.sort(function (a, b) {
      return b.score - a.score || a.it.title.length - b.it.title.length;
    });
    return out;
  }

  var GROUP = {
    game: "Games",
    app: "Apps",
    proxy: "Proxies",
    page: "Pages",
    egg: "Hidden",
    announcement: "Announcements",
  };

  function open(initial) {
    var idx = buildIndex();
    var sel = 0;
    var rows = [];
    if (N.ext) N.ext.emit("search:open", { index: idx.length });

    var input = d.h("input", {
      type: "text",
      placeholder: "Search games, apps, proxies, pages…",
      value: initial || "",
      "aria-label": "Search NULL",
      spellcheck: "false",
      autocomplete: "off",
    });
    var closeBtn = d.h("button", { type: "button", class: "kbd kbd-x", title: "Close", "aria-label": "Close search" }, "esc");
    var inputRow = d.h("div", { class: "search-input" }, [d.icon("search", "si"), input, closeBtn]);

    /* the shelf row: one chip per kind that actually turned up, with the
       count on it. Filtering is client-side on the hits we already have, so
       it is instant and never costs another pass over the index. */
    var filters = d.h("div", { class: "sp-filters" });
    var results = d.h("div", { class: "search-results", role: "listbox" });
    var count = d.h("span", { class: "sp-count" });
    var foot = d.h("div", { class: "sp-foot" }, [
      d.h("span", { class: "sp-hint" }, [d.h("span", { class: "kbd" }, "↑"), d.h("span", { class: "kbd" }, "↓"), "move"]),
      d.h("span", { class: "sp-hint" }, [d.h("span", { class: "kbd" }, "↵"), "open"]),
      d.h("span", { class: "sp-spark", "aria-hidden": "true" }, "•𐃷•"),
      count,
    ]);
    var panel = d.h("div", { class: "search-panel glass-2 elev" }, [inputRow, filters, results, foot]);
    var ov = d.h("div", { class: "search-ov" }, [panel]);
    /* null = everything. Set by the shelf row, cleared by a query change. */
    var kind = null;
    var lastQ = null;

    function clear() {
      rows.forEach(function (r) {
        r.el.classList.remove("sel");
      });
      rows = [];
      sel = 0;
    }

    function chip(label, k, n) {
      return d.h(
        "button",
        {
          type: "button",
          class: "chip chip-btn" + (kind === k ? " on" : ""),
          onclick: function () {
            kind = k;
            render(lastQ || "", true);
          },
        },
        [label, n == null ? null : d.h("span", { class: "ch-n" }, String(n))],
      );
    }

    function paintFilters(hits) {
      filters.textContent = "";
      var seen = {};
      var order = [];
      hits.forEach(function (h) {
        var k = h.it.kind;
        if (!seen[k]) {
          seen[k] = 0;
          order.push(k);
        }
        seen[k]++;
      });
      if (order.length < 2) {
        filters.hidden = true;
        return;
      }
      filters.hidden = false;
      filters.appendChild(chip("Everything", null, hits.length));
      order.forEach(function (k) {
        filters.appendChild(chip(GROUP[k] || k, k, seen[k]));
      });
      filters.appendChild(
        d.h("button", { type: "button", class: "chip chip-btn sp-clear", hidden: !kind, onclick: function () { kind = null; render(lastQ || "", true); } }, [
          d.icon("x"),
          "Clear",
        ]),
      );
    }

    function render(q, keepKind) {
      results.textContent = "";
      clear();
      if (!keepKind) kind = null;
      if (q !== lastQ) lastQ = q;
      var hits = search(q, idx);
      if (N.ext) N.ext.emit("search:query", { q: q, n: hits.length });
      paintFilters(hits);
      count.textContent = q
        ? (kind ? hits.filter(function (h) { return h.it.kind === kind; }).length : hits.length) +
          " for “" + q + "”"
        : idx.length + " things indexed";
      if (!q) {
        /* suggestions when empty */
        results.appendChild(d.h("div", { class: "sr-group" }, "Jump to"));
        [
          { t: "Home", u: N.url("/"), i: "home" },
          { t: "Games", u: N.url("/games/"), i: "game" },
          { t: "Apps", u: N.url("/apps/"), i: "grid" },
          { t: "Schedule", u: N.url("/schedule"), i: "sched" },
          { t: "Settings", u: N.url("/settings"), i: "settings" },
        ].forEach(function (s) {
          var it = {
            kind: "page",
            title: s.t,
            sub: s.u.replace(N.base, "/"),
            icon: s.i,
            run: function () {
              location.href = s.u;
            },
          };
          var el = rowEl(it);
          results.appendChild(el);
          rows.push({ el: el, _it: it });
        });
        return;
      }
      if (!hits.length) {
        results.appendChild(d.h("div", { class: "sr-none" }, [
          "Nothing matches “" + q + "”, but you got to see this funny guy: •𐃷•",
        ]));
        return;
      }
      var picked = kind
        ? hits.filter(function (h) {
            return h.it.kind === kind;
          })
        : hits;
      var byGroup = {};
      var order = [];
      picked.slice(0, 48).forEach(function (h) {
        var k = h.it.kind;
        if (!byGroup[k]) {
          byGroup[k] = [];
          order.push(k);
        }
        byGroup[k].push(h);
      });
      order.forEach(function (k) {
        var head = d.h("div", { class: "sr-group" }, [
          GROUP[k] || k,
          d.h("i", null, String(byGroup[k].length)),
        ]);
        results.appendChild(head);
        byGroup[k].slice(0, kind ? 24 : 6).forEach(function (h) {
          var el = rowEl(h.it);
          results.appendChild(el);
          rows.push({ el: el, _it: h.it });
        });
      });
    }

    function rowEl(it) {
      var ic;
      if (it.thumb) {
        var im = d.h("img", { src: it.thumb, alt: "" });
        d.bindImgFallback(im, it.kind === "proxy" ? "proxy" : it.kind);
        ic = d.h("div", { class: "sr-ic" }, [im]);
      } else {
        ic = d.h("div", { class: "sr-ic" }, [d.icon(it.icon || "list")]);
      }
      var el = d.h("button", {
        type: "button",
        class: "sr-row",
        role: "option",
        onclick: function () {
          finish(it);
        },
      }, [
        ic,
        d.h("span", { class: "sr-txt" }, [
          d.h("b", null, it.title),
          d.h("span", null, it.sub || ""),
        ]),
        d.h("span", { class: "chip" }, GROUP[it.kind] || it.kind),
      ]);
      el._it = it;
      return el;
    }

    function finish(it) {
      close();
      it.run();
    }

    function move(dir) {
      if (!rows.length) return;
      if (rows[sel]) rows[sel].el.classList.remove("sel");
      sel = (sel + dir + rows.length) % rows.length;
      rows[sel].el.classList.add("sel");
      rows[sel].el.scrollIntoView({ block: "nearest" });
    }

    function onKey(e) {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        move(1);
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        move(-1);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (rows[sel]) finish(rows[sel]._it);
      } else if (e.key === "Escape") {
        e.preventDefault();
        close();
      }
    }      input.addEventListener("keydown", onKey);
    input.addEventListener("input", d.debounce(function () {
      render(input.value);
    }, 70));

    function close() {
      if (live && live.ov === ov) live = null;
      ov.classList.remove("open");
      setTimeout(function () {
        ov.remove();
        document.body.style.overflow = "";
      }, 180);
    }
    ov.addEventListener("mousedown", function (e) {
      if (e.target === ov) close();
    });
    closeBtn.addEventListener("click", close);

    /* the active overlay: page-body fetches rebuild its index live */
    live = {
      ov: ov,
      input: input,
      render: render,
      rebuild: function () {
        if (!ov.isConnected) return;
        idx = buildIndex();
        render(input.value, true);
      },
    };

    document.body.appendChild(ov);
    requestAnimationFrame(function () {
      ov.classList.add("open");
      document.body.style.overflow = "hidden";
      input.focus();
    });
    render(initial || "");
  }

  N.search = { open: open };
})();
/* NULL: daily.js
   The daily loop on top of the economy: a once-a-day crate (a real modal
   with a spinning reel), three rotating daily quests and the permanent
   achievement list. Everything pays coins; nothing is bought or uploaded. */
(function () {
  var N = (window.N = window.N || {});
  var d = N.dom;

  function fmtTime(sec) {
    var m = Math.floor(sec / 60);
    if (m < 60) return m + "m";
    var h = Math.floor(m / 60);
    var rm = m % 60;
    return h + "h" + (rm ? " " + rm + "m" : "");
  }

  /* claimable first, then still-in-progress, then already paid out, so the
     next thing to do is always at the top of the list */
  function order(list) {
    function rank(x) {
      return x.claimed ? 2 : x.done ? 0 : 1;
    }
    return list.slice().sort(function (a, b) {
      return rank(a) - rank(b);
    });
  }

  /* ---------- shared progress row ----------
     Used by both the quests list and the achievements list: icon, name,
     hint, a bar, and either a Claim button, a "Claimed" chip or the prize. */
  function progRow(item, iconName, opts) {
    var pct = Math.max(4, Math.round((item.prog / item.goal) * 100));
    var side;
    if (item.claimed) {
      side = d.h("span", { class: "chip ok" }, [d.h("span", { class: "dot" }), "Claimed"]);
    } else if (item.done) {
      side = d.h(
        "button",
        {
          type: "button",
          class: "btn btn-primary btn-sm pg-claim",
          onclick: function () {
            var r = opts.claim(item.id);
            if (!r.ok) return;
            d.toast("+" + r.reward + " coins", { icon: "coin" });
            if (N.fx && N.fx.confetti) N.fx.confetti();
            if (opts.after) opts.after();
          },
        },
        ["Claim +" + item.reward],
      );
    } else {
      side = d.h("span", { class: "chip price-chip" }, [d.icon("coin"), String(item.reward)]);
    }

    return d.h(
      "div",
      { class: "pg-row" + (item.done && !item.claimed ? " ready" : "") + (item.claimed ? " done" : "") },
      [
        d.h("div", { class: "pg-ic" }, [d.icon(iconName)]),
        d.h("div", { class: "pg-main" }, [
          d.h("div", { class: "pg-top" }, [
            d.h("b", null, item.name),
            d.h("span", { class: "pg-meta" }, opts.label(item)),
          ]),
          d.h("div", { class: "pg-sub" }, item.hint),
          d.h(
            "div",

        d.h("div", { class: "pg-side" }, [side]),

  }

  /* ---------- quests ---------- */
  function questList(after) {

      box.appendChild(
        progRow(q, "zap", {

            return it.prog + " / " + it.goal;

  }

  }

  /* ---------- crate modal ---------- */
  function prizeTable() {

  function openCrate(after) {

    var note = d.h(
      "p",

        : "Streak: " + st.spinStreak + " day" + (st.spinStreak === 1 ? "" : "s") + " · back tomorrow",
    );

      "button",

    );

      d.h("p", { class: "crate-cap" }, "What's inside"),
      prizeTable(),
    ]);

    if (can) {
      btn.addEventListener("click", function () {
        var res = N.econ.spin();
        if (!res.ok) return;
        btn.disabled = true;
        btn.textContent = "Opening…";
        box.classList.add("rolling");
        reel.classList.add("rolling");

        /* tease a few values, then land on the real prize */
        var ticks = 0;
        var iv = setInterval(function () {
          ticks++;
          var p = N.econ.spinPool[Math.floor(Math.random() * N.econ.spinPool.length)];
          reel.textContent = p.type === "xp" ? p.amount + " XP" : String(p.amount);
          if (ticks < 14) return;
          clearInterval(iv);
          box.classList.remove("rolling");
          box.classList.add("open");
          reel.classList.remove("rolling");
          reel.classList.add("won");
          reel.textContent = res.type === "xp" ? res.amount + " XP" : res.amount + " coins";
          note.textContent =
            "Nice!" +
            (res.bonus ? " +" + res.bonus + " streak bonus" : "") +
            " · spend it in the Shop";
          btn.textContent = "See you tomorrow";
          d.toast("Crate: +" + res.amount + (res.type === "xp" ? " XP" : " coins"), { icon: "coin" });

          if (after) after();
        }, 80);
      });

      title: "Daily crate",
      icon: "gift",
      body: body,
      actions: [{ label: "Done", variant: "outline" }],

  /* ---------- home strip ----------

        mount: null,
      });
    });
    var ok = entry.js ? runCode(entry, entry.js) : true;
    var ctx = api(entry);
    if (N.fx) ctx.fx = N.fx;
    return ok;
  }

  function enabled() {
    return list().filter(function (e) {
      return e && e.enabled !== false;
    });
  }

  /* ---------- .nullext parsing ----------
     A .nullext is a JSON manifest with an optional css and js block. A file
     that is not JSON is taken as plain JavaScript, and the name comes from
     the file: the quickest possible way to write one is a single .js file
     dropped on the installer. */
  function parse(text, filename) {
    var name = String(filename || "extension").replace(/\.[^.]+$/, "");
    var obj = null;
    try {
      obj = JSON.parse(text);
    } catch (err) {
      obj = null;
    }
    if (obj && typeof obj === "object" && !Array.isArray(obj)) {
      if (obj.manifest_version || obj.action || obj.browser_action) return chromeManifest(obj, { "manifest.json": text }, filename);
      return {
        kind: "native",
        name: obj.name || name,
        version: String(obj.version || "1.0.0"),
        author: obj.author || "",
        desc: obj.desc || obj.description || "",
        icon: obj.icon || "code",
        run: obj.run === "manual" ? "manual" : "always",
        css: String(obj.css || ""),
        js: String(obj.js || obj.code || ""),
        /* HTML is first class here: a window this extension opens from the
           puzzle menu, and any number of views, declared in the manifest */
        html: String(obj.html || ""),
        pages: Array.isArray(obj.pages) ? obj.pages : [],
        nav: Array.isArray(obj.nav) ? obj.nav : [],
        manifest: obj,
      };
    }
    return {
      kind: "native",
      name: name,
      version: "1.0.0",
      author: "",
      desc: "A plain JavaScript extension: the whole file ran as its code.",
      icon: "code",
      run: "always",
      css: "",
      js: String(text),
      html: "",
      pages: [],
      nav: [],
      manifest: { nullExt: 1, js: true },
    };
  }

  /* ---------- chrome (popup only) ----------
     manifest.json plus whatever files came with it. All NULL keeps is the
     popup and its assets: this is a popup host, not a browser. */
  function chromeManifest(man, files, filename) {
    var popup = "";
    if (man.action && man.action.default_popup) popup = man.action.default_popup;
    if (man.browser_action && man.browser_action.default_popup) popup = man.browser_action.default_popup;
    if (!popup) {
      Object.keys(files).some(function (p) {
        if (/popup\.html?$/i.test(p)) {
          popup = p;
          return true;
        }
        return false;
      });
    }
    if (!popup) {
      /* a cheap trick real extensions use: an options page is close enough to
         a popup to be worth hosting, and it is better than a dead import */
      popup = man.options_ui && man.options_ui.page ? man.options_ui.page : "";
    }
    var name = (man.name || String(filename || "").replace(/\.[^.]+$/, "") || "Extension").replace(/^__MSG_|__$/g, "");
    return {
      kind: "chrome",
      name: name,
      version: String(man.version || "1.0.0"),
      author: man.author || "",
      desc: man.description || "Imported Chrome extension: popup only.",
      icon: "puzzle",
      run: "manual",
      popup: popup,
      files: files,
      manifest: man,
    };
  }

  /* every file the importer was handed, split into text and data: URIs */
  function fromFiles(fileList, done) {
    var files = {};
    var assets = {};
    var names = [];
    var pending = 0;
    var finished = false;

    function settle() {
      if (pending > 0 || finished) return;
      finished = true;
      var man = null;
      Object.keys(files).some(function (p) {
        if (/(^|\/)manifest\.json$/i.test(p)) {
          try {
            man = JSON.parse(files[p]);
          } catch (err) {}
          return !!man;
        }
        return false;
      });
      if (!man) {
        done(null, names.length ? "No manifest.json in what you picked. Pick the extension's folder (or its manifest plus popup files)." : "Nothing was read.");
        return;
      }
      var entry = chromeManifest(man, files, names[0]);
      entry.assets = assets;
      done(entry, null);
    }

    Array.prototype.forEach.call(fileList, function (f) {
      if (!f || !f.name) return;
      var rel = f.webkitRelativePath || f.name;
      names.push(rel);
      var isText = TEXT.test(f.name) || /\.json$/i.test(f.name);
      var reader = new FileReader();
      pending++;
      reader.onerror = function () {
        pending--;
        settle();
      };
      reader.onload = function () {
        pending--;
        if (isText) files[rel] = String(reader.result);
        else assets[rel] = String(reader.result);
        settle();
      };
      if (isText) reader.readAsText(f);
      else reader.readAsDataURL(f);
    });
    if (!pending) settle();
  }

  /* ---------- install / enable / remove ---------- */
  function install(entry) {
    if (list().length >= LIMIT && !get(entry.id)) {
      fail("install", "Extension limit reached (" + LIMIT + ")");
      return null;
    }
    entry.id = entry.id || idFor(entry.name);
    entry.enabled = entry.enabled !== false;
    entry.at = entry.at || Date.now();
    var keep = get(entry.id);
    if (keep && keep.kind === "chrome" && entry.kind === "chrome") {
      entry.files = Object.assign({}, keep.files, entry.files);
      entry.assets = Object.assign({}, keep.assets, entry.assets);
    }
    put(entry);
    if (entry.enabled) activate(entry);
    return entry;
  }
  function enable(id) {
    var e = get(id);
    if (!e) return null;
    e.enabled = true;
    put(e);
    activate(e);
    return e;
  }
  function disable(id) {
    var e = get(id);
    if (!e) return null;
    e.enabled = false;
    dropStyle(id);
    dropWidgets(id);
    pages = pages.filter(function (p) {
      return p.ext !== id;
    });
    put(e);
    return e;
  }
  function remove(id) {
    disable(id);
    write(
      list().filter(function (e) {
        return e.id !== id;
      }),
    );
    N.store.del(DATA + id);
    pages = pages.filter(function (p) {
      return p.ext !== id;
    });
    off("*", null);
    if (openId === id) closePopup();
    return true;
  }
  function clear() {
    list().forEach(function (e) {
      dropStyle(e.id);
      dropWidgets(e.id);
    });
    pages = [];
    N.store.del(KEY);
    write([]);
  }

  /* ---------- chrome popup host ----------
     The popup gets its own frame with an opaque origin (sandbox, no
     allow-same-origin), which is what keeps a Chrome extension from reaching
     NULL. Its local css/js are inlined so a data: origin can load them, and
     a chrome.* shim is injected ahead of its own scripts. */
  var panel = null;
  var openId = null;

  var SHIM = [
    "(function(){",
    "  var id = %ID%, man = %MAN%, seq = 0, waits = {}, listening = [];",
    "  function call(cmd, payload){",
    "    return new Promise(function(res){",
    "      var rid = ++seq;",
    "      waits[rid] = res;",
    "      parent.postMessage({ nullChrome: 1, id: id, cmd: cmd, payload: payload || null, rid: rid }, '*');",
    "    });",
    "  }",
    "  window.addEventListener('message', function(ev){",
    "    var m = ev.data;",
    "    if (!m || !m.nullChromeReply) return;",
    "    if (m.cmd === 'runtime.message' && m.rid === 0){ listening.forEach(function(fn){ try { fn(m.payload, { id: m.from || null }, function(){}); } catch (e) {} }); return; }",
    "    var w = waits[m.rid];",
    "    delete waits[m.rid];",
    "    if (w) w(m.value);",
    "  });",
    "  function keysOf(o){ var out = []; Object.keys(o || {}).forEach(function(k){ out.push(k); }); return out; }",
    "  var area = {",
    "    get: function(k, cb){ return call('storage.get', k).then(function(v){ if (cb) cb(v); return v; }); },",
    "    set: function(o, cb){ return call('storage.set', o).then(function(){ if (cb) cb(); }); },",
    "    remove: function(k, cb){ return call('storage.remove', k).then(function(){ if (cb) cb(); }); },",
    "    clear: function(cb){ return call('storage.clear').then(function(){ if (cb) cb(); }); },",
    "  };",
    "  var chrome = window.chrome = window.chrome || {};",
    "  chrome.runtime = chrome.runtime || {};",
    "  chrome.runtime.id = id;",
    "  chrome.runtime.getManifest = function(){ return man; };",
    "  chrome.runtime.getURL = function(p){ return String(p || ''); };",
    "  chrome.runtime.lastError = null;",
    "  chrome.runtime.onMessage = { addListener: function(fn){ listening.push(fn); } };",
    "  chrome.runtime.sendMessage = function(msg, cb){ var p = call('runtime.sendMessage', msg); if (cb) p.then(cb); return p; };",
    "  chrome.storage = { local: area, sync: area, managed: area, onChanged: { addListener: function(){}, removeListener: function(){} } };",

    "     throwing where a popup cannot see why */",
    "  chrome.tabs = { query: function(q, cb){ if (cb) cb([]); return Promise.resolve([]); } };",

    "  window.browser = window.browser || chrome;",
    "})();",

    var assets = entry.assets || {};

    if (html == null) {
      Object.keys(files).some(function (p) {
        if (/popup\.html?$/i.test(p)) {
          html = files[p];
          path = p;
          return true;
        }
        return false;
      });
    }
    if (html == null) {
      html =
        "<body style=\"font:14px/1.6 system-ui;padding:18px;color:#ddd;background:#101012\">" +
        "<p><b>" + esc(entry.name) + "</b> has no popup page NULL can find.</p>" +
        "<p style=\"opacity:.7\">Pick the folder again and make sure its manifest points at a popup, or add a popup.html next to it.</p></body>";
    }

    var dir = path.indexOf("/") > 0 ? path.slice(0, path.lastIndexOf("/") + 1) : "";

      if (!ref || /^[a-z]+:|^\/\//i.test(ref)) return null;
      var clean = ref.replace(/^\.\//, "");
      var hit = files[dir + clean] || assets[dir + clean] || files[clean] || assets[clean];

      .replace(/<link[^>]+href=["']([^"']+)["'][^>]*>/gi, function (whole, href) {
        var f = look(href);
        if (!f || !f.text) return whole;
        return "<style>" + f.value + "</style>";
      })
      .replace(/<script[^>]+src=["']([^"']+)["'][^>]*><\/script>/gi, function (whole, src) {
        var f = look(src);
        if (!f || !f.text) return whole;
        /* the closing tag is split so this file can itself be inlined into a
           <script> block (the check scripts do exactly that, and a literal
           end tag here would end the block early) */
        return "<script>" + f.value + "<\/script>";
      })
      .replace(/(src|href)=["']([^"']+)["']/gi, function (whole, attr, ref) {
        var f = look(ref);
        if (!f) return whole;
        return attr + '="' + (f.text ? "data:text/plain;charset=utf-8," + encodeURIComponent(f.value) : f.value) + '"';
      });

    var shim = SHIM.replace("%ID%", JSON.stringify(entry.id)).replace("%MAN%", JSON.stringify(entry.manifest || {}));
    html = html.replace(/<head([^>]*)>/i, "<head$1><script>" + shim + "<\/script>");
    if (!/<head/i.test(html)) html = "<head><script>" + shim + "<\/script></head>" + html;
    return html;
  }

  function esc(t) {
    return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function closePopup() {
    if (panel) panel.remove();
    panel = null;
    openId = null;
  }

  /* under the puzzle button when there is one, which is where a browser puts
     a popup; otherwise pinned to the top right. */
  function placePanel() {
    var anchor = document.querySelector('[data-ic="extensions"]');
    var r = anchor ? anchor.getBoundingClientRect() : null;
    var w = Math.min(380, window.innerWidth - 20);
    panel.style.width = w + "px";
    var left = r ? Math.min(Math.max(10, r.right - w), window.innerWidth - w - 10) : window.innerWidth - w - 16;
    var top = r ? r.bottom + 8 : 16;
    panel.style.left = left + "px";
    panel.style.top = Math.min(top, Math.max(16, window.innerHeight - 120)) + "px";
  }

  /* a native extension's own window: the same panel a Chrome popup gets, but
     no iframe, because a .nullext already runs in the page. Whatever it put
     in "html" is mounted here, then popup:open fires with the element so its
     own code can wire it up. */

    var e = get(id);

    openId = id;
    var box = d.h("div", { class: "ext-html" });
    box.innerHTML = e.html;
    panel = d.h("div", { class: "ext-pop glass", role: "dialog", "aria-label": e.name + " window" }, [
      d.h("div", { class: "ep-head" }, [
        d.h("span", { class: "ep-ic" }, [d.icon(e.icon || "puzzle")]),
        d.h("div", { class: "ep-txt" }, [d.h("b", null, e.name), d.h("span", null, "native · v" + e.version)]),
        d.h("button", { type: "button", class: "ep-x", title: "Close", "aria-label": "Close window", onclick: closePopup }, [d.icon("x")]),
      ]),
      box,
      d.h("div", { class: "ep-foot" }, "Runs inside NULL with full power, exactly like the extension itself."),
    ]);
    document.body.appendChild(panel);
    placePanel();
    emit("popup:open", { id: id, el: box });
    return panel;
  }

  function openPopup(id) {
    var e = get(id);
    if (!e) return null;
    closePopup();
    openId = id;

    var frame = d.h("iframe", {
      class: "ext-frame",
      sandbox: "allow-scripts allow-forms allow-modals allow-popups",
      title: e.name + " popup",
    });
    frame.setAttribute("srcdoc", popupDoc(e));

    panel = d.h("div", { class: "ext-pop glass", role: "dialog", "aria-label": e.name + " popup" }, [
      d.h("div", { class: "ep-head" }, [
        d.h("span", { class: "ep-ic" }, [d.icon("puzzle")]),
        d.h("div", { class: "ep-txt" }, [d.h("b", null, e.name), d.h("span", null, "popup only · v" + e.version)]),
        d.h("button", { type: "button", class: "ep-x", title: "Close", "aria-label": "Close popup", onclick: closePopup }, [d.icon("x")]),
      ]),
      frame,
      d.h("div", { class: "ep-foot" }, "Runs sandboxed: it can show UI and keep its own storage, nothing else."),
    ]);
    document.body.appendChild(panel);
    placePanel();
    return panel;
  }

  /* the bridge the sandboxed popups talk to */
  window.addEventListener("message", function (ev) {
    var m = ev.data;
    if (!m || m.nullChrome !== 1) return;
    var id = m.id;
    var reply = function (value) {
      try {
        ev.source.postMessage({ nullChromeReply: true, rid: m.rid, value: value, cmd: m.cmd }, "*");
      } catch (err) {}
    };
    var b = bag(id);
    var p = m.payload;
    if (m.cmd === "storage.get") {
      if (p == null) return reply(Object.assign({}, b));
      if (typeof p === "string") return reply(b[p] === undefined ? {} : { [p]: b[p] });
      if (Array.isArray(p)) {
        var pick = {};
        p.forEach(function (k) {
          if (b[k] !== undefined) pick[k] = b[k];
        });
        return reply(pick);
      }
      var defaults = Object.assign({}, p);
      Object.keys(defaults).forEach(function (k) {
        if (b[k] !== undefined) defaults[k] = b[k];
      });
      return reply(defaults);
    }
    if (m.cmd === "storage.set") {
      Object.assign(b, p || {});
      bagWrite(id, b);
      return reply(true);
    }
    if (m.cmd === "storage.remove") {
      (Array.isArray(p) ? p : [p]).forEach(function (k) {
        delete b[k];
      });
      bagWrite(id, b);
      return reply(true);
    }
    if (m.cmd === "storage.clear") {
      bagWrite(id, {});
      return reply(true);
    }
    if (m.cmd === "runtime.sendMessage") {
      /* delivered to whatever other popup is open in this tab. There is no
         background page to catch it, which is the honest limit of a popup
         extension here. */
      if (panel) {
        var frame = panel.querySelector("iframe");
        if (frame && frame.contentWindow) {
          try {
            frame.contentWindow.postMessage({ nullChromeReply: true, cmd: "runtime.message", rid: 0, from: id, payload: p }, "*");
          } catch (err) {}
        }
      }
      return reply(undefined);
    }
    reply(undefined);
  });

  /* ---------- boot ---------- */
  var booted = false;
  function boot() {
    if (booted) return;
    booted = true;
    enabled().forEach(function (e) {
      if (e.kind !== "native") return;
      activate(e);
    });
    emit("boot", { page: (document.body && document.body.dataset.page) || "" });
    /* the shell builds the nav before this runs, so it gets told to repaint */
    if (N.bus && N.bus.emit) N.bus.emit("ext");
  }

  /* ---------- the nav menu ----------
     shell.js builds the puzzle button and asks for its contents here, so the
     menu and the manager can never disagree about what is installed. */
  function menu(host, close) {
    host.textContent = "";
    var all = list();
    if (!all.length) {
      host.appendChild(
        d.h("p", { class: "em-none" }, "No extensions installed yet. A .nullext gets full power; an imported Chrome popup only gets its own little window."),
      );
    }
    all.forEach(function (e) {
      var row = d.h("button", {
        type: "button",
        class: "em-row" + (e.enabled === false ? " off" : ""),
        onclick: function () {
          if (close) close();
          /* a popup is a popup: a Chrome import gets its sandboxed frame, a
             .nullext that shipped HTML gets the same panel without one */
          if (e.kind === "chrome") {
            openPopup(e.id);
            return;
          }
          if (e.html) {
            openHtml(e.id);
            return;
          }
          location.href = N.url("/extensions") + "#" + encodeURIComponent(e.id);
        },
      }, [
        d.h("span", { class: "em-ic" }, [d.icon(e.icon || (e.kind === "chrome" ? "puzzle" : "code"))]),
        d.h("span", { class: "em-txt" }, [
          d.h("b", null, e.name),
          d.h(
            "span",
            null,
            (e.kind === "chrome" ? "popup" : e.html ? "window" : "native") + " · " + (e.enabled === false ? "off" : "on"),
          ),
        ]),
      ]);
      host.appendChild(row);
    });
    host.appendChild(
      d.h("a", { class: "em-all", href: N.url("/extensions") }, [d.icon("puzzle"), "Manage extensions"]),
    );
    /* extension-added nav items ride in the same menu */
    var extra = list().filter(function (e) {
      return e.enabled !== false && e.nav;
    });
    extra.forEach(function (e) {
      (e.nav || []).forEach(function (item) {
        host.appendChild(
          d.h("a", { class: "em-all", href: N.url(item.url || "/extensions") }, [d.icon(item.icon || "code"), item.title || e.name]),
        );
      });
    });
    return host;
  }

  /* Every event core code emits, with what it carries. The manager prints
     this list, so adding a hook in the site means adding a line here. */
  var EVENTS = [
    "boot        once per page load, after the page's own script",
    "coins:earn  { n, total } whenever coins land in the balance",
    "coins:spend { n, total } whenever something is bought",
    "xp:gain     { n, level, xp }",
    "unlock      { type, id } when an item becomes owned",
    "quest:done  { id, coins }",
    "crate:open  { coins, streak }",
    "player:open { entry } a game or app launching in the player",
    "player:close { entry }",
    "search:open open the search overlay",
    "search:query { q, n } every keystroke it uses",
    "popup:open  { id, el } a .nullext's own window opening",
    "egg:pop     { text } when a hidden page talks back",
    "theme:apply { kind, id } a pack or particle set going on",
    "tour:done   { skipped } the first-run tour ending",
  ];

  /* ---------- what /root and the manager describe ---------- */
  function summary() {
    var all = list();
    return {
      total: all.length,
      native: all.filter(function (e) {
        return e.kind === "native";
      }).length,
      chrome: all.filter(function (e) {
        return e.kind === "chrome";
      }).length,
      enabled: all.filter(function (e) {
        return e.enabled !== false;
      }).length,
      pages: pages.length,
      hooks: hookNames(),
      ids: all.map(function (e) {
        return e.id;
      }),
    };
  }

  N.ext = {
    KEY: KEY,
    EVENTS: EVENTS,
    list: list,
    get: get,
    install: install,
    enable: enable,
    disable: disable,
    remove: remove,
    clear: clear,
    parse: parse,
    fromFiles: fromFiles,
    installable: LIMIT,
    boot: boot,
    emit: emit,
    on: on,
    off: off,
    hooks: () => hooks,
    hookNames: hookNames,
    api: api,
    pages: pageList,
    menu: menu,
    slot: slot,
    openPopup: openPopup,
    openHtml: openHtml,
    closePopup: closePopup,

    data: bag,
    dataWrite: bagWrite,

    });

  }

(function () {

  function logoMark() {
    return d.h("span", { class: "brand-mark", "aria-hidden": "true" }, [
      d.icon("ban"),
    ]);
  }

  function brandEl() {
    var el = d.h("a", { class: "brand", href: N.url("/"), "aria-label": "NULL home" }, [
      logoMark(),
      d.h("span", { class: "brand-name" }, "NULL"),
    ]);

     once per visit to the whole logo, so moving between the mark and the
     wordmark looked dead. Entering either half replays it instead. */
  function bindBrand(el) {
    var ic = el.querySelector(".brand-mark .msr");
    if (!ic) return;

    });

    });
    if (N.bus && N.bus.on) N.bus.on("ext", paint);
