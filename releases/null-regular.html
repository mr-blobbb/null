.toolbar {
  position: relative;
}
.toolbar #btnMarathonWrap:has(+ #marathonBox:not([hidden])) .btn {
  border-color: var(--line-2);
  color: var(--text);
}
#btnMarathon.on {
  border-color: color-mix(in srgb, var(--ac-1) 45%, var(--line));
  color: var(--text);
}

/* reset chip at the end of the label row: appears only when a filter or
   search is active (library.js unhides it) */
.filter-row .btn {
  flex: none;
  height: 30px;
  border-radius: 999px;
}

/* label + count inside one chip, so the same nodes read as a chip in the
   toolbar and as a list row in the rail */
.chip-btn {
  gap: 8px;
}
.chip-btn .ch-n {
  font-size: 10.5px;
  font-variant-numeric: tabular-nums;
  opacity: 0.7;
}

/* ============================================================
   library layout: label rail + toolbar that pins under the nav
   library.js sets html[data-lib-mode]: "rail" on ultrawide screens (or
   whenever Settings asks for the sidebar), "bar" for the chip row.
   ============================================================ */
.lib-cols {
  display: block;
}
html[data-lib-mode="rail"] .lib-cols {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  gap: 28px;
  align-items: start;
  /* the library body can breathe wider than the normal page measure when
     there is a whole sidebar next to it */
  max-width: min(1720px, 100%);
}
.lib-rail {
  display: none;
}
html[data-lib-mode="rail"] .lib-rail {
  display: block;
}
.lib-rail-in {
  position: sticky;
  top: calc(var(--nh) + 78px);
  max-height: calc(100dvh - var(--nh) - 100px);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 14px 12px;
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  background: var(--glass-bg);
  scrollbar-width: thin;
}
.lib-rail-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 4px 12px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.lib-rail-ic {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: var(--glass-bg-3);
  color: var(--text);
  flex: none;
}
.lib-rail-ic .msr {
  font-size: 17px;
}
.lib-rail-txt {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.lib-rail-txt b {
  font-size: 13.5px;
}
.lib-rail-txt span {
  font-size: 11.5px;
  color: var(--text-2);
}
/* the chip row turns into a stack of full-width rows */
.lib-rail .filter-row {
  flex-direction: column;
  align-items: stretch;
  gap: 3px;
  overflow: visible;
  padding: 0;
}
.lib-rail .filter-row .chip-btn {
  width: 100%;
  height: 32px;
  border-color: transparent;
  background: transparent;
  border-radius: 9px;
  justify-content: space-between;
  font-size: 13.5px;
}
.lib-rail .filter-row .chip-btn:hover {
  border-color: transparent;
  background: var(--glass-bg-2);
}
.lib-rail .filter-row .chip-btn.on {
  color: var(--text);
  background: var(--glass-bg-3);
  border-color: transparent;
  box-shadow: inset 2px 0 0 var(--ac-1);
}
.lib-rail .filter-row .btn {
  width: 100%;
  justify-content: center;
  margin-top: 6px;
}

/* sticky toolbar: .stuck is toggled by library.js the moment the bar
   scrolls past the nav, which is when it needs a backdrop */
.stick-sent {
  height: 1px;
  margin-top: -1px;
}
body.lb .toolbar {
  position: sticky;
  top: var(--nh);
  z-index: 30;
  border-radius: 0 0 var(--r-md) var(--r-md);
  transition: background 0.2s, box-shadow 0.2s, padding 0.2s;
}
body.lb .toolbar.stuck {
  /* pinned flush under the nav and full-bleed: the bar stretches across the
     whole viewport so it reads as part of the topbar, not a floating strip.
     The -22px eats the page's own padding; on the small-screen 14px padding
     the media query below trims it back. Padding still adds up to the
     un-stuck margins (22 / 18), so nothing below shifts. */
  padding: 14px max(14px, var(--pad-x)) 12px;
  margin: 0 calc(-1 * var(--pad-x)) 6px;
  width: calc(100% + 2 * var(--pad-x));
  /* the page's own max-width would otherwise cap the bar to the content
     column, which is what made it read as a floating strip */
  max-width: none;
  border-radius: 0;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(16px) saturate(140%);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 14px 28px -22px rgba(0, 0, 0, 0.95), 0 1px 0 var(--line);
}
@media (max-width: 620px) {
  body.lb .toolbar.stuck {
    margin-left: -14px;
    margin-right: -14px;
    width: calc(100% + 28px);
  }
}
html[data-perf] body.lb .toolbar.stuck {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  background: var(--bg);
}

/* ============================================================
   side rail navigation
   The top bar turns into a left rail on a wide screen: icons only, sliding
   open on hover to show names. The page keeps its full height and the nav
   stops sitting on top of every page's first line.

   Everything here hangs off html:not([data-nav="bar"]) inside one width
   query, so the bar layout is still the whole story on a narrow screen and
   the Settings switch (which writes data-nav="bar") undoes all of it. --nh
   goes to zero with the rail: every offset on the site is written against
   it, so the rail only has to move that one number and the pages follow.
   ============================================================ */
/* the top bar is icons only: the names the rail shows are in the markup but
   off the page there */
.nav-link .nl-txt {
  display: none;
}

/* the strip extensions mount into with ctx.mount('nav', html): a row in the
   top bar, a column in the rail (see the media query below) */
.nav-slot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 4px;
  min-width: 0;
}
.nav-slot:empty {
  display: none;
}
.ext-widget {
  display: flex;
  align-items: center;
  min-width: 0;
}
/* the body of a .nullext's own window (ext.js's openHtml) */
.ext-html {
  padding: 14px 16px 16px;
  font-size: 13.5px;
  line-height: 1.6;
  color: var(--text);
  max-height: min(420px, 60dvh);
  overflow: auto;
}
.ext-html b {
  display: block;
  font-size: 15px;
  margin-bottom: 6px;
}
.ext-html p {
  margin: 0 0 6px;
}

@media (min-width: 1100px) {
  html:not([data-nav="bar"]) {
    --nh: 0px;
    --rail-w: 68px;
    --rail-w-open: 220px;
  }
  html:not([data-nav="bar"]) .nav-link .nl-txt {
    display: inline;
  }
  /* the puzzle menu is absolute, and the rail clips its own overflow, so in
     the rail it flies out beside it instead of hanging below the button */
  html:not([data-nav="bar"]) .ext-nav.open .ext-menu {
    position: fixed;
    left: var(--rail-w);
    right: auto;
    top: max(96px, 16dvh);
    transform-origin: top left;
  }
  html:not([data-nav="bar"]) body {
    padding-left: var(--rail-w);
  }
  html:not([data-nav="bar"]) .topbar {
    inset: 0 auto 0 0;
    width: var(--rail-w);
    height: 100dvh;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 14px 12px 16px;
    border-bottom: 0;
    border-right: 1px solid color-mix(in srgb, var(--ac-1) 12%, var(--line));
    overflow: hidden auto;
    scrollbar-width: none;
    z-index: 95;
    transition: width 0.24s var(--ease), box-shadow 0.24s var(--ease);
  }
  html:not([data-nav="bar"]) .topbar:hover,
  html:not([data-nav="bar"]) .topbar:focus-within {
    width: var(--rail-w-open);
    box-shadow: 26px 0 70px -34px rgba(0, 0, 0, 0.95);
  }
  /* the labels are always in the markup; collapsed they are only invisible
     and clipped by the rail's own overflow, so opening it is one opacity
     fade with nothing to re-lay-out */
  html:not([data-nav="bar"]) .brand-name,
  html:not([data-nav="bar"]) .nav-link .nl-txt,
  html:not([data-nav="bar"]) .searchbox .sb-txt {
    opacity: 0;
    transition: opacity 0.16s;
  }
  html:not([data-nav="bar"]) .topbar:hover .brand-name,
  html:not([data-nav="bar"]) .topbar:hover .nav-link .nl-txt,
  html:not([data-nav="bar"]) .topbar:hover .searchbox .sb-txt,
  html:not([data-nav="bar"]) .topbar:focus-within .brand-name,
  html:not([data-nav="bar"]) .topbar:focus-within .nav-link .nl-txt,
  html:not([data-nav="bar"]) .topbar:focus-within .searchbox .sb-txt {
    opacity: 1;
  }
  html:not([data-nav="bar"]) .brand {
    padding: 4px 3px 12px;
  }
  html:not([data-nav="bar"]) .nav-links {
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
    margin: 0;
  }
  html:not([data-nav="bar"]) .nav-links .nav-link {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    justify-content: flex-start;
    gap: 12px;
    border-radius: 11px;
    white-space: nowrap;
  }
  html:not([data-nav="bar"]) .nav-link .nl-txt {
    font-size: 13.5px;
    font-weight: 600;
  }
  /* the active marker follows the rail: a bar down the left edge instead of
     a line under the icon */
  html:not([data-nav="bar"]) .nav-link.on {
    background: var(--glass-bg-2);
    box-shadow: inset 2px 0 0 var(--ac-1);
  }
  html:not([data-nav="bar"]) .searchbox {
    width: 100%;
    height: 40px;
    padding: 0 12px;
    justify-content: flex-start;
    gap: 12px;
    flex: none;
  }
  html:not([data-nav="bar"]) .top-actions {
    margin-top: auto;
    flex-direction: column;
    align-items: stretch;
    gap: 6px;
  }
  html:not([data-nav="bar"]) .top-actions .btn-icon {
    width: 100%;
    height: 40px;
    border-radius: 11px;
  }
  /* extension chrome: a rail column, whatever HTML the extension mounted */
  html:not([data-nav="bar"]) [data-slot="nav"] {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    margin-top: 6px;
  }
  html:not([data-nav="bar"]) [data-slot="nav"] > * {
    overflow: hidden;
  }
  /* the reading progress line hangs off the top of the page, which is now
     the top of the content column, not of the window */
  html:not([data-nav="bar"]) .read-bar {
    left: var(--rail-w);
  }
  html:not([data-nav="bar"]) .skip-link {
    left: calc(var(--rail-w) + 12px);
  }
}

/* ============================================================
   schedule editor rows
   Number, name, two times and a remove button. Written with the parent in
   the selector so it outranks the shared .sched-row at any width.
   ============================================================ */
.sched-editor .ed-times-row {
  grid-template-columns: 34px minmax(0, 1fr) minmax(170px, auto) 32px;
  align-items: center;
}
.sched-editor .ed-times {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: none;
}
.sched-editor .ed-times i {
  font-style: normal;
  font-size: 11.5px;
  color: var(--text-2);
}
.sched-editor .ed-time {
  width: 74px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.ed-x {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--glass-bg-2);
  color: var(--text-2);
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s, background 0.15s;
}
.ed-x:hover {
  color: var(--bad);
  border-color: color-mix(in srgb, var(--bad) 45%, var(--line));
  background: color-mix(in srgb, var(--bad) 10%, var(--glass-bg-2));
}
.ed-x .msr {
  font-size: 15px;
}
.ed-add {
  margin-top: 4px;
}
.ed-hint {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
  margin: 8px 0 2px;
}
.ed-errs {
  margin: 10px 0 4px;
  padding: 10px 12px;
  border-radius: var(--r-sm);
  border: 1px solid color-mix(in srgb, var(--bad) 42%, var(--line));
  background: color-mix(in srgb, var(--bad) 10%, transparent);
}
.ed-errs p {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text);
  margin: 0 0 5px;
}
.ed-errs p:last-child {
  margin-bottom: 0;
}
.ed-errs .msr {
  font-size: 15px;
  color: var(--bad);
  flex: none;
  margin-top: 1px;
}
@media (max-width: 760px) {
  .sched-editor .ed-times-row {
    grid-template-columns: 30px minmax(0, 1fr) 30px;
    row-gap: 6px;
  }
  .sched-editor .ed-times-row .s-no {
    grid-row: 1 / 3;
  }
  .sched-editor .ed-times-row .s-name,
  .sched-editor .ed-times-row .ed-input,
  .sched-editor .ed-times-row .ed-times {
    grid-column: 2;
  }
  .sched-editor .ed-times-row .ed-x {
    grid-column: 3;
    grid-row: 1;
  }
}

/* ============================================================
   search, rebuilt
   The overlay is a palette now rather than a list in a box: a big field, a
   shelf of kind chips with counts, grouped results that answer the pointer,
   and a footer that says what the keyboard does. These rules override the
   block in global.css (this file loads after it), so the old shapes are
   still there for anything that predates the parts below.
   ============================================================ */
.search-ov {
  padding: calc(var(--nh) + 46px) 16px 40px;
  background: var(--overlay);
}
/* a soft wash behind the panel, so it reads as lit rather than pasted on */
.search-ov::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 40% at 50% 0%, color-mix(in srgb, var(--ac-1) 16%, transparent), transparent 70%),
    radial-gradient(40% 30% at 50% 100%, color-mix(in srgb, var(--ac-1) 8%, transparent), transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
}
.search-ov.open::before {
  opacity: 1;
}
.search-panel {
  width: min(760px, 100%);
  max-height: calc(100dvh - var(--nh) - 96px);
  position: relative;
  border-radius: 22px;
  border: 1px solid color-mix(in srgb, var(--ac-1) 22%, var(--line-2));
  box-shadow:
    0 40px 90px -40px rgba(0, 0, 0, 0.95),
    0 0 0 1px rgba(255, 255, 255, 0.03) inset;
  transform: translateY(-10px) scale(0.985);
  opacity: 0;
  transition: transform 0.22s var(--ease), opacity 0.22s var(--ease);
}
.search-ov.open .search-panel {
  transform: none;
  opacity: 1;
}
/* the lit edge across the top, in the site's own accent */
.search-panel::before {
  content: "";
  position: absolute;
  top: 0;
  left: 14%;
  right: 14%;
  height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--ac-1) 80%, transparent), transparent);
  pointer-events: none;
}

.search-input {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 17px 20px;
  border-bottom: 1px solid var(--line);
}
.search-input .si {
  width: 34px;
  height: 34px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  flex: none;
  font-size: 19px;
  color: var(--ac-1);
  border: 1px solid color-mix(in srgb, var(--ac-1) 24%, var(--line));
  background: color-mix(in srgb, var(--ac-1) 11%, var(--glass-bg-2));
}
.search-input input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 17.5px;
  font-weight: 520;
  letter-spacing: -0.01em;
  color: var(--text);
}
.search-input input::placeholder {
  color: var(--text-2);
}
.kbd {
  font-size: 10.5px;
  font-weight: 650;
  color: var(--text-2);
  border: 1px solid var(--line-2);
  border-radius: 7px;
  padding: 2px 7px;
  flex: none;
  line-height: 1.5;
}
.search-input .kbd-x {
  cursor: pointer;
  background: transparent;
  transition: color 0.15s, border-color 0.15s;
}
.search-input .kbd-x:hover {
  color: var(--text);
  border-color: var(--ac-1);
}

/* the shelf row */
.sp-filters {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 11px 16px;
  border-bottom: 1px solid var(--line);
}
.sp-filters[hidden] {
  display: none;
}
.sp-filters .chip-btn {
  height: 28px;
  font-size: 12px;
}
.sp-filters .sp-clear {
  margin-left: auto;
  color: var(--text-2);
}

.search-results {
  overflow-y: auto;
  padding: 8px 10px 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--thumb) transparent;
}
.sr-group {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10.5px;
  font-weight: 750;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-2);
  padding: 12px 12px 6px;
  background: linear-gradient(180deg, var(--glass-bg-2) 70%, transparent);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.sr-group i {
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--text-2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 1px 7px;
  opacity: 0.8;
}
.sr-row {
  position: relative;
  gap: 13px;
  padding: 10px 12px;
  border-radius: 13px;
  border: 1px solid transparent;
  transition: background 0.14s, border-color 0.14s, transform 0.14s;
}
.sr-row:hover {
  background: var(--glass-bg-2);
  transform: translateX(2px);
}
.sr-row.sel {
  background: color-mix(in srgb, var(--ac-1) 12%, var(--glass-bg-2));
  border-color: color-mix(in srgb, var(--ac-1) 34%, var(--line));
  transform: translateX(2px);
}
/* the little marker down the left of the row the keyboard is on */
.sr-row.sel::before {
  content: "";
  position: absolute;
  left: 3px;
  top: 50%;
  width: 3px;
  height: 18px;
  margin-top: -9px;
  border-radius: 99px;
  background: var(--ac-1);
}
.sr-row .sr-ic {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  color: var(--ac-1);
}
.sr-row .sr-txt b {
  font-size: 14.5px;
  letter-spacing: -0.01em;
}
.sr-row .chip {
  font-size: 10.5px;
  letter-spacing: 0.04em;
  opacity: 0.75;
}
.sr-row.sel .chip {
  opacity: 1;
}
.sr-none {
  padding: 20px 16px 26px;
  text-align: center;
  color: var(--text-2);
  font-size: 13.5px;
  line-height: 1.6;
}

/* footer: what the keyboard does, and what the query found */
.sp-foot {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  font-size: 11.5px;
  color: var(--text-2);
  flex-wrap: wrap;
}
.sp-hint {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.sp-spark {
  opacity: 0.4;
}
.sp-count {
  margin-left: auto;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 620px) {
  .search-ov {
    padding: calc(var(--nh) + 12px) 10px 20px;
  }
  .search-panel {
    border-radius: 18px;
    max-height: calc(100dvh - var(--nh) - 40px);
  }
  .sp-foot .sp-hint {
    display: none;
  }
  .sp-count {
    margin-left: 0;
  }
}

/* a compact rail on a short window: same idea, tighter rows */
@media (min-width: 1100px) and (max-height: 700px) {
  html:not([data-nav="bar"]) .nav-links .nav-link {
    height: 36px;
  }
  html:not([data-nav="bar"]) .brand {
    padding-bottom: 8px;
  }
}

/* ============================================================
   a worn pack re-inks the whole site
   A pack used to stop at its backdrop; the page itself stayed stock gray.
   These fold the pack's tint and palette into the core tokens, so every
   surface, border, overlay and scrollbar takes on the pack. The accent
   (--ac-1/2) was already the pack's c1/c2; this finishes the job. Everything
   is a color-mix against the stock values, so a quiet tint still lands
   somewhere sane. Sits after global.css in the cascade, so it wins the tie
   with html[data-theme] without needing !important.
   ============================================================ */
html[data-pack] {
  --bg: color-mix(in srgb, var(--pk-bg-1) 52%, #0a0a0b);
  --bg-2: color-mix(in srgb, var(--pk-bg-1) 38%, #101012);
  --glass-bg: color-mix(in srgb, var(--pk-bg-1) 34%, #161618);
  --glass-bg-2: color-mix(in srgb, var(--pk-bg-1) 30%, #1c1c1f);
  --glass-bg-3: color-mix(in srgb, var(--pk-1) 12%, #26262b);
  --elev: color-mix(in srgb, var(--pk-bg-1) 30%, #17171a);
  --line: color-mix(in srgb, var(--pk-1) 14%, rgba(255, 255, 255, 0.13));
  --line-2: color-mix(in srgb, var(--pk-1) 24%, rgba(255, 255, 255, 0.26));
  --overlay: color-mix(in srgb, var(--pk-bg-2) 55%, rgba(0, 0, 0, 0.62));
  --thumb: color-mix(in srgb, var(--pk-1) 26%, #3b3b41);
  --thumb-hi: color-mix(in srgb, var(--pk-1) 45%, #56565e);
}
html[data-theme="light"][data-pack] {
  /* light mode mixes toward daylight instead: the pack shows up as a wash
     on a bright page, the same way its backdrop does */
  --bg: color-mix(in srgb, var(--pk-1) 7%, #f3f3f4);
  --bg-2: color-mix(in srgb, var(--pk-1) 10%, #ececef);
  --glass-bg: color-mix(in srgb, var(--pk-1) 6%, #ffffff);
  --glass-bg-2: color-mix(in srgb, var(--pk-1) 8%, #f6f6f7);
  --glass-bg-3: color-mix(in srgb, var(--pk-1) 12%, #ececee);
  --line: color-mix(in srgb, var(--pk-1) 18%, rgba(17, 17, 19, 0.13));
  --line-2: color-mix(in srgb, var(--pk-1) 30%, rgba(17, 17, 19, 0.26));
  --thumb: color-mix(in srgb, var(--pk-1) 24%, #c4c4ca);
  --thumb-hi: color-mix(in srgb, var(--pk-1) 40%, #9d9da5);
}
/* the few places the tokens don't reach: the primary button glows with the
   pack's lead colour and text selection takes it too. :where keeps the
   specificity low so page-level hover and focus rules still win. */
html[data-pack] :where(.btn-primary) {
  box-shadow: 0 6px 22px -10px color-mix(in srgb, var(--pk-1) 60%, transparent);
}
html[data-pack] ::selection {
  background: color-mix(in srgb, var(--pk-1) 34%, transparent);
}

@media (max-width: 1200px) {
  html[data-lib-mode="rail"] .lib-cols {
    grid-template-columns: 200px minmax(0, 1fr);
    gap: 20px;
  }
}

/* 404: the art piece is a Material glyph now, sized like the old svg */
.not-found .art {
  font-size: clamp(96px, 22vw, 170px);
  line-height: 1;
  color: var(--text);
}

/* settings: panic key + cloak buttons */
.keycap {
  min-width: 74px;
  text-align: center;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  letter-spacing: 0.06em;
  text-transform: none;
}
.btn-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 10px;
}

/* 404: drip particles removed; hero-style search sizing */
.not-found .leak {
  display: none;
}
.not-found .hero-search {
  height: 50px;
}
.not-found .hero-search .btn {
  height: 36px;
}

/* ============================================================
   game of the day (home page)
   ============================================================ */
.gotd {
  display: flex;
  gap: 20px;
  align-items: stretch;
}
.gotd-media {
  flex: none;
  width: 190px;
  border-radius: var(--r-md);
  overflow: hidden;
  background: var(--bg-2);
  border: 1px solid var(--line);
  display: grid;
  place-items: center;
  color: var(--text-2);
}
.gotd-media img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.gotd-media .msr {
  font-size: 40px;
  opacity: 0.7;
}
.gotd-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
}
.gotd-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  margin-bottom: 2px;
}
.gotd-head h2 {
  font-size: 17px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.gotd-head h2 .msr {
  font-size: 17px;
  color: var(--ac-1);
}
.gotd-head .hint {
  font-size: 12.5px;
  color: var(--text-2);
  white-space: nowrap;
}
.gotd-name {
  font-size: 21px;
  letter-spacing: -0.02em;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.gotd-desc {
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.gotd-actions {
  display: flex;
  gap: 8px;
  margin-top: auto;
  padding-top: 10px;
}
@media (max-width: 640px) {
  .gotd {
    flex-direction: column;
  }
  .gotd-media {
    width: 100%;
    height: 180px;
  }
}

/* ============================================================
   hidden-attribute guards: display rules on these components
   must never resurrect a box that JS explicitly hid (empty
   game-of-the-day card, marathon controls when off)
   ============================================================ */
.gotd[hidden],
.m-wrap[hidden],
.fav-sec[hidden],
.rec-sec[hidden] {
  display: none !important;
}

/* The glow ring is drawn with mask-composite. In browsers without it the
   full-viewport gradient would paint over the whole screen: disable the
   glow entirely instead. theme.js also guards for this, so the two checks
   agree. */
@supports not ((mask-composite: exclude) or (-webkit-mask-composite: xor)) {
  #null-glow-el {
    display: none !important;
  }
}

/* ============================================================
   screensaver: dim glass overlay, drifting grayscale game art,
   live clock. Sits under the glow border (9997) so the neon ring
   still wraps the screen while it runs.
   ============================================================ */
.ss-ov {
  position: fixed;
  inset: 0;
  z-index: 9995;
  overflow: hidden;
  background: var(--ss-bg, rgba(8, 8, 10, 0.66));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}
.ss-ov.on {
  opacity: 1;
  visibility: visible;
}
html[data-theme="light"] .ss-ov {
  --ss-bg: rgba(240, 240, 242, 0.72);
}
.ss-vign {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 40%, transparent 42%, rgba(0, 0, 0, 0.5));
}
html[data-theme="light"] .ss-vign {
  background: radial-gradient(120% 90% at 50% 40%, transparent 42%, rgba(20, 20, 28, 0.16));
}
.ss-art {
  position: absolute;
  inset: 0;
}
.ss-tile {
  position: absolute;
  width: clamp(92px, 11vw, 150px);
  aspect-ratio: 16 / 10;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.14);
  opacity: 0.5;
  filter: grayscale(1) brightness(0.92);
  animation: ss-drift 20s ease-in-out infinite alternate;
  will-change: transform;
}
.ss-tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.ss-tile.slow {
  opacity: 0.28;
  filter: grayscale(1) brightness(0.78) blur(1.5px);
}
.ss-brand {
  position: absolute;
  top: 7%;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  font-weight: 750;
  letter-spacing: 0.34em;
  color: var(--text-2);
  opacity: 0.85;
}
.ss-brand .msr {
  font-size: 22px;
}
.ss-clock {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -60%);
  font-size: clamp(64px, 12vw, 150px);
  font-weight: 750;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  text-shadow: 0 2px 34px rgba(0, 0, 0, 0.4);
}
.ss-date {
  position: absolute;
  top: calc(50% + clamp(46px, 8vw, 96px));
  left: 50%;
  transform: translateX(-50%);
  font-size: 14.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-2);
}
.ss-hint {
  position: absolute;
  bottom: 6.5%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12.5px;
  letter-spacing: 0.14em;
  white-space: nowrap;
  color: var(--text-2);
  animation: ss-pulse 3.4s ease-in-out infinite;
}
@keyframes ss-pulse {
  0%,
  100% {
    opacity: 0.2;
  }
  50% {
    opacity: 0.62;
  }
}
@keyframes ss-drift {
  0% {
    transform: translate3d(0, 0, 0) rotate(-2.2deg);
  }
  50% {
    transform: translate3d(var(--ss-drift, 16px), calc(var(--ss-drift, 16px) * -0.55), 0) rotate(2.4deg);
  }
  100% {
    transform: translate3d(calc(var(--ss-drift, 16px) * -0.45), var(--ss-drift, 16px), 0) rotate(-1.6deg);
  }
}
html[data-perf="1"] .ss-ov {
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}
@media (prefers-reduced-motion: reduce) {
  .ss-tile {
    animation: none;
  }
}

/* ============================================================
   period-end confetti (grayscale): toggle in settings
   ============================================================ */
.cf-ov {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 300;
  overflow: hidden;
}
.cf-ov .cf-p {
  position: absolute;
  top: -14px;
  width: 9px;
  height: 14px;
  border-radius: 2px;
  opacity: 0;
  animation: cf-fall linear forwards;
}
.cf-ov .cf-p.s {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.cf-ov.on .cf-p {
  animation-name: cf-drop;
}
@keyframes cf-drop {
  0% {
    opacity: 1;
    transform: translate(0, 0) rotate(0deg);
  }
  85% {
    opacity: 1;
  }
  100% {
    opacity: 0;
    transform: translate(var(--cf-drift, 0), 110vh) rotate(var(--cf-rot, 360deg));
  }
}
@media (prefers-reduced-motion: reduce) {
  .cf-ov {
    display: none;
  }
}

/* welcome-modal Continue cooldown hint */
.modal-cool-hint {
  margin-right: auto;
  font-size: 12px;
  color: var(--text-2);
  opacity: 0.8;
}

/* player save backup popup (download/upload localStorage) */
.saves p {
  margin: 6px 0;
  color: var(--text-2);
  line-height: 1.55;
}
.saves p:first-child {
  margin-top: 0;
}
.saves-stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 12px 0;
}
.saves-actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 14px 0;
}
.saves-note {
  font-size: 12.5px;
}

/* ============================================================
   unread announcements dot: top nav icon
   ============================================================ */
.nav-links .nav-link {
  position: relative;
}
.nav-dot {
  position: absolute;
  top: 7px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 0 2px var(--bg-2);
  animation: dotPulse 2.6s var(--ease) infinite;
}
@keyframes dotPulse {
  0%,
  100% {
    transform: scale(1);
    opacity: 1;
  }
  50% {
    transform: scale(1.35);
    opacity: 0.7;
  }

html[data-perf="1"] .nav-dot {
  animation: none;
