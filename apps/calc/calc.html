<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CALC</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;box-sizing:border-box}
  h1{font-size:15px;letter-spacing:.14em;font-weight:700;margin:0;color:rgba(255,255,255,.85)}
  .calc{width:min(92vw,340px);border:1px solid rgba(255,255,255,0.14);border-radius:16px;background:#101014;padding:16px;box-sizing:border-box}
  #screen{text-align:right;font-variant-numeric:tabular-nums;padding:14px 6px 10px;min-height:56px}
  #expr{font-size:13px;color:rgba(255,255,255,0.4);min-height:16px;letter-spacing:.03em}
  #out{font-size:34px;font-weight:600;letter-spacing:.02em;word-break:break-all}
  #keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:6px}
  button{border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.06);color:#f4f4f5;
    border-radius:12px;padding:14px 0;font:inherit;font-size:16px;cursor:pointer;transition:background .12s}
  button:hover{background:rgba(255,255,255,0.15)}
  button:active{background:rgba(255,255,255,0.24)}
  .op{background:rgba(255,255,255,0.12)}
  .eq{background:#f4f4f5;color:#0b0b0d;border-color:#f4f4f5;font-weight:700}
  .wide{grid-column:span 2}
  #hist{width:min(92vw,340px);font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:.03em;min-height:18px;text-align:center}
</style>
</head>
<body>
  <h1>CALC</h1>
  <div class="calc">
    <div id="screen">
      <div id="expr"></div>
      <div id="out">0</div>
    </div>
    <div id="keys">
      <button data-k="AC">AC</button>
      <button data-k="±">±</button>
      <button data-k="%">%</button>
      <button class="op" data-k="/">÷</button>
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button class="op" data-k="*">×</button>
      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button class="op" data-k="-">−</button>
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button class="op" data-k="+">+</button>
      <button class="wide" data-k="0">0</button>
      <button data-k=".">.</button>
      <button class="eq" data-k="=">=</button>
    </div>
  </div>
  <div id="hist"></div>
<script>
(function () {
  var out = document.getElementById("out");
  var expr = document.getElementById("expr");
  var hist = document.getElementById("hist");
  var cur = "0";
  var acc = null;
  var op = null;
  var fresh = true;

  function fmt(n) {
    if (!isFinite(n)) return "Error";
    var s = String(Math.round(n * 1e10) / 1e10);
    return s;
  }

  function apply(a, b, o) {
    if (o === "+") return a + b;
    if (o === "-") return a - b;
    if (o === "*") return a * b;
    if (o === "/") return b === 0 ? NaN : a / b;
    return b;
  }

  function render() {
    out.textContent = cur;
    expr.textContent = (acc !== null ? fmt(acc) + " " + (op === "*" ? "×" : op === "/" ? "÷" : op) + " " : "");
  }

  function press(k) {
    if (k >= "0" && k <= "9") {
      cur = fresh || cur === "0" ? k : cur + k;
      fresh = false;
    } else if (k === ".") {
      if (fresh) { cur = "0."; fresh = false; }
      else if (cur.indexOf(".") < 0) cur += ".";
    } else if (k === "AC") {
      cur = "0"; acc = null; op = null; fresh = true; hist.textContent = "";
    } else if (k === "±") {
      cur = fmt(-parseFloat(cur));
    } else if (k === "%") {
      cur = fmt(parseFloat(cur) / 100);
    } else if (k === "=") {
      if (op !== null && acc !== null) {
        var r = apply(acc, parseFloat(cur), op);
        hist.textContent = fmt(acc) + " " + op + " " + cur + " = " + fmt(r);
        cur = fmt(r);
        acc = null; op = null; fresh = true;
      }
    } else { // operator
      if (op !== null && !fresh) {
        acc = apply(acc, parseFloat(cur), op);
        cur = fmt(acc);
      } else {
        acc = parseFloat(cur);
      }
      op = k;
      fresh = true;
    }
    render();
  }

  document.querySelectorAll("#keys button").forEach(function (b) {
    b.addEventListener("click", function () { press(b.getAttribute("data-k")); });
  });

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (k === "Enter") k = "=";
    if (k === "Escape") k = "AC";
    if (k === "x" || k === "X") k = "*";
    if ((k >= "0" && k <= "9") || "+-*/.%".indexOf(k) >= 0 || k === "=" || k === "AC") {
      press(k);
      e.preventDefault();
    }
  });

  render();
})();
</script>
</body>
</html>
