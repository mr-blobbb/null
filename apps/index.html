<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090b">
  <title>Apps · NULL</title>
  <meta name="description" content="The NULL apps: tools that run inside the NULL player.">
  <link rel="icon" id="favicon" href="../public/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="../public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="../public/icon-192.png">
  <link rel="stylesheet" href="../src/styles/global.css">
  <link rel="stylesheet" href="../src/styles/extra.css">
  <link rel="stylesheet" href="../src/styles/particles.css">
  <link rel="stylesheet" href="../src/styles/perf.css">
  <link rel="stylesheet" href="../src/styles/dev.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var t = p.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
        if (p.glow && p.glow !== "off") document.documentElement.dataset.glow = p.glow;
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="apps" class="lb">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="glow-bg" aria-hidden="true"></div>
  <header data-mount="nav"></header>

  <main id="scrollview" class="sview">
    <div class="page-head">
      <span class="eyebrow"><span data-icon="grid"></span>apps · auto-discovered</span>
      <h1>Apps & tools</h1>
      <p>
        Small tools that live inside NULL instead of sending you off to another
        site. Same deal as games: drop a folder into apps/ and it gets picked
        up automatically, then opens in the player.
      </p>
    </div>
    <div class="toolbar">
      <span class="field" style="width:min(280px,100%)">
        <span data-icon="search"></span>
        <input id="libSearch" type="text" placeholder="Filter by name or label" aria-label="Filter apps">
      </span>
      <span class="select-field sel-wrap" style="width:min(150px,100%)">
        <select id="sortSel" aria-label="Sort apps">
          <option value="name">A-Z</option>
          <option value="id">Label</option>
          <option value="plays">Popularity</option>
          <option value="new">Recently added</option>
        </select>
      </span>
      <span id="count" class="count"></span>
    </div>
    <div id="labelRow" class="filter-row" role="group" aria-label="Filter by label"></div>
    <div id="recSec" class="panel glass rec-sec" hidden></div>
    <div id="favSec" class="fav-sec" hidden></div>
    <div id="grid" class="lib-grid"></div>
    <div id="empty"></div>
  </main>

  <noscript>
    <nav class="ns-nav">
      <a href="../">Home</a><a href="../games/">Games</a><a href="../apps/">Apps</a><a href="../proxies/">Proxies</a><a href="../schedule">Schedule</a><a href="../settings">Settings</a>
    </nav>
  </noscript>

  <script src="../src/utilities/scroll.js"></script>
  <script src="../src/routing/router.js"></script>
  <script src="../src/catalog/generated-catalog.js?v=baa2c9775e"></script>
  <script src="../src/catalog/catalog.js"></script>
  <script src="../src/content/content.js"></script>
  <script src="../src/components/tabpresets.js"></script>
  <script src="../src/components/schedule.js"></script>
  <script src="../src/components/cards.js"></script>
  <script src="../src/components/search.js"></script>
  <script src="../src/components/shell.js"></script>
  <script src="../src/components/devconsole.js"></script>
  <script src="../src/pages/library.js"></script>
</body>
</html>
