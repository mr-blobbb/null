<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopwatch</title>
<style>
  html,body{margin:0;min-height:100%;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;box-sizing:border-box}
  #time{font-size:clamp(44px,14vw,110px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  #time small{font-size:.4em;color:rgba(255,255,255,0.5);font-weight:400}
  .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
  button{border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.06);color:#f4f4f5;
    min-width:112px;padding:14px 22px;border-radius:999px;font-size:15px;letter-spacing:.08em;cursor:pointer}
  button:hover{background:rgba(255,255,255,0.14)}
  button.primary{background:#f4f4f5;color:#0b0b0d;border-color:#f4f4f5}
  button.danger{color:#ff9a9a;border-color:rgba(255,120,120,.5)}
  #laps{width:min(560px,100%);display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
  .lap{display:flex;justify-content:space-between;gap:16px;padding:9px 14px;border-radius:10px;
    border:1px solid rgba(255,255,255,0.09);font-variant-numeric:tabular-nums;font-size:14px;color:rgba(255,255,255,0.8)}
  .lap b{color:#fff}
</style>
</head>
<body>
  <div id="time">0:00<small> .00</small></div>
  <div class="btns">
    <button id="start" class="primary">START</button>
    <button id="lap">LAP</button>
    <button id="reset" class="danger">RESET</button>
  </div>
  <div id="laps"></div>
<script>
(function () {
  var timeEl = document.getElementById("time");
  var lapsEl = document.getElementById("laps");
  var running = false, t0 = 0, acc = 0, timer = null;
  var last = 0;

  function pad(n, w) { return String(n).padStart(w, "0"); }

  function paint(ms) {
    var m = Math.floor(ms / 60000);
    var s = Math.floor(ms / 1000) % 60;
    var cs = Math.floor(ms / 10) % 100;
    timeEl.innerHTML = m + ":" + pad(s, 2) + "<small> ." + pad(cs, 2) + "</small>";
  }

  function tick() {
    paint(acc + (Date.now() - t0));
    timer = setTimeout(tick, 30);
  }

  function toggle() {
    if (running) {
      acc += Date.now() - t0;
      clearTimeout(timer);
      running = false;
      document.getElementById("start").textContent = "START";
      document.getElementById("start").className = "primary";
      last = 0;
    } else {
      t0 = Date.now();
      running = true;
      document.getElementById("start").textContent = "STOP";
      document.getElementById("start").className = "";
      tick();
    }
  }

  function lap() {
    if (!running) return;
    var now = acc + (Date.now() - t0);
    var delta = now - last;
    last = now;
    var row = document.createElement("div");
    row.className = "lap";
    var i = lapsEl.children.length + 1;
    row.innerHTML = "<span>Lap " + i + "</span><b>" + fmt(delta) + "</b><span>+" + fmt(now) + "</span>";
    lapsEl.prepend(row);
  }
  function fmt(ms) {
    var m = Math.floor(ms / 60000);
    var s = Math.floor(ms / 1000) % 60;
    var cs = Math.floor(ms / 10) % 100;
    return m + ":" + pad(s, 2) + "." + pad(cs, 2);
  }

  function reset() {
    running = false;
    clearTimeout(timer);
    acc = 0; last = 0;
    paint(0);
    document.getElementById("start").textContent = "START";
    document.getElementById("start").className = "primary";
    lapsEl.textContent = "";
  }

  document.getElementById("start").addEventListener("click", toggle);
  document.getElementById("lap").addEventListener("click", lap);
  document.getElementById("reset").addEventListener("click", reset);
  addEventListener("keydown", function (e) {
    if (e.key === " ") { e.preventDefault(); toggle(); }
    else if (e.key.toLowerCase() === "l") lap();
    else if (e.key.toLowerCase() === "r") reset();
  });
  paint(0);
})();
</script>
</body>
</html>
