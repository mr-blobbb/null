  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var pal = p.palette || "null";
        document.documentElement.dataset.palette = pal;
        document.documentElement.dataset.theme = pal === "light" || pal === "peach" ? "light" : "dark";
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
        /* the rail is the navigation, so the layout is decided here: without
           this a page would paint the wide bar for a frame first */
        document.documentElement.dataset.nav = "side";
        if (p.labs) document.documentElement.dataset.labs = p.labs;
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="proxies" class="lb">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-mount="nav"></header>

  <main id="main" class="pg">
    <!-- the window that loads a live site through the relay, filled in by
         library.js + components/proxy.js -->
    <section id="proxyBox" class="lb-proxy"></section>

    <div class="lb-top">
      <h1 class="pg-title">Proxies</h1>
      <span class="fld lb-find">
        <span data-i="search" data-i-size="18"></span>
        <input id="libSearch" type="text" placeholder="Search Proxies" autocomplete="off" spellcheck="false" aria-label="Search proxies">
      </span>
      <span class="fld lb-sort">
        <select id="sortSel" aria-label="Sort proxies">
          <option value="name">A–Z</option>
          <option value="plays">Popular</option>
          <option value="id">Label</option>
        </select>
      </span>
      <button type="button" class="bt lb-rand" id="btnRandom"><span data-i="dice" data-i-size="17"></span>Random</button>
      <span class="lb-count" id="count"></span>
    </div>

    <div class="lb-chips" id="libChips" role="group" aria-label="Filter proxies"></div>

    <div class="lb-grid" id="grid"></div>
    <div class="lb-empty" id="empty" hidden></div>
  </main>
