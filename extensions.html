  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var pal = p.palette || "null";
        document.documentElement.dataset.palette = pal;
        document.documentElement.dataset.theme = pal === "light" || pal === "peach" ? "light" : "dark";
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
        /* the rail is the navigation, so the layout is decided here: without
           this a page would paint the wide bar for a frame first */
        document.documentElement.dataset.nav = "side";
      } catch (e) {}
    })();
  </script>
