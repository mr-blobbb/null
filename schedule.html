<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a0a0b">
  <title>Schedule · NULL</title>
  <meta name="description" content="The NULL school schedule: regular days, Homeroom/WIN days, live countdown and editable period names.">
  <link rel="icon" id="favicon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="public/icon-192.png">
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/extra.css">
  <link rel="stylesheet" href="src/styles/particles.css">
  <link rel="stylesheet" href="src/styles/perf.css">
  <!-- extensions, labs, /root and the Labs retextures: site-wide on purpose -->
  <link rel="stylesheet" href="src/styles/ext.css">
  <link rel="stylesheet" href="src/styles/dev.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var pal = p.palette || "null";
        document.documentElement.dataset.palette = pal;
        document.documentElement.dataset.theme = pal === "light" || pal === "peach" ? "light" : "dark";
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
        /* the rail is the navigation, so the layout is decided here: without
           this a page would paint the wide bar for a frame first */
        document.documentElement.dataset.nav = "side";
        if (p.glow && p.glow !== "off") document.documentElement.dataset.glow = p.glow;
        /* a retexture redesigns every page, so it has to land before the
           first paint, exactly like the theme */
        if (p.retexture && p.retexture !== "off") document.documentElement.dataset.retexture = p.retexture;
        if (p.labs) document.documentElement.dataset.labs = p.labs;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="src/styles/v2.css">
</head>
<body data-page="schedule">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="glow-bg" aria-hidden="true"></div>
  <header data-mount="nav"></header>

  <main id="main" class="page page-narrow">
    <div class="page-head">
      <span class="eyebrow"><span data-icon="sched"></span>schedule</span>
      <h1>School schedule</h1>
      <p>
        Mondays and Fridays are regular bell days, Tuesdays and Thursdays are WIN/Homeroom, and Wednesdays are late arrival, so that you can sleep in! Press the edit button to change your lunch period, and your class names!
      </p>
    </div>

    <div class="toolbar" style="margin-top:0">
      <div id="schedChips" class="sched-days" role="tablist"></div>
      <span style="margin-left:auto"></span>
      <div id="editBar"></div>
    </div>

    <div class="panel" style="padding:20px">
      <div id="todayCard" class="today-card"></div>
      <div id="liveBox" class="live-box"></div>
      <div id="editPanel" class="edit-panel" style="display:none"></div>
      <div id="schedGridBox"></div>
      <div id="schedNote" class="sched-note"></div>
    </div>
  </main>

  <footer data-mount="foot"></footer>
  <noscript>
    <nav class="ns-nav">
      <a href="./">Home</a><a href="games/">Games</a><a href="apps/">Apps</a><a href="proxies/">Proxies</a><a href="schedule">Schedule</a><a href="settings">Settings</a>

  <script src="src/utilities/scroll.js"></script>
  <script src="src/routing/router.js"></script>
  <script src="src/catalog/generated-catalog.js?v=baa2c9775e"></script>
  <script src="src/catalog/catalog.js"></script>
  <script src="src/content/content.js"></script>
  <script src="src/components/tabpresets.js"></script>
  <script src="src/components/schedule.js"></script>
  <script src="src/components/cards.js"></script>
  <script src="src/components/search.js"></script>
  <!-- the extensions runtime, ahead of shell.js: the nav asks it for its menu -->
  <script src="src/utilities/ext.js"></script>
  <script src="src/components/shell.js"></script>
  <script src="src/components/devconsole.js"></script>
  <script src="src/pages/schedule.js"></script>
</body>
</html>
