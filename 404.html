<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090b">
  <title>404 — NULL</title>
  <meta name="description" content="Page not found.">
  <link rel="icon" id="favicon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/extra.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var t = p.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (p.perf) document.documentElement.dataset.perf = "1";
        if (p.glow && p.glow !== "off") document.documentElement.dataset.glow = p.glow;
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="404" class="page-404">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-mount="nav"></header>

  <main id="main" class="not-found">
    <div class="numb">Error 404</div>
    <span class="art msr" aria-hidden="true">block</span>
    <div style="display:flex;gap:4px">
      <span class="leak"></span>
      <span class="leak" style="animation-delay:.8s"></span>
      <span class="leak" style="animation-delay:0.5s"></span>
    </div>
    <h1>404 Error</h1>
    <p class="sub">
      Our servers looked everywhere. Even under the digital rug. They found some lint, an old taco emoji, and a lot of dust—but not the page you wanted 🌮.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Take me home</a>
      <a class="btn btn-outline" href="/games.html">Browse games</a>
      <a class="btn btn-ghost" href="/backups.html">Backup links</a>
    </div>
  </main>

  <footer data-mount="foot"></footer>
  <noscript>
    <nav class="ns-nav">
      <a href="/">Home</a><a href="/games.html">Games</a><a href="/apps.html">Apps</a><a href="/proxies.html">Proxies</a><a href="/schedule.html">Schedule</a><a href="/settings.html">Settings</a>
    </nav>
  </noscript>

  <script src="/src/utilities/store.js"></script>
  <script src="/src/utilities/dom.js"></script>
  <script src="/src/utilities/modal.js"></script>
  <script src="/src/utilities/theme.js"></script>
  <script src="/src/utilities/scroll.js"></script>
  <script src="/src/routing/router.js"></script>
  <script src="/src/catalog/generated-catalog.js"></script>
  <script src="/src/catalog/catalog.js"></script>
  <script src="/src/content/content.js"></script>
  <script src="/src/components/tabpresets.js"></script>
  <script src="/src/components/schedule.js"></script>
  <script src="/src/components/cards.js"></script>
  <script src="/src/components/search.js"></script>
  <script src="/src/components/shell.js"></script>
</body>
</html>
