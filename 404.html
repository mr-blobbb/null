<!doctype html>
<!-- A static host answers a missing address with this page and keeps the
     address, so a 404 for /games/typo/ is served at /games/typo/: every path
     on this one page is written from the root, and <html data-root> tells the
     shared JS where the root is. The other pages link relatively and do not
     have to. -->
<html lang="en" data-root="/">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090b">
  <title>404 · NULL</title>
  <meta name="description" content="Page not found.">
  <link rel="icon" id="favicon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/public/icon-192.png">
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/extra.css">
  <link rel="stylesheet" href="/src/styles/particles.css">
  <link rel="stylesheet" href="/src/styles/perf.css">
  <link rel="stylesheet" href="/src/styles/dev.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var t = p.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
        if (p.glow && p.glow !== "off") document.documentElement.dataset.glow = p.glow;
      } catch (e) {}
    })();
  </script>
  <script>
    /* A plain static host (GitHub Pages included) only serves exact files and
       directory indexes, so an extensionless URL like /schedule lands on this
       page. Before showing the barrel, check the two shapes a static host can
       actually serve /schedule.html and /schedule/index.html, then hop to
       whichever exists. Typed URLs and old links keep working; a genuinely
       missing page still gets the 404. */
    (function () {
      var path = location.pathname.replace(/\/+$/, "");
      if (!path || /\.[a-z0-9]+$/i.test(path)) return;
      var tries = [path + ".html", path + "/index.html"];
      (function next(i) {
        if (i >= tries.length) return;
        fetch(tries[i], { method: "HEAD", cache: "no-store" })
          .then(function (res) {
            if (res.ok) location.replace(tries[i] + location.search + location.hash);
            else next(i + 1);
          })
          .catch(function () {
            next(i + 1);
          });
      })(0);
    })();
  </script>
</head>
<body data-page="404" class="page-404">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="glow-bg" aria-hidden="true"></div>
  <header data-mount="nav"></header>

  <main id="main" class="not-found">
    <div class="numb">Error 404</div>
    <!-- the icon font's "block" glyph: see the P map in src/utilities/dom.js -->
    <span class="art msr" aria-hidden="true">&#xe033;</span>
    <h1>404 Error</h1>
    <p class="sub">
      Our servers looked everywhere. Even under the digital rug. They found some lint, an old taco emoji, and a lot of dust, but not the page you wanted 🌮.
    </p>
    <form class="hero-search field" id="nfSearch" role="search" aria-label="Search NULL">
      <span data-icon="search"></span>
      <input id="nfSearchInput" type="text" placeholder="Search games, apps, proxies…" autocomplete="off" aria-label="Search NULL">
      <button type="submit" class="btn btn-primary btn-sm">Search</button>
    </form>
    <div class="actions">
      <a class="btn btn-primary" href="/">Take me home</a>
      <a class="btn btn-outline" href="/games/">Browse games</a>
      <a class="btn btn-ghost" href="/backups">Backup links</a>
    </div>
  </main>

  <footer data-mount="foot"></footer>
  <noscript>

      <a href="/">Home</a><a href="/games/">Games</a><a href="/apps/">Apps</a><a href="/proxies/">Proxies</a><a href="/schedule">Schedule</a><a href="/settings">Settings</a>
    </nav>
  </noscript>

  <script src="/src/utilities/store.js"></script>
  <script src="/src/utilities/econ.js"></script>
  <script src="/src/utilities/dom.js"></script>
  <script src="/src/utilities/modal.js"></script>
  <script src="/src/utilities/theme.js"></script>
  <script src="/src/components/seasons.js"></script>
  <script src="/src/utilities/scroll.js"></script>
  <script src="/src/routing/router.js"></script>
  <script src="/src/catalog/generated-catalog.js?v=baa2c9775e"></script>
  <script src="/src/catalog/catalog.js"></script>
  <script src="/src/content/content.js"></script>
  <script src="/src/components/tabpresets.js"></script>
  <script src="/src/components/schedule.js"></script>

  <script src="/src/components/search.js"></script>
  <script src="/src/components/shell.js"></script>
  <script src="/src/components/devconsole.js"></script>
  <script>
    /* the 404 search bar: same behavior as the home hero field */
    (function () {
      var form = document.getElementById("nfSearch");
      var input = document.getElementById("nfSearchInput");
      if (!form || !window.N || !N.search) return;
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        N.search.open(input.value.trim());
      });
      form.addEventListener("click", function (e) {
        if (e.target.tagName !== "INPUT" && e.target.tagName !== "BUTTON") input.focus();
      });
    })();
  </script>
</body>
</html>
