<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#09090b">
  <title>NULL player</title>
  <meta name="description" content="The NULL player.">
  <link rel="icon" id="favicon" href="/public/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/public/icon-192.png">
  <link rel="stylesheet" href="/src/styles/global.css">
  <link rel="stylesheet" href="/src/styles/extra.css">
  <link rel="stylesheet" href="/src/styles/particles.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var t = p.theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        if (p.perf) document.documentElement.dataset.perf = "1";
        if (p.glow && p.glow !== "off") document.documentElement.dataset.glow = p.glow;
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="player" class="player-page no-chrome">
  <div class="player" id="playerRoot">
    <div class="player-bar">
      <button type="button" class="btn btn-ghost btn-icon" id="btnBack" title="Back to the library" aria-label="Back">
        <span data-icon="back"></span>
      </button>
      <div class="player-meta">
        <b id="pName">NULL</b>
        <span id="pKind">player</span>
      </div>
      <div class="player-coin" id="pCoin" title="NULL coins — earned by playing">
        <span data-icon="coin"></span><b id="pCoinVal">0</b>
      </div>
      <div class="player-actions">
        <button type="button" class="btn-icon-sm btn-outline" id="btnFav" title="Favorite" aria-label="Favorite" style="width:38px;height:38px;border-radius:11px">
          <span data-icon="star"></span>
        </button>
        <button type="button" class="btn-icon-sm btn-outline" id="btnReload" title="Reload" aria-label="Reload" style="width:38px;height:38px;border-radius:11px">
          <span data-icon="refresh"></span>
        </button>
        <div class="pop-wrap" id="cloakWrap">
          <button type="button" class="btn-icon-sm btn-outline" title="Cloak this tab" aria-label="Cloak options" style="width:38px;height:38px;border-radius:11px">
            <span data-icon="tab"></span>
          </button>
          <div class="pop glass-2 elev" id="cloakPop" style="top:calc(100% + 8px);bottom:auto">
            <button type="button" id="cloakTab"><span data-icon="ext"></span>Open in new tab</button>
            <button type="button" id="cloakBlank"><span data-icon="ban"></span>about:blank mode</button>
            <button type="button" id="cloakBlob"><span data-icon="file"></span>blob: mode</button>
            <button type="button" id="cloakCopy"><span data-icon="copy"></span>Copy link</button>
          </div>
        </div>
        <button type="button" class="btn-icon-sm btn-outline" id="btnSaves" title="Game saves (localStorage)" aria-label="Game saves (localStorage)" style="width:38px;height:38px;border-radius:11px">
          <span data-icon="save"></span>
        </button>
        <button type="button" class="btn-icon-sm btn-outline" id="btnFull" title="Fullscreen" aria-label="Fullscreen" style="width:38px;height:38px;border-radius:11px">
          <span data-icon="max"></span>
        </button>
      </div>
    </div>

    <div class="player-frame glow-el" id="pFrameWrap">
      <div class="player-loading" id="pLoad">
        <div class="pl-mark" aria-hidden="true">
          <span class="pl-ring"></span>
          <span class="pl-core" data-icon="ban"></span>
        </div>
        <span class="pl-txt">warming up the player…</span>
      </div>
      <iframe id="pFrame" title="Content" allow="fullscreen"></iframe>
      <div class="empty" id="pEmpty" style="display:none;position:absolute;inset:0;place-content:center;border:0;border-radius:0">
        <span data-icon="file"></span>
        <b>Nothing to play here</b>
        <p>This item has no playable file in the NULL library yet.<br>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:8px" onclick="history.length > 1 ? history.back() : (location.href = '/games')">Go back</button></p>
      </div>
    </div>
  </div>

  <script src="/src/utilities/store.js"></script>
  <script src="/src/utilities/econ.js"></script>
  <script src="/src/utilities/dom.js"></script>
  <script src="/src/utilities/modal.js"></script>
  <script src="/src/utilities/theme.js"></script>
  <script src="/src/components/seasons.js"></script>
  <script src="/src/routing/router.js"></script>
  <script src="/src/catalog/generated-catalog.js?v=65e4d5d3b8"></script>
  <script src="/src/catalog/catalog.js"></script>
  <script src="/src/content/content.js"></script>
  <script src="/src/components/tabpresets.js"></script>
  <script src="/src/components/cards.js"></script>
  <script src="/src/components/shell.js"></script>
  <script src="/src/components/devconsole.js"></script>
  <script src="/src/pages/player.js"></script>
</body>
</html>
