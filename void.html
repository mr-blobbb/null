<!doctype html>
<html lang="en" class="egg-black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>void · NULL</title>
  <meta name="description" content="Nothing to see here.">
  <link rel="icon" id="favicon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="public/icon-192.png">
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/extra.css">
  <link rel="stylesheet" href="src/styles/perf.css">
  <link rel="stylesheet" href="src/styles/eggs.css">
  <script>
    /* same pre-paint theme read the rest of the site does */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        document.documentElement.dataset.theme = p.theme === "light" ? "light" : "dark";
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="src/styles/v2.css">
</head>
<body data-page="void" class="no-chrome">
  <!-- no nav, no footer: the whole page is black on purpose (html.egg-black) -->
  <main id="main" class="egg egg-void" role="button" tabindex="0" aria-label="The void awaits">
    <span class="await">The void awaits...</span>
  </main>

  <script src="src/utilities/dom.js"></script>
  <script src="src/utilities/eggs.js"></script>
  <script>
    (function () {
      var spot = document.getElementById("main");
      function poke() {
        if (window.N && N.eggs) N.eggs.pop("•𐃷• ...lmao");
      }
      spot.addEventListener("click", poke);
      spot.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          poke();
        }
      });
    })();
  </script>
</body>
</html>
