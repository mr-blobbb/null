# Privacy

NULL is a static website. There is no backend, no database and no analytics server run by NULL.

## What NULL stores

Everything NULL remembers lives in your browser's `localStorage` on the device you're using:

- Preferences (theme, accent, tab preset, performance mode)
- Recently played items
- Favorites
- Small flags (for example, whether you have seen the welcome modal)

You can wipe all of it at any time from **Settings → Danger zone → Wipe all NULL data**, or by clearing your browser's site data.

## What NULL does NOT do

- NULL does not upload, sell or share your data anywhere.
- NULL has no accounts and no servers of its own.
- NULL does not track you across sites.

## Third-party content

Games, apps and proxies may be hosted by third parties or link out to external websites. NULL itself never sends them any of your data — but anything you do on an external site is governed by that site's own privacy rules. That includes any cookies or trackers they set when you visit them through a NULL proxy link.

## Popups and permissions

Some features (cloaking modes, external links) may ask your browser for popup or redirect permission. That request comes from NULL and is limited to NULL's own functionality — the browser controls every permission prompt.
