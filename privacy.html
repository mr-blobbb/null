# Privacy Policy

**Effective date:** September 13, 2026
**Last revised:** September 13, 2026

This Privacy Policy describes how the operator of NULL ("NULL", the "Service", "we", "us", or "our") handles information in connection with your access to and use of the Service. It applies to the Service only. It does not apply to any third-party website, game, or application you reach through the Service.

By using the Service, you acknowledge that you have read and understood this Privacy Policy. This Policy should be read together with our Terms of Service.

## 1. Definitions

- "Personal Data" means information relating to an identified or identifiable natural person, as that term is defined under applicable data protection law, including the EU and UK General Data Protection Regulation ("GDPR") and the California Consumer Privacy Act as amended ("CCPA").
- "Processing" means any operation performed on data, including collection, storage, use, disclosure, and deletion.
- "Local Storage Data" means information the Service writes to the storage facility of your own browser, on your own device, under the `null:` key prefix.
- "Controller" means the entity that determines the purposes and means of processing Personal Data. As explained in section 3, we are not a Controller of any Personal Data collected through the Service, because the Service does not collect any.

## 2. Summary of our position

NULL is a static website. It has no backend application, no database, no user accounts, and no analytics service of our own. The Service is delivered to your browser as ordinary HTML, CSS, JavaScript, and data files. We do not receive, and are technically incapable of receiving, the information you enter into or generate inside the Service.

In data protection terms, all processing associated with your use of the Service is local processing carried out by your own browser on your own device, under your control and, where applicable, under the control of the school or institution that manages that device.

## 3. Information we do not collect

The Service does not collect, transmit, or have access to:

- your name, email address, postal address, telephone number, or any other contact detail;
- account credentials, passwords, or authentication tokens, because no account system exists;
- payment or financial information, because nothing is sold and no payment is accepted;
- your precise or approximate location;
- your device identifiers, advertising identifiers, or fingerprinting signals;
- your internet protocol address, except as unavoidably processed by the static hosting provider in the course of serving a request (see section 8);
- behavioral analytics, clickstream data, session recordings, heatmaps, or telemetry of any kind;
- the content of your play sessions, your favorites, your play history, or your virtual coin balance.

## 4. Information stored locally on your device

The Service stores a limited set of information in your browser's local storage so that it can remember your choices between visits. This information never leaves your device through the Service, and we never see it. It typically comprises:

- **Preferences**: theme, accent color, glow border, particle set, seasonal mode, performance mode, tab preset, and similar display settings.
- **Library state**: favorites, recently played games, and the last filters or sort order you used.
- **Progress and rewards**: experience, virtual coins, unlocked shop items, daily quest status, crate streak, and achievements.
- **Interface flags**: small booleans recording whether a one-time notice, such as the welcome introduction, has already been shown.
- **Development flags**: whether the built-in developer console has been unlocked on this device.

This information is not Personal Data in our hands, because it is never transmitted to us. It is, however, Personal Data in the hands of the school, employer, or network administrator who manages the device or browser profile you are using, and it may be visible to anyone with access to that device or profile.

## 5. Legal bases for processing

Because we do not process Personal Data on our own systems, we do not rely on any legal basis under Article 6 of the GDPR to process it. To the extent that the storage of Local Storage Data on your device is considered processing by us at all, it is carried out on the basis of your consent, which you provide by using the Service and which you may withdraw at any time by clearing the Service's site data in your browser or using the wipe control in Settings.

## 6. Cookies and similar technologies

The Service sets no cookies: not first-party, not third-party, not advertising, not tracking, and not session cookies. It does not use web beacons, pixel tags, locally stored objects, or fingerprinting scripts. It relies solely on browser local storage for persistence, which is not transmitted to any server automatically. Please see the Cookies page for a fuller explanation of the distinction between cookies and local storage.

The Service does use a service worker and a browser cache to make itself installable and usable offline. Cached copies of the Service's own files stay on your device and are never uploaded anywhere.

## 7. Third-party content and destinations

The Service is a hub. It embeds and links to content that belongs to other parties, including games, applications, and external websites listed as proxy links. When you interact with that content:

1. your browser contacts the third party's server directly, and that third party may receive your IP address, user agent, and other request metadata;
2. that third party may set its own cookies, local storage, or similar identifiers, and may deploy its own analytics, advertising, or tracking technologies;
3. that third party's handling of your information is governed exclusively by its own privacy policy, which we do not control and cannot audit.

We receive none of the information those third parties collect. We recommend that you review the privacy policy of any external destination before interacting with it, and that you avoid submitting personal information to destinations you do not trust.

## 8. Hosting and server logs

The Service is published as a static site through a third-party hosting provider, such as GitHub Pages, and may also be accessed through mirrors listed on the Backups page. Like any web host, these providers may automatically record standard technical request logs, including IP addresses, timestamps, and requested paths, for security, abuse prevention, and operational purposes. Those logs are created and controlled by the hosting provider, not by us. We do not request, access, aggregate, or analyze them, and we cannot use them to identify you. Please consult the hosting provider's own privacy documentation for details of its retention and use of such logs.

## 9. Children's and student privacy

The Service is intended for a general audience and is not directed to children under the age of fourteen. We do not knowingly collect Personal Data from children or from anyone else, because we do not collect Personal Data at all. We do not condition access to any feature on the disclosure of personal information.

Where the Service is used on school-managed devices or networks, that institution is responsible for compliance with applicable education privacy law, including the Family Educational Rights and Privacy Act ("FERPA"), the Children's Online Privacy Protection Act ("COPPA"), and comparable state and national statutes. Because the Service does not transmit any information to us, no student data is disclosed to us and no vendor data processing agreement is required.

## 10. Your rights

Depending on your jurisdiction, you may have rights under the GDPR, the CCPA, or comparable law, including the rights to access, correct, delete, restrict, or port your Personal Data, to object to processing, and to withdraw consent.

Because the Service does not transmit information to us, we hold no Personal Data about you and there is nothing on our side to access, correct, delete, or export. You can exercise these rights directly and completely by:

1. using the **Download** button in Settings, which exports everything the Service has stored on your device as a JSON file, satisfying a data portability request in full;
2. using the **Upload** button in Settings to restore such an export;
3. using the **Wipe all NULL data** control in Settings, or clearing the Service's site data in your browser, which irreversibly deletes everything the Service stored, satisfying an erasure request in full.

We do not sell or share Personal Data, do not use it for cross-context behavioral advertising, and do not use it to build profiles of any kind.

## 11. Retention

Local Storage Data remains on your device until you remove it. It is not subject to any retention schedule on our side, because we hold none. Clearing your browser's site data, using the wipe control in Settings, or uninstalling the browser profile will delete it permanently. Deletion is irreversible, and we cannot restore data we never received.

## 12. International transfers

We do not transfer Personal Data across borders, because we do not receive Personal Data. If a third-party destination you visit through the Service transfers your information internationally, that transfer is governed by that party's own policies and safeguards.

## 13. Security

The Service protects your Local Storage Data only as well as your device and browser protect it. We recommend using a device account with a password, keeping your browser current, and downloading a backup export of your NULL data if you value it, since anyone with access to your browser profile can read or erase it. Because the Service has no server, there is no server-side store of your information to breach, and no account credentials exist that could be stolen.

## 14. Do Not Track and Global Privacy Control

The Service does not track you across sites, and therefore does not respond differently to the Do Not Track signal or to a Global Privacy Control setting. No tracking occurs whether or not such a signal is present.

## 15. Changes to this Policy

We may revise this Policy from time to time to reflect changes to the Service or to applicable law. The current version will always be published on this page with a revised date at the top. Continued use of the Service after a revision is published constitutes acceptance of it.

## 16. Contact

Questions about this Policy may be directed to the repository operator through the project's public repository. Because we hold no Personal Data, we are unable to retrieve, amend, or delete information about you on request, but we are happy to explain this Policy in more detail.

*Last updated: September 13, 2026.*
