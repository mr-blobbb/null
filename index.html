<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08080a" />
    <title>null</title>
    <meta
      name="description"
      content="NULL: a flat, fast hub for games, apps, proxies and tools. Local first, no accounts."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- the display faces a profile can put its own name in. Loaded only for
         that; nothing else on the site uses them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat&family=Gochi+Hand&family=Nunito:wght@600;700;800&family=Pacifico&family=Playfair+Display:wght@700&family=Press+Start+2P&family=Silkscreen&family=Space+Mono&display=swap"
    />
    <script>
      /* Paint the palette before React mounts so a dark theme never flashes
         light. Mirrors src/lib/themes.ts: keep the two in step. */
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
          var id = p.palette || "null";
          var root = document.documentElement;
          root.dataset.palette = id;
          var light = id === "light" || id === "peach";
          root.dataset.mode = light ? "light" : "dark";
          root.style.colorScheme = light ? "light" : "dark";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>NULL needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
