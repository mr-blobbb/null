<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#08080a">
  <title>Settings · null</title>
  <meta name="description" content="Themes, data and the paperwork, all in a sheet over whatever page you were on.">
  <link rel="icon" id="favicon" href="public/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="public/manifest.webmanifest">
  <link rel="apple-touch-icon" href="public/icon-192.png">
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/extra.css">
  <link rel="stylesheet" href="src/styles/particles.css">

  <link rel="stylesheet" href="src/styles/v2b.css">
  <link rel="stylesheet" href="src/styles/settings.css">
  <script>
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem("null:prefs") || "{}");
        var pal = p.palette || "null";
        document.documentElement.dataset.palette = pal;
        document.documentElement.dataset.theme = pal === "light" || pal === "peach" ? "light" : "dark";
        if (p.perf) document.documentElement.dataset.perf = p.perf === "ultra" ? "ultra" : "1";
        document.documentElement.dataset.nav = "side";
      } catch (e) {}
    })();
  </script>
</head>
<!-- Settings is a sheet over the site, not a place of its own. This page is
     the address: it opens the sheet on top of the front door and takes you
     home when you close it, so a bookmark to /settings keeps working. -->
<body data-page="settings" class="settings-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <header data-mount="nav"></header>

  <main id="main" class="pg">
    <h1 class="pg-title">Settings</h1>
    <p class="pg-sub">The sheet should be open. If it is not, <a href="#" data-open-settings>open it</a>.</p>
  </main>

  <script src="src/utilities/store.js"></script>
  <script src="src/utilities/econ.js"></script>
  <script src="src/utilities/icons.generated.js"></script>
  <script src="src/utilities/dom.js"></script>
  <script src="src/utilities/modal.js"></script>
  <script src="src/utilities/theme.js"></script>
  <script src="src/components/seasons.js"></script>
  <script src="src/utilities/scroll.js"></script>
  <script src="src/routing/router.js"></script>
  <script src="src/catalog/generated-catalog.js?v=baa2c9775e"></script>
  <script src="src/catalog/catalog.js"></script>
  <script src="src/content/content.js"></script>
  <script src="src/components/tabpresets.js"></script>
  <script src="src/components/cards.js"></script>
  <script src="src/components/search.js"></script>
  <script src="src/utilities/ext.js"></script>
  <script src="src/components/tabs.js"></script>
  <script src="src/components/settings-sheet.js"></script>
  <script src="src/components/shell.js"></script>
  <script>
    /* closing the sheet on this address goes back to the front door */
    document.body.dataset.stRedirect = "/";
  </script>
</body>
</html>
